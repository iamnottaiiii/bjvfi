<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bjvfi mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  *{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  html,body{overflow-x:hidden;}
  input,textarea,.r-body,.r-body *{-webkit-user-select:text; user-select:text; -webkit-touch-callout:default;}
  button:focus{outline:none;}
  :root{
    --ink:#F2F2F5;
    --gold:#FFD24D;
    --blue:#6FA8FF;
    --red:#E07A7A;
    --panel:rgba(242,242,245,.05);
    --panel-strong:rgba(242,242,245,.09);
    --line:rgba(242,242,245,.14);
    --field:rgba(0,0,0,.38);
    --row:#101014;
    --cx:50%; --cy:42%;
  }
  html,body{height:100%;}
  body{
    font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    background:#000; color:var(--ink); overflow:hidden;
  }
  /* bjvfi void, copied from the homepage */
  .void{position:fixed; inset:0; overflow:hidden; background:#000; color:var(--ink);}
  .void::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      repeating-conic-gradient(from 0deg at var(--cx) var(--cy), rgba(255,255,255,.012) 0deg 1deg, transparent 1deg 2deg),
      repeating-radial-gradient(circle at var(--cx) var(--cy), rgba(255,255,255,.010) 0px 1px, transparent 1px 4px),
      radial-gradient(circle at var(--cx) var(--cy), #161616 0%, #0d0d0d 34%, #050505 62%, #010101 100%);
  }
  .void::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at var(--cx) var(--cy), transparent 0%, transparent 45%, rgba(0,0,0,.55) 82%, rgba(0,0,0,.9) 100%);
  }
  .layer{position:relative; z-index:1; height:100%;}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
  input,textarea{font:inherit; color:inherit;}
  ::placeholder{color:inherit; opacity:.45;}

  /* ---------- login ---------- */
  .login{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; padding:24px;}
  .mark{font-size:clamp(3rem,9vw,5.2rem); font-weight:500; letter-spacing:-.04em; text-shadow:0 0 30px rgba(255,255,255,.25), 0 0 70px rgba(255,255,255,.12);}
  .login-box{width:min(400px,100%); display:flex; flex-direction:column; gap:14px;}
  .login-box label{font-size:.8rem; display:flex; flex-direction:column; gap:8px;}
  .field{
    background:var(--field); border:1px solid var(--line); border-radius:999px;
    padding:15px 20px; font-size:.95rem; outline:none; width:100%;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  }
  .field:focus{border-color:var(--ink);}
  .go{
    margin-top:6px; border-radius:999px; padding:15px 20px; font-size:.95rem; font-weight:700;
    background:var(--ink); color:#000; width:100%;
  }
  .go:active{transform:scale(.99);}

  /* ---------- app ---------- */
  .app{height:100%; display:none; grid-template-columns:1fr; gap:14px; padding:98px 14px 96px;}
  .app.split{grid-template-columns:380px 1fr;}
  .app.list-hidden{grid-template-columns:1fr;}
  .app.list-hidden .list-panel{display:none;}
  .app.on{display:grid;}

  /* floating dock, not a header */
  .dock{
    position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:6;
    display:none; align-items:center; gap:10px; max-width:96vw; overflow-x:hidden; padding:4px;
  }
  #dockToggle{
    position:fixed; left:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:41;
    width:46px; height:46px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel-strong); color:var(--ink); cursor:pointer; display:none;
    align-items:center; justify-content:center;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 26px rgba(0,0,0,.3);
  }
  .dock button{
    border:1px solid var(--line); background:transparent;
    flex:1 1 0; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center;
  }
  .compose-float{
    position:static; width:40px; height:40px; border-radius:50%; flex:0 0 auto;
    border:none; background:var(--gold); color:#111; cursor:pointer; display:none;
    align-items:center; justify-content:center;
  }
  .compose-float.on{display:flex;}
  .show-list{
    position:fixed; top:16px; left:16px; z-index:6; display:none;
    border-radius:999px; padding:11px 16px; font-size:.85rem;
    border:1px solid var(--line); background:transparent;
  }
  .show-list.on{display:block;}
  .mini{border-radius:999px; padding:7px 12px; font-size:.8rem; border:1px solid var(--line); background:transparent;}
  .set-group{margin-bottom:18px;}
  .set-label{font-size:.8rem; font-weight:700; margin-bottom:8px;}
  .set-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .set-row .pill.sel{background:transparent; border-color:var(--ink); font-weight:700;}
  select.fld, input.fld{width:100%; border-radius:999px; padding:11px 16px; border:1px solid var(--line); background:var(--field); color:var(--ink); font:inherit; font-size:.88rem;}
  .set-row select.fld{width:auto; flex:1;}
  .dock.on{display:flex;}
  .dock .who{font-size:.78rem; font-weight:700; padding:0 8px 0 12px; white-space:nowrap;}
  .dock button{border-radius:999px; padding:10px 14px; font-size:.85rem; white-space:nowrap; display:flex; align-items:center; gap:7px;}
  .dock button.sel{background:transparent; border-color:var(--ink); font-weight:700;}
  .dock .compose{margin:0; padding:10px 16px;}
  .dock .dot{width:8px; height:8px; border-radius:50%; background:var(--gold); display:none;}
  .dock .has .dot{display:block;}
  .theme-float{
    position:fixed; right:16px; bottom:16px; z-index:7;
    border-radius:999px; padding:11px 16px; font-size:.85rem;
    border:1px solid var(--line); background:var(--panel-strong);
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .app-on .theme-float{bottom:92px;}

  /* swipe rows */
  .swipe{position:relative; overflow:hidden; flex:none; border-bottom:1px solid var(--line);}
  .msgs .swipe:last-child{border-bottom:none;}
  .msg .when2{align-self:flex-end; font-size:.68rem; margin-top:1px;}
  .bavatar.sm{width:40px; height:40px; font-size:.8rem;}
  .r-when{font-size:.75rem; margin-left:auto; padding-top:8px; white-space:nowrap;}
  .swipe .cue{position:absolute; top:0; bottom:0; display:flex; align-items:center; padding:0 18px; font-size:.82rem; font-weight:700; color:#000; opacity:0; pointer-events:none;}
  .swipe .cue[data-a="delete"]{background:var(--red); justify-content:flex-end;}
  .swipe .cue[data-a="mark"]{background:var(--blue); justify-content:flex-start;}
  .swipe .cue[data-a="junk"]{background:var(--gold); justify-content:flex-end;}
    .swipe .msg{position:relative; background:transparent; touch-action:pan-y;}
  .reader-panel{display:none;}
  .app.split .reader-panel{display:flex;}
  .reader-panel{background:transparent; border-color:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; box-shadow:none;}
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:22px;
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
    display:flex; flex-direction:column; min-height:0; overflow:hidden;
  }
  .side{padding:18px 14px; gap:6px;}
  .who{padding:2px 10px 16px;}
  .who .addr{font-size:.82rem; font-weight:700; word-break:break-all;}
  .who .plan{font-size:.75rem; opacity:.7; margin-top:4px;}
  .compose{
    border-radius:999px; padding:12px 18px; font-weight:700; font-size:.9rem;
    background:var(--gold); color:#000; margin:0 2px 14px; text-align:center;
  }
  .folder{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:11px 12px; border-radius:999px; font-size:.9rem; text-align:left; width:100%;
  }
  .folder:hover{background:var(--panel-strong);}
  .folder.sel{background:var(--panel-strong); box-shadow:inset 0 0 0 1px var(--line);}
  .folder .n{font-size:.78rem; opacity:.75;}
  .folder .dot{width:8px; height:8px; border-radius:50%; background:var(--gold); display:none;}
  .folder.has .dot{display:block;}
  .side .sp{flex:1;}
  .out{padding:11px 12px; border-radius:999px; font-size:.9rem; text-align:left; opacity:.85;}
  .out:hover{background:var(--panel-strong);}

  .list-head{padding:16px 16px 10px; display:flex; flex-direction:column; gap:12px;}
  .list-title{font-size:1.05rem; font-weight:700; padding:0 4px;}
  .search{
    background:var(--field); border:1px solid var(--line); border-radius:999px;
    padding:11px 16px; font-size:.88rem; outline:none; width:100%;
  }
  .search:focus{border-color:var(--ink);}
  .msgs{overflow-y:auto; overflow-x:hidden; padding:2px 8px 10px; display:flex; flex-direction:column; gap:2px;}
  .msg{padding:13px 12px; border-radius:16px; text-align:left; width:100%; display:flex; flex-direction:row; gap:12px; align-items:flex-start;}
  .sig-img{max-width:220px; margin-top:14px; border-radius:8px; display:block;}
  .toolbar{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .acct-line{display:flex; align-items:center; gap:10px; background:none; border:none; color:inherit; font:inherit; cursor:pointer; padding:0 0 12px; text-align:left; max-width:100%;}
  .acct-line .em{font-size:.85rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .acct-item{display:flex; align-items:center; gap:12px; width:100%; padding:12px 10px; border-radius:14px; background:transparent; border:none; color:var(--ink); font:inherit; text-align:left; cursor:pointer;}
  .acct-item.sel{box-shadow:inset 0 0 0 1px var(--line);}
  .acct-item .em{font-size:.9rem; font-weight:600;}
  .acct-item .pv{font-size:.78rem;}
  .prov-line{font-size:.82rem; min-height:1.1em; padding:0 6px;}
  .fmtbar{position:relative; margin-bottom:10px; display:flex;}
  .dotbtn{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--ink); font-size:.9rem; letter-spacing:2px; cursor:pointer; padding:0 0 0 3px;}
  .fmt-pop{position:absolute; left:48px; top:0; display:none; gap:2px; padding:5px; border-radius:999px; background:var(--panel-strong); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); z-index:6;}
  .fmt-pop.on{display:flex;}
  .fmt-pop button{width:36px; height:36px; border-radius:50%; border:none; background:transparent; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:.95rem;}
  .fmt-pop button.sel{box-shadow:inset 0 0 0 1px var(--gold); color:var(--gold);}
  #quoteWrap{margin-top:16px;}
  .quote-head{display:flex; justify-content:flex-end;}
  #quoteText{white-space:pre-wrap; font-size:.9rem; line-height:1.55;}
  .toolbar button{border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 12px; font-size:.78rem;}
  .toolbar button.sel{border-color:var(--ink); font-weight:700;}
  .set-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 26px;}
  .reader{display:flex; flex-direction:column; height:100%;}
  .app:not(.split){justify-items:center;}
  .app:not(.split) .list-panel{width:min(880px,100%);}
  .bavatar{width:46px; height:46px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.9rem; color:#000; background:var(--gold);}
  .who-line{display:flex; align-items:center; gap:13px; background:none; border:none; padding:0; text-align:left; cursor:pointer; color:inherit; font:inherit;}
  .who-line .nm{font-size:1rem; font-weight:700;}
  .who-line .ad{font-size:.82rem;}
  .r-top{position:relative; display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .dots{background:transparent; border:1px solid var(--line); border-radius:999px; padding:7px 15px; font-size:.9rem; letter-spacing:2px; line-height:1;}
  .dots-menu{position:absolute; top:42px; right:0; z-index:8; display:none; flex-direction:column; min-width:170px; padding:6px; border-radius:16px; border:1px solid var(--line); background:var(--panel-strong); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); box-shadow:0 18px 50px rgba(0,0,0,.45);}
  .dots-menu.on{display:flex;}
  .dots-menu button{background:transparent; border:none; text-align:left; padding:11px 14px; border-radius:10px; font-size:.88rem; color:var(--ink);}
  .prevnext{margin-top:auto; padding-top:26px; display:flex; justify-content:space-between;}
  #acctVeil{background:rgba(0,0,0,.22);}
  #settingsVeil{background:rgba(0,0,0,.22);}
  #settingsVeil .sheet{background:rgba(130,130,145,.08); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
  #acctVeil .sheet{width:min(560px,94vw); max-height:86dvh; overflow-y:auto; background:rgba(130,130,145,.08); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
  .bavatar img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;}
  .acct-item{display:flex; align-items:center; gap:6px;}
  .acct-pick{flex:1; display:flex; align-items:center; gap:12px; background:none; border:none; color:var(--ink); font:inherit; text-align:left; cursor:pointer; padding:0; min-width:0;}
  .acct-x{flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; font-size:.8rem; line-height:1;}
  .opt-group{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px;}
  .opt-group .set-label{margin-bottom:0;}
  .opt-side{display:flex; align-items:center; gap:12px;}
  .opt-val{font-size:.9rem; font-weight:600;}
  .opt-wrap{position:relative; display:inline-flex;}
  .opt-btn{width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .ddots{display:flex; flex-direction:column; gap:4px;}
  .ddots i{width:4px; height:4px; border-radius:50%; background:currentColor; display:block;}
  .opt-menu{position:absolute; right:0; top:42px; min-width:200px; display:none; flex-direction:column; padding:6px; border-radius:16px; background:var(--panel-strong); border:1px solid var(--line); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); z-index:30; box-shadow:0 18px 44px rgba(0,0,0,.35);}
  .opt-menu.on{display:flex;}
  .opt-menu button{border:none; background:transparent; color:var(--ink); font:inherit; font-size:.88rem; text-align:left; padding:9px 12px; border-radius:10px; cursor:pointer; white-space:nowrap;}
  .opt-menu button.sel{color:var(--gold);}
  @media (max-width:700px){
  }
  #sigCanvas{width:100%; height:170px; display:block; border:1px solid var(--line); border-radius:16px; background:var(--field); touch-action:none;}
  @media (max-width:700px){.set-grid{grid-template-columns:1fr;}}
  .msg .lines{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .msg .addr{font-size:.78rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .msg:hover{background:var(--panel-strong);}
  .msg.sel{background:transparent;}
  .msg .top{display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
  .msg .from{font-size:.9rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .msg.unread .from{font-weight:700;}
  .msg .when{font-size:.72rem; opacity:.7; white-space:nowrap;}
  .msg .subj{font-size:.86rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .msg.unread .subj{font-weight:700;}
  .msg .prev{font-size:.8rem; opacity:.65; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .msg .row2{display:flex; align-items:center; gap:8px;}
  .msg .udot{width:8px; height:8px; border-radius:50%; background:var(--gold); flex:none;}
  .empty{padding:26px 16px; font-size:.88rem; opacity:.7; text-align:center;}

  .reader{padding:26px 28px; overflow-y:auto; overflow-x:hidden;}
  .reader .r-from{font-size:.85rem; opacity:.75;}
  .reader h2{font-size:1.35rem; font-weight:700; margin:8px 0 6px; line-height:1.3; overflow-wrap:anywhere;}
  .reader .r-meta{font-size:.8rem; opacity:.7; padding-bottom:18px; margin-bottom:20px; line-height:1.7;}
  .reader .r-body{font-size:.94rem; line-height:1.75; max-width:640px; white-space:pre-line; overflow-wrap:anywhere; word-break:break-word;}
  .reader .r-html{width:100%; max-width:100%; border:0; background:#fff; display:block;}
  .r-top .who-line{flex:1; min-width:0;}
  .who-line>span{min-width:0;}
  .who-line .nm,.who-line .ad{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .r-top .r-when{flex:none;}
  .dots{flex:none;}
  .reader .acts{display:flex; gap:10px; margin-top:28px; flex-wrap:wrap; justify-content:center;}
  .pill{border:1px solid var(--line); border-radius:999px; padding:10px 18px; font-size:.86rem; background:transparent;}
  .pill.blue{border-color:var(--blue); color:var(--blue);}
  .pill.red{border-color:var(--red); color:var(--red);}
  .reader-none{height:100%; display:flex; align-items:center; justify-content:center; font-size:.9rem; opacity:.55;}

  /* ---------- compose ---------- */
  .veil{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.45);}
  .veil.on{display:flex;}
  .sheet{
    width:min(620px,100%); max-height:92%; overflow-y:auto; border-radius:22px; padding:22px;
    background:var(--panel-strong); border:1px solid var(--line);
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    display:flex; flex-direction:column; gap:12px;
  }
  .sheet .c-title{font-size:1rem; font-weight:700; padding:0 4px 4px;}
  .sheet input,.sheet textarea{
    background:var(--field); border:1px solid var(--line); border-radius:16px;
    padding:13px 16px; font-size:1rem; outline:none; width:100%;
  }
  .sheet textarea{min-height:170px; resize:vertical; border-radius:16px; line-height:1.6;}
  .sheet input{border-radius:999px;}
  .sheet input:focus,.sheet textarea:focus{border-color:var(--ink);}
  .sheet .row{display:flex; gap:10px; justify-content:flex-end; margin-top:2px;}
  .sheet .sheet-title{font-size:1rem; font-weight:700; padding:0 4px 4px;}
  .sheet-acts{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:2px;}
  .sheet-acts button{border:1px solid var(--line); background:transparent; border-radius:999px; padding:10px 18px; font-size:.86rem; color:var(--ink); cursor:pointer;}
  .sheet-acts button.send{background:var(--gold); color:#000; border:none; font-weight:700;}
  button.del{border:1px solid var(--line); background:transparent; border-radius:999px; padding:10px 18px; font-size:.86rem; color:var(--ink); cursor:pointer;}
  .send{background:var(--gold); color:#000; border:none; font-weight:700;}

  @media (max-width:900px){
    .app{grid-template-columns:1fr; padding:98px 10px 96px;}
    .dock .who{display:none;}
    .reader-panel{display:none;}
    .reader-panel.open{display:flex; position:fixed; inset:0; z-index:4;}
    .app{padding:0; height:100dvh;}
    .list-panel{border-radius:0; border:none; height:100dvh; padding:calc(16px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));}
    .veil{padding:0;}
    .sheet{width:100%; height:100dvh; max-height:100dvh; border-radius:0;}
    #acctVeil .sheet, #settingsVeil .sheet{width:100%; height:100dvh; max-height:100dvh; border-radius:0;}
    .reader-panel{border-radius:0;}
    .card input{font-size:1rem;}
    #searchBox{font-size:1rem;}
    .list-head .title{font-size:1.12rem;}
    .list-panel{padding:16px 14px 92px;}
    .msg{padding:11px 10px;}
    .bavatar{width:40px; height:40px; font-size:.95rem;}
    .bavatar.sm{width:32px; height:32px; font-size:.78rem;}
    .msg .from{font-size:.92rem;}
    .msg .subj2{font-size:.88rem;}
    .dock{gap:6px; padding:8px 10px calc(8px + env(safe-area-inset-bottom));}
    .dock button{padding:8px 13px; font-size:.82rem;}
    .acct-line .em{font-size:.8rem;}
  }

  /* ---------- light mode: the homepage silver ---------- */
  @media (prefers-color-scheme: light){
    :root{
      --ink:#111114;
      --panel:rgba(17,17,20,.06);
      --panel-strong:rgba(17,17,20,.12);
      --line:rgba(17,17,20,.26);
      --field:rgba(255,255,255,.65);
      --row:#d9d9de;
    }
    body{background:#fff; color:var(--ink);}
    .void{background:#fff; color:var(--ink);}
    .void::before{
      background:
        repeating-conic-gradient(from 0deg at var(--cx) var(--cy), rgba(0,0,0,.035) 0deg 1deg, transparent 1deg 2deg),
        repeating-radial-gradient(circle at var(--cx) var(--cy), rgba(0,0,0,.03) 0px 1px, transparent 1px 4px),
        radial-gradient(circle at var(--cx) var(--cy), #eaeaea 0%, #e2e2e2 8%, #d3d3d3 16%, #bcbcbc 26%, #a3a3a3 38%, #8f8f8f 52%, #7d7d7d 64%, #8f8f8f 78%, #bcbcbc 90%, #d8d8d8 100%);
    }
    .void::after{background:radial-gradient(circle at var(--cx) var(--cy), transparent 0%, transparent 45%, rgba(255,255,255,.35) 78%, rgba(255,255,255,.85) 100%);}

    .go{background:#111114; color:#fff;}
    .veil{background:rgba(255,255,255,.4);}
  }

  /* manual Light/Dark choice, wins over the device setting */
  html[data-theme="light"]{--ink:#111114; --panel:rgba(17,17,20,.06); --panel-strong:rgba(17,17,20,.12); --line:rgba(17,17,20,.26); --field:rgba(255,255,255,.65); --row:#d9d9de;}
  html[data-theme="light"] body{background:#fff; color:var(--ink);}
  html[data-theme="light"] .void{background:#fff; color:var(--ink);}
  html[data-theme="light"] .void::before{
    background:
      repeating-conic-gradient(from 0deg at var(--cx) var(--cy), rgba(0,0,0,.035) 0deg 1deg, transparent 1deg 2deg),
      repeating-radial-gradient(circle at var(--cx) var(--cy), rgba(0,0,0,.03) 0px 1px, transparent 1px 4px),
      radial-gradient(circle at var(--cx) var(--cy), #eaeaea 0%, #e2e2e2 8%, #d3d3d3 16%, #bcbcbc 26%, #a3a3a3 38%, #8f8f8f 52%, #7d7d7d 64%, #8f8f8f 78%, #bcbcbc 90%, #d8d8d8 100%);
  }
  html[data-theme="light"] .void::after{background:radial-gradient(circle at var(--cx) var(--cy), transparent 0%, transparent 45%, rgba(255,255,255,.35) 78%, rgba(255,255,255,.85) 100%);}
  html[data-theme="light"] .mark{text-shadow:0 0 30px rgba(255,255,255,.9), 0 0 60px rgba(255,255,255,.7);}
  html[data-theme="light"] .go{background:#111114; color:#fff;}
  html[data-theme="light"] .veil{background:rgba(255,255,255,.4);}
  html[data-theme="dark"]{--ink:#F2F2F5; --panel:rgba(242,242,245,.05); --panel-strong:rgba(242,242,245,.09); --line:rgba(242,242,245,.14); --field:rgba(0,0,0,.38); --row:#101014;}
  html[data-theme="dark"] body{background:#000; color:var(--ink);}
  html[data-theme="dark"] .void{background:#000; color:var(--ink);}
  html[data-theme="dark"] .void::before{
    background:
      repeating-conic-gradient(from 0deg at var(--cx) var(--cy), rgba(255,255,255,.012) 0deg 1deg, transparent 1deg 2deg),
      repeating-radial-gradient(circle at var(--cx) var(--cy), rgba(255,255,255,.010) 0px 1px, transparent 1px 4px),
      radial-gradient(circle at var(--cx) var(--cy), #161616 0%, #0d0d0d 34%, #050505 62%, #010101 100%);
  }
  html[data-theme="dark"] .void::after{background:radial-gradient(circle at var(--cx) var(--cy), transparent 0%, transparent 45%, rgba(0,0,0,.55) 82%, rgba(0,0,0,.9) 100%);}
  html[data-theme="dark"] .mark{text-shadow:0 0 30px rgba(255,255,255,.25), 0 0 70px rgba(255,255,255,.12);}
  html[data-theme="dark"] .go{background:#F2F2F5; color:#000;}
  html[data-theme="dark"] .veil{background:rgba(0,0,0,.45);}
  @media (max-width:900px){
    .app.split .reader-panel{display:none;}
    .app.split .reader-panel.open{display:flex;}
    .reading .dock, .reading .compose-float, .reading #dockToggle, .reading #dockToggle.on{display:none;}

    .dock.open{transform:translateY(0); opacity:1; pointer-events:auto;}
    .dock.open ~ #dockToggle{display:none;}

  html[data-theme="light"] .msg .when, html[data-theme="light"] .msg .when2,
  html[data-theme="light"] .msg .prev, html[data-theme="light"] .reader .r-from,
  html[data-theme="light"] .reader .r-meta, html[data-theme="light"] .reader .r-when,
  html[data-theme="light"] .empty, html[data-theme="light"] .who .plan,

<script>
(function(){
  var voidEl=document.getElementById('void');
  document.addEventListener('pointermove',function(e){
    voidEl.style.setProperty('--cx',(e.clientX/window.innerWidth*100)+'%');
    voidEl.style.setProperty('--cy',(e.clientY/window.innerHeight*100)+'%');
  });

  var MAIL=[];
  var FOLDERS=['Inbox','Sent','Drafts','Archive','Junk','Trash'];
  var state={folder:'Inbox',selected:null,query:''};

  var API='https://bjvfi-mail.iamnottaiii.workers.dev';
  var COUNTS={};
  var LISTERR='';
  var SESSIONS={};
  try{SESSIONS=JSON.parse(localStorage.getItem('bjvfi_mail_sessions')||'{}')||{};}catch(e){SESSIONS={};}
  function saveSessions(){try{localStorage.setItem('bjvfi_mail_sessions',JSON.stringify(SESSIONS));}catch(e){}}
  function curToken(){var s=SESSIONS[currentAcct]; return s?s.token:'';}
  function api(action,body){
    body=body||{}; body.token=curToken();
    return fetch(API+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json();})
      .then(function(d){if(d&&d.error){var e=new Error(d.error); e.needAppPassword=d.needAppPassword; throw e;} return d;});
  }
  function apiLogin(email,pass){
    return fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})})
      .then(function(r){return r.json();})
      .then(function(d){if(d&&d.error){var e=new Error(d.error); e.needAppPassword=d.needAppPassword; throw e;} return d;});
  }
  function fmtWhen(raw){
    if(!raw) return '';
    var d=new Date(raw); if(isNaN(d)) return raw;
    var now=new Date();
    var time=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
    if(d.toDateString()===now.toDateString()) return time;
    var opts={month:'short',day:'numeric'};
    if(d.getFullYear()!==now.getFullYear()) opts.year='numeric';
    return d.toLocaleDateString([], opts)+', '+time;
  }
  function boxKey(){return state.folder.toLowerCase();}
  function mapMsg(mm){
    return {id:parseInt(mm.uid,10), uid:mm.uid, folder:state.folder,
      from:mm.fromName||mm.fromEmail||'', addr:mm.fromEmail||'',
      subj:mm.subject||'', prev:'', when:fmtWhen(mm.date), rawDate:mm.date,
      body:null, html:'', unread:!!mm.unread, starred:!!mm.starred, align:'left', sigImg:''};
  }
  function loadCounts(){
    return api('counts',{}).then(function(d){COUNTS=d||{}; renderFolders();});
  }
  function loadList(){
    LISTERR='';
    return api('list',{mailbox:boxKey(),limit:50}).then(function(d){
      MAIL=(d.messages||[]).map(mapMsg); renderAll();
    }).catch(function(e){
      MAIL=[]; LISTERR=e.message; renderAll();
    });
  }
  function refresh(){return loadCounts().then(loadList);}
  function paintRow(m){
    var w=listEl.querySelector('[data-swipe="'+m.id+'"]');
    if(!w) return;
    var btn=w.querySelector('.msg'); if(!btn) return;
    btn.classList.toggle('unread',!!m.unread);
    var f=btn.querySelector('.from'); if(f) f.textContent=m.from;
    var a=btn.querySelector('.addr'); if(a) a.textContent=m.addr;
    var s=btn.querySelector('.subj'); if(s) s.textContent=m.subj;
    var wn=btn.querySelector('.when2'); if(wn) wn.textContent=m.when;
    var r2=btn.querySelector('.row2');
    if(r2){
      var ud=r2.querySelector('.udot');
      if(m.unread&&!ud){var sp=document.createElement('span'); sp.className='udot'; r2.insertBefore(sp,r2.firstChild);}
      else if(!m.unread&&ud){ud.remove();}
    }
  }
  function removeRow(m){
    var i=MAIL.indexOf(m); if(i>=0) MAIL.splice(i,1);
    var w=listEl.querySelector('[data-swipe="'+m.id+'"]');
    if(w) w.remove();
    if(!listEl.querySelector('.swipe')){
      listEl.innerHTML='<div class="empty">'+esc(LISTERR||'Nothing here.')+'</div>';
    }
  }
  function actRemove(p,m){
    p.then(function(){removeRow(m); loadCounts().catch(function(){});})
     .catch(function(e){LISTERR=e.message; renderList();});
  }
  function actMark(p,m,newUnread){
    p.then(function(){m.unread=newUnread; paintRow(m); loadCounts().catch(function(){});})
     .catch(function(e){LISTERR=e.message; renderList();});
  }

  var loginView=document.getElementById('loginView'), appView=document.getElementById('appView');
  var foldersEl=document.getElementById('folders'), listEl=document.getElementById('msgList'),
      readerEl=document.getElementById('reader'), readerPanel=document.getElementById('readerPanel'),
      listTitle=document.getElementById('listTitle'), searchBox=document.getElementById('searchBox'),
      veil=document.getElementById('veil');

  function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function unreadCount(f){var c=COUNTS[f.toLowerCase()]; return c?c.unread:0;}

  function renderFolders(){
    foldersEl.innerHTML=FOLDERS.map(function(f){
      var n=unreadCount(f);
      return '<button type="button" class="'+(state.folder===f?'sel ':'')+(n?'has':'')+'" data-folder="'+f+'">'
        +'<span>'+f+'</span>'+(n?'<span>'+n+'</span>':'')+'<span class="dot"></span></button>';
    }).join('');
    foldersEl.querySelectorAll('[data-folder]').forEach(function(b){
      b.addEventListener('click',function(){state.folder=b.dataset.folder; state.selected=null; b.blur(); document.getElementById('dock').classList.remove('open'); renderAll(); loadList();});
    });
  }

  function visible(){
    var q=state.query.trim().toLowerCase();
    return MAIL.filter(function(m){
      if(m.folder!==state.folder) return false;
      if(!q) return true;
      return (m.from+' '+m.subj+' '+m.prev).toLowerCase().indexOf(q)>-1;
    });
  }

  function avatarHTML(m){
    return '<span class="bavatar sm">'+esc(initials(m.from))+'</span>';
  }

  function renderList(){
    listTitle.textContent=state.folder;
    var rows=visible();
    if(!rows.length){listEl.innerHTML='<div class="empty">'+esc(LISTERR||'Nothing here.')+'</div>'; return;}
    listEl.innerHTML=(LISTERR?'<div class="empty">'+esc(LISTERR)+'</div>':'')+rows.map(function(m){
      return '<div class="swipe" data-swipe="'+m.id+'">'
        +'<div class="cue" data-side="left" data-a="'+PREFS.left+'">'+CUE[PREFS.left]+'</div>'
        +'<div class="cue" data-side="right" data-a="'+PREFS.right+'">'+CUE[PREFS.right]+'</div>'
        +'<button type="button" class="msg'+(m.unread?' unread':'')+(state.selected===m.id?' sel':'')+'" data-id="'+m.id+'">'
        +avatarHTML(m)
        +'<span class="lines">'

  function wireSwipe(w){
    var btn=w.querySelector('.msg'), id=Number(w.dataset.swipe), startX=null, dx=0, dragging=false;
    var cueL=w.querySelector('[data-side="left"]'), cueR=w.querySelector('[data-side="right"]');
    btn.addEventListener('pointerdown',function(e){startX=e.clientX; dx=0; dragging=false;});
    btn.addEventListener('pointermove',function(e){
      if(startX===null) return;
      dx=e.clientX-startX;
      if(Math.abs(dx)>8){
        dragging=true; if(window.getSelection) window.getSelection().removeAllRanges();
        btn.style.transform='translateX('+dx+'px)';
        if(cueR) cueR.style.opacity=dx<-10?Math.min(1,-dx/70):0;
        if(cueL) cueL.style.opacity=dx>10?Math.min(1,dx/70):0;
      }
    });
    function end(){
      if(startX===null) return;
      var acted=false;
      if(dx<=-70&&PREFS.right!=='none'){swipePerform(PREFS.right,id); acted=true;}
      else if(dx>=70&&PREFS.left!=='none'){swipePerform(PREFS.left,id); acted=true;}
      if(dragging){suppressClick=true; setTimeout(function(){suppressClick=false;},250);}
      btn.style.transform=''; if(cueL)cueL.style.opacity=0; if(cueR)cueR.style.opacity=0;
      startX=null; dx=0; dragging=false;
      if(acted) return;
    }
    btn.addEventListener('pointerup',end);
    btn.addEventListener('pointercancel',end);
  }
  function swipePerform(action,id){
    var m=MAIL.find(function(x){return x.id===id;}); if(!m) return;
    if(action==='delete'){
      if(state.selected===id){state.selected=null; renderReader();}
      actRemove(api('delete',{mailbox:boxKey(),uid:m.uid}),m);
    }else if(action==='junk'){
      if(state.selected===id){state.selected=null; renderReader();}
      actRemove(api('move',{mailbox:boxKey(),uid:m.uid,to:'junk'}),m);
    }else if(action==='mark'){
      actMark(api(m.unread?'mark_read':'mark_unread',{mailbox:boxKey(),uid:m.uid}),m,!m.unread);
    }
  }

  document.getElementById('fmtBtn').addEventListener('click',function(){fmtPop.classList.toggle('on'); this.blur();});
  document.querySelectorAll('.fmt-pop [data-fmt]').forEach(function(b){
    b.addEventListener('click',function(){
      var f=b.dataset.fmt, st=cBodyEl.selectionStart||0, en=cBodyEl.selectionEnd||0, v=cBodyEl.value, sel=v.slice(st,en);
      if(f==='bold'||f==='italic'){
        var mk=f==='bold'?'**':'_';
        cBodyEl.value=v.slice(0,st)+mk+(sel||'text')+mk+v.slice(en);
      }else if(f==='num'||f==='bul'){
        var block=sel||v, lines=block.split('\n'), out=lines.map(function(l,i){return f==='num'?(i+1)+'. '+l:'\u2022 '+l;}).join('\n');
        cBodyEl.value=sel?v.slice(0,st)+out+v.slice(en):out;
      }else if(f==='left'||f==='center'){
        composeAlign=f; cBodyEl.style.textAlign=f;
        document.getElementById('alLeft').classList.toggle('sel',f==='left');
        document.getElementById('alCenter').classList.toggle('sel',f==='center');
      }
      b.blur();
    });
  });

  var sigFile=document.getElementById('sigFile');
  var sigPreview=document.getElementById('sigPreview');
  var sigImgRemove=document.getElementById('sigImgRemove');
  function paintSigImg(){
    if(PREFS.sigImg){sigPreview.src=PREFS.sigImg; sigPreview.style.display='block'; sigImgRemove.style.display='';}
    else{sigPreview.style.display='none'; sigImgRemove.style.display='none';}
  }
  document.getElementById('sigImgBtn').addEventListener('click',function(){sigFile.click();});
  sigFile.addEventListener('change',function(){
    var f=sigFile.files&&sigFile.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){PREFS.sigImg=r.result; paintSigImg();};
    r.readAsDataURL(f);
  });
  sigImgRemove.addEventListener('click',function(){PREFS.sigImg=''; sigFile.value=''; paintSigImg();});
  paintSigImg();

  var drawPad=document.getElementById('drawPad');
  var sigCanvas=document.getElementById('sigCanvas');
  var sctx=sigCanvas.getContext('2d');
  var drawing=false, lastPt=null;
  function sigPos(e){
    var r=sigCanvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)*sigCanvas.width/r.width, y:(e.clientY-r.top)*sigCanvas.height/r.height};
  }
  document.getElementById('sigDrawBtn').addEventListener('click',function(){
    drawPad.style.display=drawPad.style.display==='none'?'block':'none'; this.blur();
  });
  sigCanvas.addEventListener('pointerdown',function(e){
    drawing=true; lastPt=sigPos(e);
    sctx.strokeStyle=theme==='light'?'#111114':'#ffffff';
    sctx.lineWidth=5; sctx.lineCap='round'; sctx.lineJoin='round';
    sigCanvas.setPointerCapture(e.pointerId);
  });
  sigCanvas.addEventListener('pointermove',function(e){
    if(!drawing) return;
    var pt=sigPos(e);
    sctx.beginPath(); sctx.moveTo(lastPt.x,lastPt.y); sctx.lineTo(pt.x,pt.y); sctx.stroke();
    lastPt=pt;
  });
  function sigStop(){drawing=false;}
  sigCanvas.addEventListener('pointerup',sigStop);
  sigCanvas.addEventListener('pointercancel',sigStop);
  document.getElementById('sigClear').addEventListener('click',function(){sctx.clearRect(0,0,sigCanvas.width,sigCanvas.height);});
  document.getElementById('sigCancel').addEventListener('click',function(){drawPad.style.display='none';});
  document.getElementById('sigUse').addEventListener('click',function(){
    PREFS.sigImg=sigCanvas.toDataURL('image/png');
    paintSigImg(); drawPad.style.display='none';
  });

  function paintWhen(){
    var wv=document.getElementById('whenLabel'); if(wv) wv.textContent='Date and time: '+(PREFS.showWhen?'Show':'Hide');
    document.querySelectorAll('#menu-when button').forEach(function(b){b.classList.toggle('sel',b.dataset.v===(PREFS.showWhen?'show':'hide'));});
  }
  paintWhen();

  var sigInput=document.getElementById('sigInput');
  sigInput.value=PREFS.sig;
  sigInput.addEventListener('change',function(){PREFS.sig=sigInput.value.trim(); savePrefs();});
  var SW_LABELS={delete:'Delete',mark:'Mark read / unread',junk:'Move to Junk',none:'Nothing'};
  function paintSwipe(){
    var lv=document.getElementById('swLLabel'); if(lv) lv.textContent='Swipe left: '+SW_LABELS[PREFS.left];
    var rv=document.getElementById('swRLabel'); if(rv) rv.textContent='Swipe right: '+SW_LABELS[PREFS.right];
    document.querySelectorAll('#menu-left button').forEach(function(b){b.classList.toggle('sel',b.dataset.v===PREFS.left);});
    document.querySelectorAll('#menu-right button').forEach(function(b){b.classList.toggle('sel',b.dataset.v===PREFS.right);});
  }
  function paintQuotePref(){
    var ql=document.getElementById('quoteLabel'); if(ql) ql.textContent='Quoted replies: '+(PREFS.quote?'Show':'Hide');
    document.querySelectorAll('#menu-quote button').forEach(function(b){b.classList.toggle('sel',b.dataset.v===(PREFS.quote?'show':'hide'));});
  }
  paintQuotePref();
  paintSwipe();
  document.querySelectorAll('.opt-btn').forEach(function(b){
    b.addEventListener('click',function(){
      var menu=b.parentElement.querySelector('.opt-menu');
      var was=menu.classList.contains('on');
      document.querySelectorAll('.opt-menu.on').forEach(function(m){m.classList.remove('on');});
      if(!was) menu.classList.add('on');
      b.blur();
    });
  });
  document.querySelectorAll('.opt-menu button').forEach(function(b){
    b.addEventListener('click',function(){
      var g=b.dataset.g, v=b.dataset.v;
      if(g==='theme'){theme=v; PREFS.theme=v; savePrefs(); paintTheme();}
      else if(g==='left'){PREFS.left=v; savePrefs(); paintSwipe(); renderList();}
      else if(g==='right'){PREFS.right=v; savePrefs(); paintSwipe(); renderList();}
      else if(g==='when'){PREFS.showWhen=(v==='show'); savePrefs(); paintWhen(); renderReader();}
      else if(g==='quote'){PREFS.quote=(v==='show'); savePrefs(); paintQuotePref(); renderReader();}
      b.closest('.opt-menu').classList.remove('on'); b.blur();
    });
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('.opt-wrap')) document.querySelectorAll('.opt-menu.on').forEach(function(m){m.classList.remove('on');});
  });
})();
</script>
</body>
</html>
