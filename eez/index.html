    <!-- Manifest + Service Worker for PWA (inline via Blob URLs) -->
    <script>
      (function () {
        try {
          const manifest = {
            name: "eez — real-time messaging",
            short_name: "eez",
            description: "See messages as they're being typed.",
            start_url: ".",
            scope: ".",
            display: "standalone",
            orientation: "portrait",
            background_color: "#0a0f14",
            theme_color: "#0ea5e9",
            icons: [
              {
                src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230ea5e9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.7 0 2.3-2 5-2 1.3 0 1.9.5 2.5 1'/%3E%3Cpath d='M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.7 0 2.3-2 5-2 1.3 0 1.9.5 2.5 1'/%3E%3Cpath d='M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.7 0 2.3-2 5-2 1.3 0 1.9.5 2.5 1'/%3E%3C/svg%3E",
                sizes: "any",
                type: "image/svg+xml",
                purpose: "any maskable"
              }
            ]
          };
          const mb = new Blob([JSON.stringify(manifest)], { type: "application/json" });
          const manifestLink = document.createElement("link");
          manifestLink.rel = "manifest";
          manifestLink.href = URL.createObjectURL(mb);
          document.head.appendChild(manifestLink);

          // Minimal service worker (cache-first for navigations) so the app
          // is installable as a PWA. Inline via Blob URL.
          const swSource = `
            const CACHE = 'eez-v1';
            self.addEventListener('install', (e) => { self.skipWaiting(); });
            self.addEventListener('activate', (e) => { e.waitUntil(self.clients.claim()); });
            self.addEventListener('fetch', (e) => {
              const req = e.request;
              if (req.method !== 'GET') return;
              if (req.mode === 'navigate') {
                e.respondWith(
                  fetch(req).then((res) => {
                    const copy = res.clone();
                    caches.open(CACHE).then((c) => c.put(req, copy)).catch(()=>{});
                    return res;
                  }).catch(() => caches.match(req).then((m) => m || new Response('<h1>Offline</h1>', { headers: { 'Content-Type': 'text/html' } })))
                );
                return;
              }
              // Best-effort cache for same-origin static gets
              e.respondWith(
                caches.match(req).then((cached) => {
                  if (cached) return cached;
                  return fetch(req).then((res) => {
                    if (!res || res.status !== 200 || res.type !== 'basic') return res;
                    const copy = res.clone();
                    caches.open(CACHE).then((c) => c.put(req, copy)).catch(()=>{});
                    return res;
                  }).catch(() => cached);
                })
              );
            });
          `;
          const swBlob = new Blob([swSource], { type: "text/javascript" });
          const swUrl = URL.createObjectURL(swBlob);
          if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
              navigator.serviceWorker.register(swUrl).catch(() => {});
            });
          }
        } catch (e) {
          console.warn("eez: PWA setup skipped", e);
        }
      })();
    </script>

        { label: "1h", ms: 60 * 60 * 1000 },

      /* ================================================================
         HELPERS
         ================================================================ */

      function uuid() {
        if (typeof crypto !== "undefined" && crypto.randomUUID) {
          return crypto.randomUUID();
        }
        return "id_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9);
      }

      function randomColor() {
        return AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)];
      }

      function makeUser(displayName) {
        const username = (displayName || "user").toLowerCase().replace(/\s+/g, "_");
        return {
          id: "user_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9),
          username,
          displayName: displayName || "user",
          avatarColor: randomColor(),
          bio: "",
          avatarUrl: null,
          lastSeen: Date.now(),
        };
      }

      function cn(...args) {
        return args.filter(Boolean).join(" ");
      }

      function formatTime(ts) {
        const d = new Date(ts);
        return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }

      function formatDate(ts) {
        const d = new Date(ts);
        return d.toLocaleDateString([], { month: "short", day: "numeric" });
      }

      function formatLastSeen(ts) {
        if (!ts) return "a while ago";
        const diff = Date.now() - ts;
        const m = Math.floor(diff / 60000);
        if (m < 1) return "just now";
        if (m < 60) return m + "m ago";
        const h = Math.floor(m / 60);
        if (h < 24) return h + "h ago";
        const d = Math.floor(h / 24);
        return d + "d ago";
      }

      function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      }

      function formatDuration(ms) {
        const s = Math.floor(ms / 1000);
        const m = Math.floor(s / 60);
        const r = s % 60;
        return m + ":" + String(r).padStart(2, "0");
      }

      function dataUrlToBlob(dataUrl) {
        try {
          const parts = dataUrl.split(",");
          if (parts.length !== 2) return null;
          const mimeMatch = parts[0].match(/:(.*?);/);
          if (!mimeMatch) return null;
          const mime = mimeMatch[1];
          const byteString = atob(parts[1]);
          const ab = new ArrayBuffer(byteString.length);
          const ia = new Uint8Array(ab);
          for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
          return new Blob([ab], { type: mime });
        } catch { return null; }
      }

      function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      function compressImage(file, maxDim, quality) {
        maxDim = maxDim || 900;
        quality = quality == null ? 0.72 : quality;
        return new Promise((resolve, reject) => {
          const img = new Image();
          const url = URL.createObjectURL(file);
          img.onload = () => {
            URL.revokeObjectURL(url);
            let width = img.naturalWidth || img.width;
            let height = img.naturalHeight || img.height;
            if (width > maxDim || height > maxDim) {
              if (width >= height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            try { resolve(canvas.toDataURL("image/jpeg", quality)); }
            catch (err) { reject(err); }
          };
          img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Failed to load image")); };
          img.src = url;
        });
      }

      function compressImageForAvatar(file) {
        // Smaller cap for avatars (~50KB target)
        return compressImage(file, 256, 0.7);
      }

      function getFileType(fileName, contentType) {
        const ext = (fileName.split(".").pop() || "").toLowerCase();
        if (contentType === "application/pdf" || ext === "pdf") return "pdf";
        if (contentType && contentType.startsWith("audio/") || ["mp3", "wav", "ogg", "m4a", "aac"].includes(ext)) return "audio";
        if (contentType && contentType.startsWith("text/") || ["txt", "md", "rtf"].includes(ext)) return "text";
        if (["xlsx", "xls", "csv", "numbers"].includes(ext)) return "spreadsheet";
        if (["pptx", "ppt", "key"].includes(ext)) return "presentation";
        if (["js","ts","jsx","tsx","py","java","cpp","c","h","css","html","json","xml","yaml","yml"].includes(ext)) return "code";
        return "other";
      }

      function safeJsonParse(raw, fallback) {
        try { return JSON.parse(raw); } catch { return fallback; }
      }

      function safeJsonStringify(value) {
        try { return JSON.stringify(value); } catch { return null; }
      }

      function clampLen(s, n) {
        if (typeof s !== "string") return "";
        return s.length > n ? s.slice(0, n) : s;
      }

      function buildDmRoomId(a, b) {
        return [a, b].sort().join("_dm_");
      }

      function isRoomGeneral(roomId) {
        return roomId === "general";
      }

      // Detect URLs in text and return an array of segments
      function splitLinks(text) {
        if (!text) return [{ t: "" }];
        const re = /(https?:\/\/[^\s]+)/g;
        const parts = [];
        let last = 0;
        let m;
        while ((m = re.exec(text)) !== null) {
          if (m.index > last) parts.push({ t: text.slice(last, m.index), link: false });
          parts.push({ t: m[0], link: true });
          last = m.index + m[0].length;
        }
        if (last < text.length) parts.push({ t: text.slice(last), link: false });
        return parts;
      }

      function domainOf(url) {
        try { return new URL(url).hostname.replace(/^www\./, ""); }
        catch { return url; }
      }

      function highlightMentions(text, mentionedUsernames) {
        if (!text) return [];
        const set = new Set((mentionedUsernames || []).map((u) => u.toLowerCase()));
        const tokens = text.split(/(\s+)/);
        return tokens.map((tok, i) => {
          if (tok.startsWith("@") && tok.length > 1) {
            const name = tok.slice(1).toLowerCase();
            if (set.size === 0 || set.has(name)) {
              return { text: tok, mention: true, key: i };
            }
          }
          return { text: tok, mention: false, key: i };
        });
      }

      // Fuzzy search for quick switcher
      function fuzzyScore(query, target) {
        if (!query) return 1;
        if (!target) return 0;
        const q = query.toLowerCase();
        const t = target.toLowerCase();
        if (t.includes(q)) return 100 - (t.indexOf(q));
        let qi = 0, score = 0;
        for (let ti = 0; ti < t.length && qi < q.length; ti++) {
          if (t[ti] === q[qi]) { score += 1; qi++; }
        }
        return qi === q.length ? score : 0;
      }

      // Simple throttle for typing broadcasts
      function throttle(fn, ms) {
        let last = 0, timer = null, lastArgs = null;
        return (...args) => {
          const now = Date.now();
          lastArgs = args;
          const remaining = ms - (now - last);
          if (remaining <= 0) {
            if (timer) { clearTimeout(timer); timer = null; }
            last = now;
            fn(...lastArgs);
          } else if (!timer) {
            timer = setTimeout(() => {
              last = Date.now();
              timer = null;
              fn(...lastArgs);
            }, remaining);
          }
        };
      }

      /* ================================================================
         STORAGE HELPERS (generic)
         ================================================================ */

      function loadJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (raw == null) return fallback;
          return JSON.parse(raw);
        } catch { return fallback; }
      }
      function saveJson(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {
          // Quota — try to recover by trimming oldest message store
          console.warn("eez: storage quota exceeded, trimming", e);
        }
      }

      /* ================================================================
         CHANNELS / ROOMS STORAGE (extended model)
         ================================================================ */

      function makeChannel(name, description, opts) {
        opts = opts || {};
        const id = (opts.id || name)
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 40) || uuid();
        return {
          id,
          name: name || id,
          description: description || "",
          createdAt: Date.now(),
          createdBy: opts.createdBy || null,
          type: opts.type === "private" ? "private" : "public",
          password: opts.password || "",
          category: opts.category || "Uncategorized",
          capacity: opts.capacity || 0,
          slowMode: opts.slowMode || 0,
          icon: opts.icon || "",
          isDM: !!opts.isDM,
          dmParticipants: opts.dmParticipants || null,
          bannedUserIds: [],
          mods: [],
        };
      }

      function loadChannels() {
        const parsed = loadJson(STORAGE_KEYS.channels, null);
        if (Array.isArray(parsed)) {
          if (parsed.length === 0) {
            const general = makeChannel("general", "the main current", { type: "public", category: "Uncategorized" });
            saveChannels([general]);
            return [general];
          }
          // Backfill any missing fields on older saved channels
          return parsed.map((c) => ({
            type: "public", category: "Uncategorized", slowMode: 0, capacity: 0,
            icon: "", isDM: false, bannedUserIds: [], mods: [],
            ...c,
          }));
        }
        const general = makeChannel("general", "the main current", { type: "public", category: "Uncategorized" });
        saveChannels([general]);
        return [general];
      }

      function saveChannels(channels) {
        saveJson(STORAGE_KEYS.channels, channels);
      }

      function upsertChannel(channel) {
        const all = loadChannels();
        const idx = all.findIndex((c) => c.id === channel.id);
        if (idx >= 0) all[idx] = { ...all[idx], ...channel };
        else all.push(channel);
        saveChannels(all);
        return all;
      }

      function removeChannel(channelId) {
        const all = loadChannels().filter((c) => c.id !== channelId);
        saveChannels(all);
        try { localStorage.removeItem(msgStoreKey(channelId)); } catch {}
        return all;
      }

      function loadMessages(channelId) {
        return loadJson(msgStoreKey(channelId), []);
      }

      function saveMessages(channelId, msgs) {
        try {
          const trimmed = (msgs || []).slice(-200);
          localStorage.setItem(msgStoreKey(channelId), JSON.stringify(trimmed));
        } catch (e) {
          // If still too big, trim harder
          try {
            const trimmed = (msgs || []).slice(-50);
            localStorage.setItem(msgStoreKey(channelId), JSON.stringify(trimmed));
          } catch {}
        }
      }

      function appendMessage(channelId, message) {
        const msgs = loadMessages(channelId);
        msgs.push(message);
        saveMessages(channelId, msgs);
      }

      function updateMessageInStore(channelId, messageId, patchFn) {
        const msgs = loadMessages(channelId);
        let changed = false;
        for (let i = msgs.length - 1; i >= 0; i--) {
          if (msgs[i].id === messageId) {
            msgs[i] = patchFn(msgs[i]);
            changed = true;
            break;
          }
        }
        if (changed) saveMessages(channelId, msgs);
        return changed;
      }

      function findMessageInStore(channelId, messageId) {
        const msgs = loadMessages(channelId);
        return msgs.find((m) => m.id === messageId) || null;
      }

      /* ================================================================
         PREFERENCES (eez-prefs) — single source of truth for personalization
         ================================================================ */

      const DEFAULT_PREFS = {
        theme: "ocean",            // theme preset
        mode: "light",             // light / dark
        bubbleStyle: "rounded",    // rounded / square / imessage
        font: "inter",
        density: "cozy",            // cozy / compact
        customCss: "",
        notifSound: true,
        notifSoundPerRoom: {},      // roomId -> bool
        notifPerRoom: {},           // roomId -> "all" | "mentions" | "none"
        quietHours: { enabled: false, start: "22:00", end: "08:00" },
        recentRooms: [],
        wallpaperPerRoom: {},       // roomId -> { type, value }
        callAudioDevice: null,
        callVideoDevice: null,
        defaultRoomType: "public",
        showOnlineDot: true,
      };

      function loadPrefs() {
        const p = loadJson(STORAGE_KEYS.prefs, null);
        if (!p) return { ...DEFAULT_PREFS };
        return { ...DEFAULT_PREFS, ...p };
      }
      function savePrefs(p) {
        saveJson(STORAGE_KEYS.prefs, p);
      }

      /* ================================================================
         LISTS (starred, muted, archived, blocked, friends, dms, public rooms)
         ================================================================ */

      function loadList(key) {
        return loadJson(key, []);
      }
      function saveList(key, list) { saveJson(key, list); }

      function toggleInList(key, id) {
        const list = loadList(key);
        const idx = list.indexOf(id);
        let next;
        if (idx >= 0) next = list.filter((x) => x !== id);
        else next = [...list, id];
        saveList(key, next);
        return next;
      }

      function addNotification(notif) {
        const list = loadJson(STORAGE_KEYS.notifications, []);
        list.unshift({ ...notif, id: uuid(), createdAt: Date.now(), read: false });
        const trimmed = list.slice(0, 100);
        saveJson(STORAGE_KEYS.notifications, trimmed);
        return trimmed;
      }
      function loadNotifications() {
        return loadJson(STORAGE_KEYS.notifications, []);
      }
      function markNotificationsRead() {
        const list = loadNotifications();
        const next = list.map((n) => ({ ...n, read: true }));
        saveJson(STORAGE_KEYS.notifications, next);
        return next;
      }
      function clearNotifications() {
        saveJson(STORAGE_KEYS.notifications, []);
        return [];
      }

      function loadUserCache() {
        return loadJson(STORAGE_KEYS.userCache, {});
      }
      function saveUserCacheEntry(user) {
        if (!user || !user.id) return;
        const cache = loadUserCache();
        cache[user.id] = { ...cache[user.id], ...user, lastSeen: Date.now() };
        saveJson(STORAGE_KEYS.userCache, cache);
      }
      function getCachedUser(userId) {
        const cache = loadUserCache();
        return cache[userId] || null;
      }

      function loadRecentRooms() {
        return loadJson(STORAGE_KEYS.recentRooms, []);
      }
      function pushRecentRoom(roomId) {
        const list = loadRecentRooms().filter((r) => r !== roomId);
        list.unshift(roomId);
        saveJson(STORAGE_KEYS.recentRooms, list.slice(0, 12));
        return list;
      }

      function loadRoomMetaMap() {
        return loadJson(STORAGE_KEYS.roomMeta, {});
      }
      function saveRoomMeta(roomId, meta) {
        const map = loadRoomMetaMap();
        map[roomId] = { ...(map[roomId] || {}), ...meta };
        saveJson(STORAGE_KEYS.roomMeta, map);
      }

      /* ================================================================
         REALTIME CLIENT (MQTT-over-WebSocket)
         ----------------------------------------------------------------
         Extended to support: message, typing, typing_stop, media,
         join, leave, presence_response, channel_created,
         message_edit, message_delete, message_react, message_pin,
         room_update, room_delete, user_profile_update, thinking,
         webrtc_offer, webrtc_answer, webrtc_ice, webrtc_end,
         room_announce, sync_request (handshake), channel_request.
         ================================================================ */

      class RealtimeClient {
        constructor() {
          this.handlers = new Set();
          this.user = null;
          this.channelId = null;
          this.client = null;
          this.connected = false;
          this.heartbeatTimer = null;
          this.lastSeen = new Map();
          this.pruneTimer = null;
          this.extraTopics = new Set();
          this.presenceLastSentByUser = new Map(); // userId -> last seen ts seen from network
          this.transfers = new Map(); // transferId -> { totalChunks, chunks: [] }
        }

        _publish(topic, payload) {
          if (!this.client || !this.client.connected) return false;
          try {
            const str = JSON.stringify(payload);
            if (str.length <= CHUNK_SIZE) {
              this.client.publish(topic, str, { qos: 0 });
              return true;
            }
            // Large payload — split into chunks sent with a tiny stagger so
            // the public broker doesn't drop messages under burst load.
            const self = this;
            const transferId = uuid();
            const totalChunks = Math.ceil(str.length / CHUNK_SIZE);
            this.client.publish(topic, JSON.stringify({
              type: "transfer_start", transferId, totalChunks,
            }), { qos: 0 });
            for (let i = 0; i < totalChunks; i++) {
              ((idx) => {
                setTimeout(() => {
                  if (self.client && self.client.connected) {
                    self.client.publish(topic, JSON.stringify({
                      type: "transfer_chunk", transferId, index: idx,
                      data: str.slice(idx * CHUNK_SIZE, (idx + 1) * CHUNK_SIZE),
                    }), { qos: 0 });
                  }
                }, 50 + idx * 30);
              })(i);
            }
            return true;
          } catch (err) {
            console.warn("eez: mqtt publish failed", err);
            return false;
          }
        }

        _onMessage(topic, message) {
          let payload;
          try { payload = JSON.parse(message.toString()); }
          catch { return; }
          if (!payload || !payload.type) return;

          // Chunked transfer reassembly
          if (payload.type === "transfer_start") {
            this.transfers.set(payload.transferId, { totalChunks: payload.totalChunks, chunks: [] });
            return;
          }
          if (payload.type === "transfer_chunk") {
            const t = this.transfers.get(payload.transferId);
            if (!t) return;
            t.chunks[payload.index] = payload.data;
            t.received = (t.received || 0) + 1;
            // Only reassemble when we've received EVERY chunk by count,
            // not by array length (which is unreliable with sparse arrays).
            if (t.received === t.totalChunks) {
              let complete = true;
              for (let i = 0; i < t.totalChunks; i++) {
                if (t.chunks[i] === undefined) { complete = false; break; }
              }
              if (complete) {
                const fullStr = t.chunks.join("");
                this.transfers.delete(payload.transferId);
                try {
                  const original = JSON.parse(fullStr);
                  this._onMessage(topic, { toString: () => fullStr });
                } catch (e) {
                  console.warn("eez: transfer reassembly failed", e);
                }
              }
            }
            return;
          }

          // Auto-reply to presence handshake
          if (payload.type === "join" && this.user && payload.user && payload.user.id !== this.user.id) {
            // Reply on the same room topic so the newcomer sees us
            if (payload.channelId && this.channelId === payload.channelId) {
              this._publish(ROOM_TOPIC(this.channelId), {
                type: "presence_response",
                user: this.user,
                channelId: this.channelId,
              });
            } else if (!payload.channelId) {
              // Global join — don't reply (we only reply on shared rooms)
            }
          }

          // Track presence timestamps
          const uid = payload.user?.id || payload.message?.user?.id || payload.indicator?.userId;
          if (uid) {
            this.lastSeen.set(uid, Date.now());
          }

          this.dispatch(payload);
        }

        dispatch(msg) { this.handlers.forEach((h) => h(msg)); }

        subscribe(handler) {
          this.handlers.add(handler);
          return () => this.handlers.delete(handler);
        }

        isConnected() { return !!(this.client && this.client.connected); }

        connect() {
          if (this.client) return;
          if (typeof window.mqtt === "undefined") {
            console.error("eez: mqtt library not loaded.");
            return;
          }
          const clientId = "eez_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
          this._will = {
            topic: GLOBAL_TOPIC,
            payload: JSON.stringify({ type: "leave", userId: this.user?.id || "unknown", channelId: null }),
            qos: 0, retain: false,
          };
          try {
            this.client = window.mqtt.connect(MQTT_URL, {
              clientId, keepalive: 30, reconnectPeriod: 2500,
              connectTimeout: 10000, clean: true, will: this._will,
            });
          } catch (err) {
            console.error("eez: mqtt connect failed", err);
            return;
          }
          this.client.on("connect", () => {
            this.connected = true;
            this.client.subscribe(GLOBAL_TOPIC, { qos: 0 });
            for (const t of this.extraTopics) {
              try { this.client.subscribe(t, { qos: 0 }); } catch {}
            }
            if (this.channelId) {
              this.client.subscribe(ROOM_TOPIC(this.channelId), { qos: 0 });
              if (this.user) {
                this._publish(ROOM_TOPIC(this.channelId), {
                  type: "join", user: this.user, channelId: this.channelId,
                });
              }
            }
            this._startHeartbeat();
            this._startPruner();
            this.dispatch({ type: "_connected" });
          });
          this.client.on("reconnect", () => {
            this.connected = false;
            this.dispatch({ type: "_reconnecting" });
          });
          this.client.on("close", () => {
            this.connected = false;
            this.dispatch({ type: "_disconnected" });
          });
          this.client.on("offline", () => { this.connected = false; });
          this.client.on("error", (err) => console.error("eez: mqtt error", err));
          this.client.on("message", (topic, message) => this._onMessage(topic, message));
        }

        subscribeGlobalExtra(topic) {
          this.extraTopics.add(topic);
          if (this.client && this.client.connected) {
            try { this.client.subscribe(topic, { qos: 0 }); } catch {}
          }
        }
        unsubscribeGlobalExtra(topic) {
          this.extraTopics.delete(topic);
          if (this.client && this.client.connected) {
            try { this.client.unsubscribe(topic); } catch {}
          }
        }

        _startHeartbeat() {
          if (this.heartbeatTimer) clearInterval(this.heartbeatTimer);
          this.heartbeatTimer = setInterval(() => {
            if (this.user) {
              // Heartbeat on current room (if any)
              if (this.channelId && this.isConnected()) {
                this._publish(ROOM_TOPIC(this.channelId), {
                  type: "join", user: { ...this.user, lastSeen: Date.now() }, channelId: this.channelId,
                });
              }
              // Also broadcast last-seen globally so friends see us
              this._publish(GLOBAL_TOPIC, {
                type: "presence_heartbeat", user: { ...this.user, lastSeen: Date.now() },
              });
            }
          }, HEARTBEAT_MS);
        }

        _startPruner() {
          if (this.pruneTimer) clearInterval(this.pruneTimer);
          this.pruneTimer = setInterval(() => {
            const now = Date.now();
            const stale = [];
            for (const [uid, ts] of this.lastSeen.entries()) {
              if (now - ts > PRESENCE_TIMEOUT_MS) { stale.push(uid); this.lastSeen.delete(uid); }
            }
            for (const uid of stale) {
              this.dispatch({ type: "leave", userId: uid, channelId: this.channelId });
            }
          }, 5000);
        }

        join(user, channelId) {
          this.user = user;
          this.channelId = channelId;
          this.connect();
          if (this.client && this.client.connected) {
            this.client.subscribe(ROOM_TOPIC(channelId), { qos: 0 });
            this._publish(ROOM_TOPIC(channelId), {
              type: "join", user: { ...user, lastSeen: Date.now() }, channelId,
            });
          }
        }

        leave() {
          if (this.user && this.channelId) {
            this._publish(ROOM_TOPIC(this.channelId), {
              type: "leave", userId: this.user.id, channelId: this.channelId,
            });
            try { this.client && this.client.unsubscribe(ROOM_TOPIC(this.channelId)); } catch {}
          }
          this.channelId = null;
        }

        setUser(user) { this.user = user; }

        // ----- Send message (extended) -----
        sendMessage(content, channelId, opts) {
          opts = opts || {};
          if (!this.user) return null;
          const ts = Date.now();
          const message = {
            id: opts.id || uuid(),
            type: "text",
            content,
            userId: this.user.id,
            channelId,
            timestamp: ts,
            user: {
              id: this.user.id,
              username: this.user.username,
              displayName: this.user.displayName,
              avatarColor: this.user.avatarColor,
              avatarUrl: this.user.avatarUrl || null,
              bio: this.user.bio || "",
            },
            editedAt: null,
            deletedAt: null,
            deletedBy: null,
            reactions: {},
            pinned: false,
            replyTo: opts.replyTo || null,
            forwardedFrom: opts.forwardedFrom || null,
            selfDestructAt: opts.selfDestructAt || null,
            keystrokes: opts.keystrokes || null, // typing replay data
            mentions: opts.mentions || [],
          };
          const ok = this._publish(ROOM_TOPIC(channelId), { type: "message", message });
          // Local echo (MQTT doesn't echo to publisher)
          this.dispatch({ type: "message", message });
          appendMessage(channelId, message);
          return message;
        }

        sendMediaMessage(media) {
          if (!this.user) return null;
          const ok = this._publish(ROOM_TOPIC(media.channelId), { type: "media", media });
          if (ok) {
            this.dispatch({ type: "media", media });
            appendMessage(media.channelId, media);
          }
          return media;
        }

        sendVoiceMessage(voice) {
          if (!this.user) return null;
          const ok = this._publish(ROOM_TOPIC(voice.channelId), { type: "voice", voice });
          if (ok) {
            this.dispatch({ type: "voice", voice });
            appendMessage(voice.channelId, voice);
          }
          return voice;
        }

        sendLocationMessage(loc) {
          if (!this.user) return null;
          const ok = this._publish(ROOM_TOPIC(loc.channelId), { type: "location", location: loc });
          if (ok) {
            this.dispatch({ type: "location", location: loc });
            appendMessage(loc.channelId, loc);
          }
          return loc;
        }

        sendTyping(content, channelId, opts) {
          opts = opts || {};
          if (!this.user) return;
          this._publish(ROOM_TOPIC(channelId), {
            type: "typing",
            indicator: {
              userId: this.user.id,
              username: this.user.username,
              displayName: this.user.displayName,
              avatarColor: this.user.avatarColor,
              avatarUrl: this.user.avatarUrl || null,
              content,
              channelId,
              thinking: !!opts.thinking,
            },
          });
        }

        sendThinking(channelId, isThinking) {
          if (!this.user) return;
          this._publish(ROOM_TOPIC(channelId), {
            type: "thinking", userId: this.user.id, channelId, thinking: !!isThinking,
          });
        }

        stopTyping(channelId) {
          if (!this.user) return;
          this._publish(ROOM_TOPIC(channelId), {
            type: "typing_stop", userId: this.user.id, channelId,
          });
        }

        editMessage(channelId, messageId, newContent) {
          if (!this.user) return;
          const editedAt = Date.now();
          this._publish(ROOM_TOPIC(channelId), {
            type: "message_edit", channelId, messageId, newContent, editedAt, userId: this.user.id,
          });
          updateMessageInStore(channelId, messageId, (m) => ({ ...m, content: newContent, editedAt }));
          this.dispatch({ type: "message_edit", channelId, messageId, newContent, editedAt, userId: this.user.id });
        }

        deleteMessage(channelId, messageId) {
          if (!this.user) return;
          const deletedAt = Date.now();
          this._publish(ROOM_TOPIC(channelId), {
            type: "message_delete", channelId, messageId, deletedBy: this.user.id, deletedAt,
          });
          updateMessageInStore(channelId, messageId, (m) => ({ ...m, deletedAt, deletedBy: this.user.id, content: "" }));
          this.dispatch({ type: "message_delete", channelId, messageId, deletedBy: this.user.id, deletedAt });
        }

        reactMessage(channelId, messageId, emoji, action) {
          if (!this.user) return;
          this._publish(ROOM_TOPIC(channelId), {
            type: "message_react", channelId, messageId, emoji, userId: this.user.id, action,
          });
          updateMessageInStore(channelId, messageId, (m) => {
            const reactions = { ...(m.reactions || {}) };
            const arr = reactions[emoji] ? [...reactions[emoji]] : [];
            const i = arr.indexOf(this.user.id);
            if (action === "add" && i < 0) arr.push(this.user.id);
            if (action === "remove" && i >= 0) arr.splice(i, 1);
            if (arr.length === 0) delete reactions[emoji];
            else reactions[emoji] = arr;
            return { ...m, reactions };
          });
          this.dispatch({ type: "message_react", channelId, messageId, emoji, userId: this.user.id, action });
        }

        pinMessage(channelId, messageId, pinned) {
          if (!this.user) return;
          this._publish(ROOM_TOPIC(channelId), {
            type: "message_pin", channelId, messageId, pinned, userId: this.user.id,
          });
          updateMessageInStore(channelId, messageId, (m) => ({ ...m, pinned }));
          this.dispatch({ type: "message_pin", channelId, messageId, pinned, userId: this.user.id });
        }

        announceChannel(channel) {
          this._publish(GLOBAL_TOPIC, { type: "channel_created", channel });
          if (channel.type === "public") {
            this._publish(GLOBAL_TOPIC, { type: "room_announce", room: channel });
          }
        }

        announceRoomUpdate(channel) {
          this._publish(GLOBAL_TOPIC, { type: "room_update", channel });
          this._publish(ROOM_TOPIC(channel.id), { type: "room_update", channel });
        }

        announceRoomDelete(roomId) {
          this._publish(GLOBAL_TOPIC, { type: "room_delete", roomId });
        }

        broadcastProfileUpdate(user) {
          this._publish(GLOBAL_TOPIC, { type: "user_profile_update", user });
        }

        // WebRTC signaling
        sendWebRTC(channelId, type, payload) {
          if (!this.user) return;
          this._publish(ROOM_TOPIC(channelId), {
            type, channelId, from: this.user.id, ...payload,
          });
        }
      }

      const wsClient = new RealtimeClient();

      window.addEventListener("beforeunload", () => {
        try { wsClient.leave(); } catch {}
      });

      /* ================================================================
         WEBRTC CLIENT (signaling via MQTT)
         ================================================================ */

      class WebRTCCall {
        constructor() {
          this.pc = null;
          this.localStream = null;
          this.remoteStream = null;
          this.callId = null;
          this.channelId = null;
          this.role = null;     // "caller" | "callee"
          this.isVideo = false;
          this.isScreen = false;
          this.muted = false;
          this.videoOff = false;
          this.onState = null;
          this._iceQueue = [];
          this._closed = false;
        }

        _emit(state) {
          if (this.onState) this.onState({ ...state, _t: Date.now() });
        }

        async _ensurePC(channelId, role) {
          if (this.pc) return;
          const pc = new RTCPeerConnection({
            iceServers: [
              { urls: "stun:stun.l.google.com:19302" },
              { urls: "stun:stun1.l.google.com:19302" },
            ],
          });
          this.pc = pc;
          this.channelId = channelId;
          this.role = role;

          pc.onicecandidate = (e) => {
            if (e.candidate) {
              wsClient.sendWebRTC(channelId, "webrtc_ice", {
                callId: this.callId, candidate: e.candidate, from: wsClient.user?.id,
              });
            }
          };

          pc.ontrack = (e) => {
            this.remoteStream = e.streams[0];
            this._emit({ kind: "remote-stream", stream: this.remoteStream });
          };

          pc.onconnectionstatechange = () => {
            this._emit({ kind: "connection-state", state: pc.connectionState });
            if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
              // give it a moment for reconnect; if it stays dead, end
            }
          };
        }

        async startCall(channelId, isVideo) {
          this.callId = uuid();
          this.isVideo = isVideo;
          await this._ensurePC(channelId, "caller");
          try {
            if (isVideo) {
              this.localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } else {
              this.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            }
          } catch (e) {
            this._emit({ kind: "error", message: "Could not access " + (isVideo ? "camera" : "microphone") });
            this.end(channelId);
            return;
          }
          for (const track of this.localStream.getTracks()) {
            this.pc.addTrack(track, this.localStream);
          }
          this._emit({ kind: "local-stream", stream: this.localStream });
          const offer = await this.pc.createOffer();
          await this.pc.setLocalDescription(offer);
          wsClient.sendWebRTC(channelId, "webrtc_offer", {
            callId: this.callId, sdp: this.pc.localDescription, from: wsClient.user?.id, isVideo,
          });
          this._emit({ kind: "calling" });
        }

        async acceptCall(channelId, callId, sdp, isVideo) {
          this.callId = callId;
          this.isVideo = isVideo;
          await this._ensurePC(channelId, "callee");
          try {
            if (isVideo) {
              this.localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } else {
              this.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            }
          } catch (e) {
            this._emit({ kind: "error", message: "Could not access " + (isVideo ? "camera" : "microphone") });
            this.end(channelId);
            return;
          }
          for (const track of this.localStream.getTracks()) {
            this.pc.addTrack(track, this.localStream);
          }
          this._emit({ kind: "local-stream", stream: this.localStream });
          await this.pc.setRemoteDescription(new RTCSessionDescription(sdp));
          const answer = await this.pc.createAnswer();
          await this.pc.setLocalDescription(answer);
          wsClient.sendWebRTC(channelId, "webrtc_answer", {
            callId: this.callId, sdp: this.pc.localDescription, from: wsClient.user?.id,
          });
          this._emit({ kind: "connected" });
        }

        async receiveAnswer(sdp) {
          if (!this.pc) return;
          if (this.pc.signalingState === "stable") return;
          await this.pc.setRemoteDescription(new RTCSessionDescription(sdp));
          this._emit({ kind: "connected" });
        }

        async receiveIce(candidate) {
          if (!this.pc) {
            this._iceQueue.push(candidate);
            return;
          }
          try { await this.pc.addIceCandidate(new RTCIceCandidate(candidate)); }
          catch (e) { /* ignore late candidates */ }
        }

        toggleMute() {
          this.muted = !this.muted;
          if (this.localStream) {
            for (const t of this.localStream.getAudioTracks()) t.enabled = !this.muted;
          }
          this._emit({ kind: "mute-state", muted: this.muted });
        }

        toggleVideo() {
          this.videoOff = !this.videoOff;
          if (this.localStream) {
            for (const t of this.localStream.getVideoTracks()) t.enabled = !this.videoOff;
          }
          this._emit({ kind: "video-state", videoOff: this.videoOff });
        }

        async toggleScreen() {
          if (!this.isVideo) return;
          if (this.isScreen) {
            // back to camera
            try {
              const cam = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
              const sender = this.pc.getSenders().find((s) => s.track && s.track.kind === "video");
              if (sender) sender.replaceTrack(cam.getVideoTracks()[0]);
              if (this.localStream) {
                for (const t of this.localStream.getVideoTracks()) t.stop();
                this.localStream.removeTrack(this.localStream.getVideoTracks()[0]);
                this.localStream.addTrack(cam.getVideoTracks()[0]);
              }
              this.isScreen = false;
              this._emit({ kind: "local-stream", stream: this.localStream });
            } catch {}
            return;
          }
          try {
            const screen = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
            const sender = this.pc.getSenders().find((s) => s.track && s.track.kind === "video");
            if (sender) sender.replaceTrack(screen.getVideoTracks()[0]);
            if (this.localStream) {
              for (const t of this.localStream.getVideoTracks()) t.stop();
              this.localStream.removeTrack(this.localStream.getVideoTracks()[0]);
              this.localStream.addTrack(screen.getVideoTracks()[0]);
            }
            this.isScreen = true;
            screen.getVideoTracks()[0].onended = () => this.toggleScreen();
            this._emit({ kind: "local-stream", stream: this.localStream });
          } catch {}
        }

        end(channelId) {
          if (this._closed) return;
          this._closed = true;
          try {
            if (this.pc) this.pc.close();
          } catch {}
          if (this.localStream) {
            for (const t of this.localStream.getTracks()) { try { t.stop(); } catch {} }
          }
          if (channelId && wsClient.user) {
            wsClient.sendWebRTC(channelId, "webrtc_end", { callId: this.callId, from: wsClient.user.id });
          }
          this.pc = null;
          this.localStream = null;
          this.remoteStream = null;
          this._emit({ kind: "ended" });
        }
      }

      function useLocalUser() {
        const [user, setUser] = useState(null);
        const [isLoading, setIsLoading] = useState(true);

        useEffect(() => {
          try {
            const stored = localStorage.getItem(STORAGE_KEYS.user);
            if (stored) {
              const parsed = JSON.parse(stored);
              setUser({
                ...parsed,
                bio: parsed.bio || "",
                avatarUrl: parsed.avatarUrl || null,
                lastSeen: parsed.lastSeen || Date.now(),
              });
              wsClient.setUser(parsed);
            }
          } catch {}
          setIsLoading(false);
        }, []);

        const createUser = useCallback((displayName) => {
          const u = makeUser(displayName);
          saveJson(STORAGE_KEYS.user, u);
          wsClient.setUser(u);
          setUser(u);
          return u;
        }, []);

        const updateUser = useCallback((patch) => {
          setUser((prev) => {
            if (!prev) return prev;
            const next = { ...prev, ...patch, lastSeen: Date.now() };
            saveJson(STORAGE_KEYS.user, next);
            wsClient.setUser(next);
            return next;
          });
        }, []);

        return { user, isLoading, createUser, updateUser };
      }

      function useHashRoute() {
        const get = () => {
          const h = window.location.hash.replace(/^#/, "");
          return h || "/";
        };
        const [path, setPath] = useState(get());
        useEffect(() => {
          const on = () => { setPath(get()); window.scrollTo(0, 0); };
          window.addEventListener("hashchange", on);
          return () => window.removeEventListener("hashchange", on);
        }, []);
        const navigate = useCallback((to) => {
          const clean = to.startsWith("#") ? to.slice(1) : to;
          if (clean === get()) {
            setPath(clean); // still re-render
            return;
          }
          window.location.hash = clean;
        }, []);
        return [path, navigate];
      }

      // Apply prefs (theme, font, bubble, density, custom CSS) to the document
      function useApplyPrefs(prefs) {
        useEffect(() => {
          const html = document.documentElement;
          html.classList.toggle("dark", prefs.mode === "dark");
          if (prefs.theme && prefs.theme !== "ocean") {
            html.setAttribute("data-theme", prefs.theme);
          } else {
            html.removeAttribute("data-theme");
          }
          document.body.setAttribute("data-font", prefs.font || "inter");

          // bubble + density applied via wrapper class on root
          const root = document.getElementById("root");
          if (root) {
            root.classList.remove("density-cozy", "density-compact");
            root.classList.add(prefs.density === "compact" ? "density-compact" : "density-cozy");
          }
          // custom CSS injection
          let mount = document.getElementById("eez-custom-css");
          if (!mount) {
            mount = document.createElement("style");
            mount.id = "eez-custom-css";
            document.head.appendChild(mount);
          }
          mount.textContent = prefs.customCss || "";
        }, [prefs.mode, prefs.theme, prefs.font, prefs.density, prefs.customCss]);
      }

      // Notification sound (Web Audio API) — water drop tone
      const notifAudioCtxRef = { ctx: null };
      function playNotifSound() {
        try {
          if (!notifAudioCtxRef.ctx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            notifAudioCtxRef.ctx = new Ctx();
          }
          const ctx = notifAudioCtxRef.ctx;
          if (ctx.state === "suspended") ctx.resume();
          const now = ctx.currentTime;
          // Water-drop-like sine ping
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.setValueAtTime(900, now);
          osc.frequency.exponentialRampToValueAtTime(500, now + 0.12);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.3);
        } catch {}
      }

      // Notify helper: tries Notification API + sound + in-app center
      function notify(opts) {
        // opts: { roomId, title, body, mention, senderColor }
        const prefs = loadPrefs();
        const muted = loadList(STORAGE_KEYS.muted);
        const roomSetting = prefs.notifPerRoom[opts.roomId] || "all";

        // Determine if we should suppress
        let suppressDesktop = false;
        let suppressSound = false;

        if (muted.includes(opts.roomId)) { suppressDesktop = true; suppressSound = true; }
        if (roomSetting === "none") { suppressDesktop = true; suppressSound = true; }
        if (roomSetting === "mentions" && !opts.mention) { suppressDesktop = true; suppressSound = true; }

        // Quiet hours
        if (prefs.quietHours && prefs.quietHours.enabled) {
          const now = new Date();
          const cur = now.getHours() * 60 + now.getMinutes();
          const [sh, sm] = prefs.quietHours.start.split(":").map(Number);
          const [eh, em] = prefs.quietHours.end.split(":").map(Number);
          const start = sh * 60 + sm;
          const end = eh * 60 + em;
          let inQuiet = false;
          if (start < end) inQuiet = cur >= start && cur < end;
          else inQuiet = cur >= start || cur < end;
          if (inQuiet) { suppressDesktop = true; suppressSound = true; }
        }

        // Always log to in-app center
        addNotification({
          roomId: opts.roomId,
          title: opts.title,
          body: opts.body,
          mention: !!opts.mention,
          read: false,
        });

        // Desktop notif
        if (!suppressDesktop && typeof Notification !== "undefined" && Notification.permission === "granted") {
          try {
            const n = new Notification(opts.title, {
              body: opts.body,
              tag: "eez-" + (opts.roomId || "global"),
              icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230ea5e9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.7 0 2.3-2 5-2 1.3 0 1.9.5 2.5 1'/%3E%3C/svg%3E",
            });
            n.onclick = () => { window.focus(); n.close(); if (opts.roomId) window.location.hash = "/g/" + opts.roomId; };
          } catch {}
        }

        // Sound
        if (!suppressSound && prefs.notifSound) {
          const roomSound = prefs.notifSoundPerRoom[opts.roomId];
          if (roomSound !== false) playNotifSound();
        }
      }

      function requestNotifPermission() {
        if (typeof Notification === "undefined") return Promise.resolve("unsupported");
        if (Notification.permission === "default") return Notification.requestPermission();
        return Promise.resolve(Notification.permission);
      }

      /* ================================================================
         THEME TOGGLE
         ================================================================ */

      function ThemeToggle({ compact }) {
        const [mode, setMode] = useState("light");
        useEffect(() => {
          const prefs = loadPrefs();
          const stored = prefs.mode || localStorage.getItem(STORAGE_KEYS.theme);
          const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          const initial = stored || system;
          setMode(initial);
          document.documentElement.classList.toggle("dark", initial === "dark");
        }, []);
        const toggle = () => {
          const next = mode === "light" ? "dark" : "light";
          setMode(next);
          const prefs = loadPrefs();
          prefs.mode = next;
          savePrefs(prefs);
          localStorage.setItem(STORAGE_KEYS.theme, next);
          document.documentElement.classList.toggle("dark", next === "dark");
        };
        return (
          <button
            onClick={toggle}
            aria-label="Toggle theme"
            className={cn(
              "inline-flex items-center justify-center rounded-md text-foreground/80 hover:bg-white/10 transition-colors",
              compact ? "h-9 w-9" : "h-9 w-9"
            )}
            data-testid="button-theme-toggle"
          >
            <AnimatePresence mode="wait">
              {mode === "light" ? (
                <motion.span key="sun" initial={{ rotate: -90, opacity: 0 }} animate={{ rotate: 0, opacity: 1 }} exit={{ rotate: 90, opacity: 0 }} transition={{ duration: 0.2 }}>
                  <Sun className="h-4 w-4" />
                </motion.span>
              ) : (
                <motion.span key="moon" initial={{ rotate: 90, opacity: 0 }} animate={{ rotate: 0, opacity: 1 }} exit={{ rotate: -90, opacity: 0 }} transition={{ duration: 0.2 }}>
                  <Moon className="h-4 w-4" />
                </motion.span>
              )}
            </AnimatePresence>
          </button>
        );
      }
