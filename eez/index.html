      function ChatPage({ groupId }) {
        const { user, isLoading, createUser, updateUser } = useLocalUser();
        const [path, setLocation] = useHashRoute();
        const prefs = usePrefsSnapshot();

        const [messages, setMessages] = useState([]);
        const [mediaMessages, setMediaMessages] = useState([]);
        const [voiceMessages, setVoiceMessages] = useState([]);
        const [locationMessages, setLocationMessages] = useState([]);
        const [currentTyping, setCurrentTyping] = useState("");
        const [otherUsers, setOtherUsers] = useState([]);
        const [typingUsers, setTypingUsers] = useState(new Map());
        const [thinkingUsers, setThinkingUsers] = useState(new Set());
        const [isConnected, setIsConnected] = useState(wsClient.isConnected());
        const [isUploading, setIsUploading] = useState(false);
        const [copied, setCopied] = useState(false);
        const [replyTo, setReplyTo] = useState(null);
        const [editingId, setEditingId] = useState(null);
        const [undoToast, setUndoToast] = useState(null); // { messageId, expiresAt }
        const [selectionMode, setSelectionMode] = useState(false);
        const [selectedIds, setSelectedIds] = useState(new Set());
        const [selfDestructMs, setSelfDestructMs] = useState(0);
        const [pinnedMessage, setPinnedMessage] = useState(null);
        const [showSearch, setShowSearch] = useState(false);
        const [showRoomSettings, setShowRoomSettings] = useState(false);
        const [showQrShare, setShowQrShare] = useState(false);
        const [showMembersPanel, setShowMembersPanel] = useState(false);
        const [showCall, setShowCall] = useState(false);
        const [showProfileOf, setShowProfileOf] = useState(null); // user object
        const [lightbox, setLightbox] = useState(null);
        const [replayMsg, setReplayMsg] = useState(null);
        const [forwardMsg, setForwardMsg] = useState(null);
        const [dropActive, setDropActive] = useState(false);
        const [callState, setCallState] = useState({ active: false });
        const [showNotifRequest, setShowNotifRequest] = useState(false);
        const [showVoiceRecorder, setShowVoiceRecorder] = useState(false);

        const messagesEndRef = useRef(null);
        const hasJoined = useRef(false);
        const typingPauseTimer = useRef(null);
        const lastTypingSent = useRef(0);
        const keystrokeLog = useRef([]);
        const selfDestructTimers = useRef(new Map());
        const slowModeRef = useRef(0);
        const lastSentTs = useRef(0);
        const callRef = useRef(null);

        const channel = useMemo(() => {
          const all = loadChannels();
          let found = all.find((c) => c.id === groupId);
          if (!found && groupId) {
            found = makeChannel(groupId, "", { type: "public", category: "Uncategorized" });
            const next = [...all, found];
            saveChannels(next);
          }
          if (found) {
            slowModeRef.current = found.slowMode || 0;
          }
          return found;
        }, [groupId]);

        // Load persisted messages on join
        useEffect(() => {
          if (!groupId) return;
          const stored = loadMessages(groupId);
          if (stored.length > 0) {
            // Re-hydrate into typed buckets
            setMessages(stored.filter((m) => !m.type || m.type === "text" || m.type === "media" || m.type === "voice" || m.type === "location").map((m) => {
              if (m.type === "media") {
                setMediaMessages((prev) => [...prev, m]);
                return null;
              }
              if (m.type === "voice") {
                setVoiceMessages((prev) => [...prev, m]);
                return null;
              }
              if (m.type === "location") {
                setLocationMessages((prev) => [...prev, m]);
                return null;
              }
              return m;
            }).filter(Boolean));
            // Pinned
            const pinned = stored.find((m) => m.pinned && !m.deletedAt);
            if (pinned) setPinnedMessage(pinned);
            // Self-destruct timers
            const now = Date.now();
            for (const m of stored) {
              if (m.selfDestructAt && !m.deletedAt) {
                const remaining = m.selfDestructAt - now;
                if (remaining <= 0) {
                  wsClient.deleteMessage(groupId, m.id);
                } else {
                  const t = setTimeout(() => wsClient.deleteMessage(groupId, m.id), remaining);
                  selfDestructTimers.current.set(m.id, t);
                }
              }
            }
          }
        }, [groupId]);

        // Reset state on channel change
        useEffect(() => {
          setMessages([]); setMediaMessages([]); setVoiceMessages([]); setLocationMessages([]);
          setTypingUsers(new Map()); setOtherUsers([]); setCurrentTyping("");
          setReplyTo(null); setEditingId(null); setUndoToast(null);
          setSelectionMode(false); setSelectedIds(new Set());
          setPinnedMessage(null); setShowSearch(false);
          hasJoined.current = false;
          keystrokeLog.current = [];
          return () => {
            wsClient.stopTyping(groupId);
            wsClient.leave();
            hasJoined.current = false;
            // Cleanup self-destruct timers
            for (const [_, t] of selfDestructTimers.current) clearTimeout(t);
            selfDestructTimers.current.clear();
            // End call if active
            if (callRef.current) { callRef.current.end(groupId); callRef.current = null; }
            setShowCall(false);
          };
        }, [groupId]);

        // Subscribe to realtime
        useEffect(() => {
          const checkConnection = setInterval(() => setIsConnected(wsClient.isConnected()), 1000);
          const unsubscribe = wsClient.subscribe((message) => {
            switch (message.type) {
              case "join":
              case "presence_response": {
                if (message.channelId && message.channelId !== groupId) break;
                if (message.user) saveUserCacheEntry(message.user);
                setOtherUsers((prev) => {
                  if (prev.find((u) => u.id === message.user.id)) return prev;
                  if (message.user.id === user?.id) return prev;
                  return [...prev, message.user];
                });
                break;
              }
              case "leave": {
                setOtherUsers((prev) => prev.filter((u) => u.id !== message.userId));
                setTypingUsers((prev) => { const u = new Map(prev); u.delete(message.userId); return u; });
                setThinkingUsers((prev) => { const n = new Set(prev); n.delete(message.userId); return n; });
                break;
              }
              case "message": {
                const msg = message.message;
                if (msg.channelId && msg.channelId !== groupId) break;
                setMessages((prev) => {
                  if (prev.some((m) => m.id === msg.id)) return prev;
                  return [...prev, msg];
                });
                // Clear typing for sender
                setTypingUsers((prev) => { const u = new Map(prev); u.delete(msg.userId); return u; });
                setThinkingUsers((prev) => { const n = new Set(prev); n.delete(msg.userId); return n; });
                // Save + maybe notify
                appendMessage(groupId, msg);
                // Self-destruct
                if (msg.selfDestructAt && !msg.deletedAt) {
                  const remaining = msg.selfDestructAt - Date.now();
                  if (remaining <= 0) {
                    wsClient.deleteMessage(groupId, msg.id);
                  } else {
                    const t = setTimeout(() => wsClient.deleteMessage(groupId, msg.id), remaining);
                    selfDestructTimers.current.set(msg.id, t);
                  }
                }
                // Notify if not from us and not focused / not in this room
                if (msg.userId !== user?.id) {
                  const isMention = (msg.mentions || []).some((m) => m.toLowerCase() === user?.username?.toLowerCase());
                  if (document.hidden || wsClient.channelId !== groupId) {
                    notify({
                      roomId: groupId,
                      title: msg.user?.displayName || "New message",
                      body: msg.content?.slice(0, 80) || "📎 message",
                      mention: isMention,
                    });
                  }
                }
                break;
              }
              case "media": {
                if (message.media.channelId !== groupId) break;
                setMediaMessages((prev) => {
                  if (prev.some((m) => m.id === message.media.id)) return prev;
                  return [...prev, message.media];
                });
                appendMessage(groupId, message.media);
                break;
              }
              case "voice": {
                if (message.voice.channelId !== groupId) break;
                setVoiceMessages((prev) => {
                  if (prev.some((m) => m.id === message.voice.id)) return prev;
                  return [...prev, message.voice];
                });
                appendMessage(groupId, message.voice);
                break;
              }
              case "location": {
                if (message.location.channelId !== groupId) break;
                setLocationMessages((prev) => {
                  if (prev.some((m) => m.id === message.location.id)) return prev;
                  return [...prev, message.location];
                });
                appendMessage(groupId, message.location);
                break;
              }
              case "typing": {
                if (message.indicator.channelId !== groupId) break;
                if (message.indicator.userId === user?.id) break;
                setTypingUsers((prev) => { const u = new Map(prev); u.set(message.indicator.userId, message.indicator); return u; });
                if (message.indicator.thinking) {
                  setThinkingUsers((prev) => { const n = new Set(prev); n.add(message.indicator.userId); return n; });
                } else {
                  setThinkingUsers((prev) => { const n = new Set(prev); n.delete(message.indicator.userId); return n; });
                }
                break;
              }
              case "thinking": {
                if (message.channelId !== groupId) break;
                if (message.userId === user?.id) break;
                setThinkingUsers((prev) => {
                  const n = new Set(prev);
                  if (message.thinking) n.add(message.userId);
                  else n.delete(message.userId);
                  return n;
                });
                break;
              }
              case "typing_stop": {
                if (message.channelId && message.channelId !== groupId) break;
                setTypingUsers((prev) => { const u = new Map(prev); u.delete(message.userId); return u; });
                setThinkingUsers((prev) => { const n = new Set(prev); n.delete(message.userId); return n; });
                break;
              }
              case "message_edit": {
                if (message.channelId !== groupId) break;
                setMessages((prev) => prev.map((m) => m.id === message.messageId
                  ? { ...m, content: message.newContent, editedAt: message.editedAt } : m));
                updateMessageInStore(groupId, message.messageId, (m) => ({ ...m, content: message.newContent, editedAt: message.editedAt }));
                if (pinnedMessage?.id === message.messageId) {
                  setPinnedMessage((p) => ({ ...p, content: message.newContent, editedAt: message.editedAt }));
                }
                break;
              }
              case "message_delete": {
                if (message.channelId !== groupId) break;
                setMessages((prev) => prev.map((m) => m.id === message.messageId
                  ? { ...m, deletedAt: message.deletedAt, deletedBy: message.deletedBy, content: "" } : m));
                updateMessageInStore(groupId, message.messageId, (m) => ({ ...m, deletedAt: message.deletedAt, deletedBy: message.deletedBy, content: "" }));
                if (pinnedMessage?.id === message.messageId) setPinnedMessage(null);
                const t = selfDestructTimers.current.get(message.messageId);
                if (t) { clearTimeout(t); selfDestructTimers.current.delete(message.messageId); }
                break;
              }
              case "message_react": {
                if (message.channelId !== groupId) break;
                const apply = (m) => {
                  if (m.id !== message.messageId) return m;
                  const reactions = { ...(m.reactions || {}) };
                  const arr = reactions[message.emoji] ? [...reactions[message.emoji]] : [];
                  const i = arr.indexOf(message.userId);
                  if (message.action === "add" && i < 0) arr.push(message.userId);
                  if (message.action === "remove" && i >= 0) arr.splice(i, 1);
                  if (arr.length === 0) delete reactions[message.emoji]; else reactions[message.emoji] = arr;
                  return { ...m, reactions };
                };
                setMessages((prev) => prev.map(apply));
                updateMessageInStore(groupId, message.messageId, apply);
                if (pinnedMessage?.id === message.messageId) setPinnedMessage(apply(pinnedMessage));
                break;
              }
              case "message_pin": {
                if (message.channelId !== groupId) break;
                const apply = (m) => m.id === message.messageId ? { ...m, pinned: message.pinned } : m;
                setMessages((prev) => prev.map(apply));
                updateMessageInStore(groupId, message.messageId, (m) => ({ ...m, pinned: message.pinned }));
                if (message.pinned) {
                  const found = findMessageInStore(groupId, message.messageId);
                  if (found) setPinnedMessage({ ...found, pinned: true });
                } else {
                  setPinnedMessage((p) => p && p.id === message.messageId ? null : p);
                }
                break;
              }
              case "room_update": {
                if (message.channel?.id !== groupId) break;
                const updated = { ...channel, ...message.channel };
                upsertChannel(updated);
                slowModeRef.current = updated.slowMode || 0;
                break;
              }
              case "room_delete": {
                if (message.roomId !== groupId) break;
                alert("This room has been deleted by its creator.");
                setLocation("/");
                break;
              }
              case "user_profile_update": {
                saveUserCacheEntry(message.user);
                setOtherUsers((prev) => prev.map((u) => u.id === message.user.id ? { ...u, ...message.user } : u));
                break;
              }
              // WebRTC signaling
              case "webrtc_offer": {
                if (message.channelId !== groupId) break;
                if (message.from === user?.id) break;
                // Auto-accept prompt
                const accept = confirm("Incoming " + (message.isVideo ? "video" : "voice") + " call. Accept?");
                if (!accept) {
                  wsClient.sendWebRTC(groupId, "webrtc_end", { callId: message.callId, from: wsClient.user?.id });
                  break;
                }
                setShowCall(true);
                if (!callRef.current) callRef.current = new WebRTCCall();
                callRef.current.onState = (s) => {
                  setCallState((prev) => ({ ...prev, ...s, active: true, isVideo: !!message.isVideo, peerName: getCachedUser(message.from)?.displayName || "Caller" }));
                };
                callRef.current.acceptCall(groupId, message.callId, message.sdp, message.isVideo);
                break;
              }
              case "webrtc_answer": {
                if (message.channelId !== groupId) break;
                if (message.from === user?.id) break;
                if (callRef.current) callRef.current.receiveAnswer(message.sdp);
                break;
              }
              case "webrtc_ice": {
                if (message.channelId !== groupId) break;
                if (message.from === user?.id) break;
                if (callRef.current) callRef.current.receiveIce(message.candidate);
                break;
              }
              case "webrtc_end": {
                if (message.channelId !== groupId) break;
                if (message.from === user?.id) break;
                if (callRef.current) {
                  callRef.current.end(groupId);
                  callRef.current = null;
                }
                setShowCall(false);
                setCallState({ active: false });
                break;
              }
              default: break;
            }
          });
          return () => { unsubscribe(); clearInterval(checkConnection); };
        }, [user?.id, groupId, pinnedMessage]);

        // Join channel once connected + user known + channel exists
        useEffect(() => {
          if (user && groupId && channel && wsClient.isConnected() && !hasJoined.current) {
            const onlineUser = {
              id: user.id, username: user.username || "user",
              displayName: user.displayName, avatarColor: user.avatarColor,
              avatarUrl: user.avatarUrl || null, bio: user.bio || "",
              lastSeen: Date.now(),
            };
            wsClient.join(onlineUser, groupId);
            hasJoined.current = true;
            pushRecentRoom(groupId);
          }
        }, [user, groupId, channel, isConnected]);

        const scrollToBottom = useCallback(() => {
          messagesEndRef.current && messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
        }, []);
        useEffect(() => { scrollToBottom(); }, [messages, mediaMessages, voiceMessages, currentTyping, typingUsers, scrollToBottom]);

        // Send handlers
        const sendMessage = useCallback((content, opts) => {
          opts = opts || {};
          // Slow mode
          if (slowModeRef.current > 0) {
            const elapsed = Date.now() - lastSentTs.current;
            if (elapsed < slowModeRef.current * 1000) {
              alert("Slow mode: wait " + Math.ceil((slowModeRef.current * 1000 - elapsed) / 1000) + "s");
              return null;
            }
          }
          // Extract mentions
          const mentions = [];
          const re = /@(\w+)/g; let m;
          while ((m = re.exec(content)) !== null) mentions.push(m[1]);

          // Self-destruct
          let selfDestructAt = null;
          if (opts.selfDestructMs && opts.selfDestructMs > 0) {
            selfDestructAt = Date.now() + opts.selfDestructMs;
          }

          const msg = wsClient.sendMessage(content, groupId, {
            replyTo: opts.replyTo || null,
            forwardedFrom: opts.forwardedFrom || null,
            selfDestructAt,
            keystrokes: keystrokeLog.current.length > 0 ? keystrokeLog.current.slice(-200) : null,
            mentions,
          });
          if (msg) {
            lastSentTs.current = Date.now();
            keystrokeLog.current = [];
            // Schedule self-destruct
            if (selfDestructAt) {
              const t = setTimeout(() => wsClient.deleteMessage(groupId, msg.id), opts.selfDestructMs);
              selfDestructTimers.current.set(msg.id, t);
            }
            // Show undo toast (5s)
            setUndoToast({ messageId: msg.id, expiresAt: Date.now() + 5000 });
            setTimeout(() => setUndoToast((u) => u && u.messageId === msg.id ? null : u), 5000);
            // Request notif permission if not granted
            if (typeof Notification !== "undefined" && Notification.permission === "default") {
              requestNotifPermission();
            }
          }
          return msg;
        }, [groupId]);

        const handleKeyDown = useCallback((e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            if (editingId) {
              e.preventDefault();
              const v = currentTyping.trim();
              if (v) {
                wsClient.editMessage(groupId, editingId, v);
                setEditingId(null);
                setCurrentTyping("");
              }
              return;
            }
            if (currentTyping.trim()) {
              e.preventDefault();
              const content = currentTyping.trim();
              const msg = sendMessage(content, { replyTo: replyTo?.id || null });
              if (msg) {
                wsClient.stopTyping(groupId);
                setCurrentTyping("");
                setReplyTo(null);
              }
            }
          } else if (e.key === "Escape") {
            if (editingId) { setEditingId(null); setCurrentTyping(""); }
            else if (replyTo) setReplyTo(null);
            else if (selectionMode) { setSelectionMode(false); setSelectedIds(new Set()); }
          }
        }, [currentTyping, groupId, replyTo, editingId, selectionMode, sendMessage]);

        const sendTypingThrottled = useRef(throttle((content) => {
          wsClient.sendTyping(content, groupId, {});
        }, 400));
        const sendThinkingThrottled = useRef(throttle((isThinking) => {
          wsClient.sendThinking(groupId, isThinking);
        }, 1500));

        const handleTyping = useCallback((e) => {
          const v = e.target.value;
          setCurrentTyping(v);
          // Log keystroke for replay
          keystrokeLog.current.push({ t: Date.now(), len: v.length, k: v.slice(-1) });
          if (keystrokeLog.current.length > 500) keystrokeLog.current = keystrokeLog.current.slice(-300);
          if (v) {
            sendTypingThrottled.current(v);
            // Reset pause timer
            if (typingPauseTimer.current) clearTimeout(typingPauseTimer.current);
            typingPauseTimer.current = setTimeout(() => {
              // Paused for 3+ seconds -> thinking state
              sendThinkingThrottled.current(true);
            }, 3000);
          } else {
            wsClient.stopTyping(groupId);
            if (typingPauseTimer.current) clearTimeout(typingPauseTimer.current);
          }
        }, [groupId]);

        const handleInsert = useCallback(async (type, file) => {
          if (!user) return;
          setIsUploading(true);
          try {
            let url, contentType = file.type, fileSize = file.size;
            if (type === "image") {
              url = await compressImage(file);
              contentType = "image/jpeg";
              fileSize = Math.round((url.length - url.indexOf(",") - 1) * 0.75);
            } else {
              // No size limit — large files are sent via chunked transfer.
              url = await blobToDataUrl(file);
            }
            const media = {
              id: uuid(), type, userId: user.id, username: user.username, displayName: user.displayName,
              avatarColor: user.avatarColor, channelId: groupId, url, fileName: file.name, fileSize, contentType,
              timestamp: Date.now(),
            };
            wsClient.sendMediaMessage(media);
            setMediaMessages((prev) => [...prev, media]);
          } catch (err) {
            console.error("Upload failed:", err);
            alert("Could not send that file.");
          } finally {
            setIsUploading(false);
          }
        }, [user, groupId]);

        const handleVoiceSend = useCallback(async ({ url, duration, size }) => {
          if (!user) return;
          const voice = {
            id: uuid(), type: "voice", userId: user.id, username: user.username, displayName: user.displayName,
            avatarColor: user.avatarColor, channelId: groupId, url, duration, fileSize: size, timestamp: Date.now(),
          };
          wsClient.sendVoiceMessage(voice);
          setVoiceMessages((prev) => [...prev, voice]);
        }, [user, groupId]);

        const handleLocation = useCallback(() => {
          if (!user) return;
          if (!navigator.geolocation) { alert("Geolocation not supported."); return; }
          navigator.geolocation.getCurrentPosition((pos) => {
            const loc = {
              id: uuid(), type: "location", userId: user.id, username: user.username, displayName: user.displayName,
              avatarColor: user.avatarColor, channelId: groupId, lat: pos.coords.latitude, lng: pos.coords.longitude,
              timestamp: Date.now(),
            };
            wsClient.sendLocationMessage(loc);
            setLocationMessages((prev) => [...prev, loc]);
          }, (err) => { alert("Could not get location: " + err.message); });
        }, [user, groupId]);

        // Drag-and-drop + paste
        useEffect(() => {
          const onDragOver = (e) => { e.preventDefault(); setDropActive(true); };
          const onDragLeave = (e) => { if (e.target === document.body || e.relatedTarget === null) setDropActive(false); };
          const onDrop = async (e) => {
            e.preventDefault(); setDropActive(false);
            const files = Array.from(e.dataTransfer?.files || []);
            for (const f of files) {
              const type = f.type.startsWith("image/") ? "image" : f.type.startsWith("video/") ? "video" : "file";
              await handleInsert(type, f);
            }
          };
          const onPaste = async (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const it of items) {
              if (it.kind === "file") {
                const f = it.getAsFile();
                if (f) {
                  const type = f.type.startsWith("image/") ? "image" : f.type.startsWith("video/") ? "video" : "file";
                  await handleInsert(type, f);
                }
              }
            }
          };
          window.addEventListener("dragover", onDragOver);
          window.addEventListener("dragleave", onDragLeave);
          window.addEventListener("drop", onDrop);
          window.addEventListener("paste", onPaste);
          return () => {
            window.removeEventListener("dragover", onDragOver);
            window.removeEventListener("dragleave", onDragLeave);
            window.removeEventListener("drop", onDrop);
            window.removeEventListener("paste", onPaste);
          };
        }, [handleInsert]);

        // Message action handlers
        const onReact = (msg, emoji) => {
          const arr = (msg.reactions || {})[emoji] || [];
          const mine = arr.includes(user.id);
          wsClient.reactMessage(groupId, msg.id, emoji, mine ? "remove" : "add");
        };
        const onReply = (msg) => setReplyTo(msg);
        const onEdit = (msg) => {
          setEditingId(msg.id);
          setCurrentTyping(msg.content || "");
          setTimeout(() => document.getElementById("typing-area") && document.getElementById("typing-area").focus(), 50);
        };
        const onDelete = (msg) => {
          if (!confirm("Delete this message?")) return;
          wsClient.deleteMessage(groupId, msg.id);
          setUndoToast(null);
        };
        const onPin = (msg) => {
          const newState = !msg.pinned;
          wsClient.pinMessage(groupId, msg.id, newState);
          setPinnedMessage(newState ? { ...msg, pinned: true } : (p) => p && p.id === msg.id ? null : p);
        };
        const onStar = (msg) => {
          const starred = loadList(STORAGE_KEYS.starred);
          const exists = starred.find((s) => s.id === msg.id);
          let next;
          if (exists) next = starred.filter((s) => s.id !== msg.id);
          else next = [{
            id: msg.id, channelId: groupId, roomName: channel?.name,
            content: msg.content, type: msg.type, timestamp: msg.timestamp,
          }, ...starred];
          saveList(STORAGE_KEYS.starred, next);
          // Mark on message visually
          setMessages((prev) => prev.map((m) => m.id === msg.id ? { ...m, _starred: !exists } : m));
        };
        const onForward = (msg) => setForwardMsg(msg);
        const onCopy = (text) => {
          navigator.clipboard?.writeText(text).then(() => {
            setCopied(true); setTimeout(() => setCopied(false), 1500);
          }).catch(() => {});
        };
        const onReplay = (msg) => setReplayMsg(msg);

        // Undo send
        const handleUndo = () => {
          if (undoToast) {
            wsClient.deleteMessage(groupId, undoToast.messageId);
            setUndoToast(null);
          }
        };

        // Selection
        const toggleSelect = (id) => {
          setSelectedIds((prev) => {
            const n = new Set(prev);
            if (n.has(id)) n.delete(id); else n.add(id);
            return n;
          });
        };
        const exitSelection = () => { setSelectionMode(false); setSelectedIds(new Set()); };
        const bulkDelete = () => {
          if (!confirm(`Delete ${selectedIds.size} message(s)?`)) return;
          for (const id of selectedIds) wsClient.deleteMessage(groupId, id);
          exitSelection();
        };
        const bulkExport = () => {
          const all = loadMessages(groupId).filter((m) => selectedIds.has(m.id));
          const blob = new Blob([JSON.stringify(all, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = "eez-selection-" + Date.now() + ".json"; a.click();
          URL.revokeObjectURL(url);
          exitSelection();
        };
        const bulkForward = () => {
          if (!forwardMsg && selectedIds.size === 0) return;
          // Use forward modal flow for the first selected message
          const firstId = Array.from(selectedIds)[0];
          const msg = messages.find((m) => m.id === firstId);
          if (msg) setForwardMsg(msg);
        };

        const startCall = (isVideo) => {
          if (!user) return;
          setShowCall(true);
          if (!callRef.current) callRef.current = new WebRTCCall();
          callRef.current.onState = (s) => {
            setCallState((prev) => ({ ...prev, ...s, active: true, isVideo, peerName: "Calling..." }));
          };
          callRef.current.startCall(groupId, isVideo);
        };
        const endCall = () => {
          if (callRef.current) { callRef.current.end(groupId); callRef.current = null; }
          setShowCall(false);
          setCallState({ active: false });
        };

        const exitChat = useCallback(() => {
          wsClient.stopTyping(groupId);
          wsClient.leave();
          hasJoined.current = false;
          setLocation("/");
        }, [groupId, setLocation]);

        const copyLink = useCallback(async () => {
          const url = window.location.origin + window.location.pathname + "#/g/" + groupId;
          try {
            await navigator.clipboard.writeText(url);
            setCopied(true); setTimeout(() => setCopied(false), 2000);
          } catch { alert("Invite link: " + url); }
        }, [groupId]);

        const exportRoom = (format) => {
          const msgs = loadMessages(groupId);
          if (format === "delete") {
            removeChannel(groupId);
            wsClient.announceRoomDelete(groupId);
            setLocation("/");
            return;
          }
          let content, mime, ext;
          if (format === "md") {
            content = "# " + (channel?.name || groupId) + "\n\n";
            for (const m of msgs) {
              if (m.deletedAt) continue;
              const t = new Date(m.timestamp).toLocaleString();
              content += `**${m.user?.displayName || m.displayName || "User"}** _${t}_\n\n${m.content || ("📎 " + (m.type || "media"))}\n\n---\n\n`;
            }
            mime = "text/markdown"; ext = "md";
          } else {
            content = JSON.stringify(msgs, null, 2);
            mime = "application/json"; ext = "json";
          }
          const blob = new Blob([content], { type: mime });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = "eez-" + groupId + "-" + Date.now() + "." + ext; a.click();
          URL.revokeObjectURL(url);
        };

        const updateRoom = (patch) => {
          const updated = { ...channel, ...patch };
          upsertChannel(updated);
          wsClient.announceRoomUpdate(updated);
          setShowRoomSettings(false);
        };

        const leaveRoom = () => {
          if (!confirm("Leave this room? You can rejoin with the link.")) return;
          removeChannel(groupId);
          wsClient.announceRoomDelete(groupId);
          setLocation("/");
        };

        const toggleRoomNotif = (lvl) => {
          const p = loadPrefs();
          p.notifPerRoom = { ...(p.notifPerRoom || {}), [groupId]: lvl };
          savePrefs(p);
        };

        const blocked = loadList(STORAGE_KEYS.blocked);
        const notifPref = prefs.notifPerRoom[groupId] || "all";

        if (isLoading) return <FullScreenSpinner />;
        if (!user) return <OnboardingModal onComplete={createUser} />;
        if (!groupId || !channel) {
          return (
            <div className="h-screen w-full flex flex-col bg-background relative overflow-hidden">
              <WaterBackground />
              <div className="relative z-10 flex items-center justify-between p-4 safe-top">
                <div className="flex items-center gap-2">
                  <Waves className="h-6 w-6 text-primary" />
                  <h1 className="text-xl font-semibold">eez</h1>
                </div>
                <ThemeToggle />
              </div>
              <div className="relative z-10 flex-1 flex flex-col items-center justify-center p-6 text-center">
                <Users className="h-12 w-12 text-muted-foreground mb-4" />
                <h2 className="text-xl font-semibold mb-2">group not found</h2>
                <button className="rounded-full h-11 px-6 bg-primary text-primary-foreground hover:opacity-90" onClick={() => setLocation("/")}>Back to groups</button>
              </div>
            </div>
          );
        }

        const memberCount = otherUsers.length + 1;
        const groupName = channel.name || "eez";

        // Build the combined, sorted timeline. Mark blocked-user messages.
        // Normalize all message types to have senderId/senderName/senderColor
        // so the rendering layer has a consistent shape.
        const combined = [
          ...messages.map((m) => ({
            ...m,
            senderId: m.userId || m.senderId,
            senderName: m.user?.displayName || m.senderName || "",
            senderColor: m.user?.avatarColor || m.senderColor || "#0ea5e9",
            messageType: "text",
            sortTs: new Date(m.timestamp).getTime(),
            _blocked: blocked.includes(m.userId || m.senderId),
          })),
          ...mediaMessages.map((m) => ({ ...m, senderId: m.userId, senderName: m.displayName, senderColor: m.avatarColor, messageType: "media", sortTs: new Date(m.timestamp).getTime() })),
          ...voiceMessages.map((m) => ({ ...m, senderId: m.userId, senderName: m.displayName, senderColor: m.avatarColor, messageType: "voice", sortTs: new Date(m.timestamp).getTime() })),
          ...locationMessages.map((m) => ({ ...m, senderId: m.userId, senderName: m.displayName, senderColor: m.avatarColor, messageType: "location", sortTs: new Date(m.timestamp).getTime() })),
        ].sort((a, b) => a.sortTs - b.sortTs);

        const wallpaper = (prefs.wallpaperPerRoom || {})[groupId];

        return (
          <div className="h-screen w-full flex flex-col bg-background relative overflow-hidden">
            <WaterBackground />
            {/* Room wallpaper overlay */}
            {wallpaper && wallpaper.type !== "none" && (
              <div className="absolute inset-0 pointer-events-none" style={{
                background: wallpaper.type === "image" ? `url(${wallpaper.value}) center/cover` : wallpaper.value,
                opacity: 0.15,
              }} />
            )}

            {/* Header — transparent, blends with the water background */}
            <div className="relative z-10 flex items-center gap-2 p-2 sm:p-3 safe-top">
              <button aria-label="Back" className="h-9 w-9 inline-flex items-center justify-center rounded-md hover:bg-white/10" onClick={exitChat}>
                <ArrowLeft className="h-5 w-5" />
              </button>
              <button onClick={() => setShowMembersPanel(true)} className="min-w-0 flex-1 text-left">
                <div className="flex items-center gap-2">

            {/* Pinned message banner */}
            <AnimatePresence>

                  <div className="flex-1 min-w-0">
                    <p className="text-[10px] text-muted-foreground font-medium">Pinned · {pinnedMessage.user?.displayName}</p>
                    <p className="text-xs truncate">{pinnedMessage.content}</p>

                  <button onClick={() => onPin(pinnedMessage)} className="p-1 rounded-full hover:bg-muted"><X className="h-3 w-3" /></button>

            </AnimatePresence>

            {/* Search panel */}
            {showSearch && (
              <SearchPanel
                messages={messages}
                mediaMessages={mediaMessages}
                onClose={() => setShowSearch(false)}
                onJump={(id) => {
                  setShowSearch(false);
                  const el = document.getElementById("msg-" + id);
                  if (el) {
                    el.scrollIntoView({ behavior: "smooth", block: "center" });
                    el.classList.add("ring-2", "ring-primary");
                    setTimeout(() => el.classList.remove("ring-2", "ring-primary"), 1500);
                  }
                }}
              />
            )}

            {/* Selection toolbar */}
            <AnimatePresence>
              {selectionMode && (
                <motion.div initial={{ y: -20, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: -20, opacity: 0 }}
                  className="relative z-10 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-border/50 px-3 py-2 flex items-center gap-2">
                  <button onClick={exitSelection} className="p-2 rounded-full hover:bg-white/20 dark:hover:bg-white/10"><X className="h-4 w-4" /></button>
                  <span className="text-sm font-medium">{selectedIds.size} selected</span>
                  <div className="flex-1" />
                  <button onClick={bulkForward} disabled={selectedIds.size === 0} className="p-2 rounded-full hover:bg-white/20 dark:hover:bg-white/10 disabled:opacity-50"><Forward className="h-4 w-4" /></button>
                  <button onClick={bulkExport} disabled={selectedIds.size === 0} className="p-2 rounded-full hover:bg-white/20 dark:hover:bg-white/10 disabled:opacity-50"><Download className="h-4 w-4" /></button>
                  <button onClick={bulkDelete} disabled={selectedIds.size === 0} className="p-2 rounded-full hover:bg-white/20 dark:hover:bg-white/10 text-destructive disabled:opacity-50"><Trash2 className="h-4 w-4" /></button>
                </motion.div>
              )}
            </AnimatePresence>

            {/* Messages area */}
            <InsertMenu onInsert={handleInsert} onLocation={handleLocation} onVoice={() => setShowVoiceRecorder(true)}>
              <div
                className={cn("relative z-10 h-full overflow-y-auto p-3 sm:p-4 eez-scroll", dropActive && "ring-2 ring-inset ring-primary")}
                onClick={() => document.getElementById("typing-area") && document.getElementById("typing-area").focus()}
              >
                <div className="space-y-3 max-w-2xl mx-auto">
                  <div className="text-center py-4">
                    <p className="text-xs text-muted-foreground">
                      You're in <span className="font-medium">{groupName}</span>. Share this link to chat with anyone.
                    </p>
                  </div>

                  {combined.map((item, idx) => {
                    if (item.messageType === "text") {
                      if (item._blocked && !item.deletedAt) {
                        return (
                          <div key={item.id} id={"msg-" + item.id} className="msg-gap text-center">
                            <span className="text-xs text-muted-foreground italic">blocked message</span>
                          </div>
                        );
                      }
                      return (
                        <div key={item.id} id={"msg-" + item.id} className="msg-gap">
                          {item.senderId !== user.id && (
                            <button onClick={() => setShowProfileOf(item.user)} className="flex items-center gap-2 mb-1 ml-1 hover:opacity-80">
                              <UserAvatar displayName={item.senderName} avatarColor={item.senderColor} avatarUrl={item.user?.avatarUrl} size="sm" />
                              <p className="text-xs text-muted-foreground">{item.senderName}</p>
                            </button>
                          )}
                          <MessageBubble
                            message={item}
                            isSent={item.senderId === user.id}
                            currentUserId={user.id}
                            bubbleStyle={prefs.bubbleStyle}
                            onReact={onReact}
                            onReply={onReply}
                            onEdit={onEdit}
                            onDelete={onDelete}
                            onPin={onPin}
                            onStar={onStar}
                            onForward={onForward}
                            onCopy={onCopy}
                            onReplay={onReplay}
                            replyTargetMsg={item.replyTo ? messages.find((m) => m.id === item.replyTo) || findMessageInStore(groupId, item.replyTo) : null}
                            selectionMode={selectionMode}
                            isSelected={selectedIds.has(item.id)}
                            onSelect={() => toggleSelect(item.id)}
                            onLongPress={() => { setSelectionMode(true); toggleSelect(item.id); }}
                          />
                        </div>
                      );
                    }
                    if (item.messageType === "media") {
                      return (
                        <div key={item.id} id={"msg-" + item.id} className="msg-gap">
                          {item.senderId !== user.id && (
                            <button onClick={() => setShowProfileOf({ id: item.userId, displayName: item.displayName, avatarColor: item.avatarColor })} className="flex items-center gap-2 mb-1 ml-1">
                              <UserAvatar displayName={item.displayName} avatarColor={item.avatarColor} size="sm" />
                              <p className="text-xs text-muted-foreground">{item.displayName}</p>
                            </button>
                          )}
                          <MediaBubble media={item} isSent={item.senderId === user.id} onOpenLightbox={setLightbox} bubbleStyle={prefs.bubbleStyle} />
                        </div>
                      );
                    }
                    if (item.messageType === "voice") {
                      return (
                        <div key={item.id} id={"msg-" + item.id} className="msg-gap">
                          {item.senderId !== user.id && (
                            <div className="flex items-center gap-2 mb-1 ml-1">
                              <UserAvatar displayName={item.displayName} avatarColor={item.avatarColor} size="sm" />
                              <p className="text-xs text-muted-foreground">{item.displayName}</p>
                            </div>
                          )}
                          <VoiceBubble voice={item} isSent={item.senderId === user.id} bubbleStyle={prefs.bubbleStyle} />
                        </div>
                      );
                    }
                    if (item.messageType === "location") {
                      return (
                        <div key={item.id} id={"msg-" + item.id} className="msg-gap">
                          {item.senderId !== user.id && (
                            <div className="flex items-center gap-2 mb-1 ml-1">
                              <UserAvatar displayName={item.displayName} avatarColor={item.avatarColor} size="sm" />
                              <p className="text-xs text-muted-foreground">{item.displayName}</p>
                            </div>
                          )}
                          <LocationBubble location={item} isSent={item.senderId === user.id} bubbleStyle={prefs.bubbleStyle} />
                        </div>
                      );
                    }
                    return null;
                  })}

                  {isUploading && (
                    <div className="flex justify-end">
                      <div className="px-4 py-3 rounded-3xl bg-primary/50 backdrop-blur-md">
                        <motion.div animate={{ rotate: 360 }} transition={{ duration: 1, repeat: Infinity, ease: "linear" }}
                          className="h-5 w-5 border-2 border-primary-foreground border-t-transparent rounded-full" />
                      </div>
                    </div>
                  )}

                  {Array.from(typingUsers.values()).map((indicator) => (
                    <div key={indicator.userId} className="msg-gap">
                      {indicator.userId !== user.id && (
                        <button onClick={() => setShowProfileOf(indicator)} className="flex items-center gap-2 mb-1 ml-1 hover:opacity-80">
                          <UserAvatar displayName={indicator.displayName} avatarColor={indicator.avatarColor} avatarUrl={indicator.avatarUrl} size="sm" />
                          <p className="text-xs text-muted-foreground">{indicator.displayName}</p>
                        </button>
                      )}
                      <LiveBubble
                        content={indicator.content}
                        isSent={indicator.userId === user.id}
                        isActive={true}
                        showCursor={true}
                        thinking={thinkingUsers.has(indicator.userId) && !indicator.content}
                      />
                    </div>
                  ))}

                  {currentTyping && (
                    <LiveBubble content={currentTyping} isSent={true} isActive={true} showCursor={true} />
                  )}

                  <div ref={messagesEndRef} />
                </div>
              </div>
            </InsertMenu>

            {/* Reply preview */}
            <AnimatePresence>
              {replyTo && (
                <motion.div initial={{ y: 20, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: 20, opacity: 0 }}
                  className="relative z-10 mx-3 sm:mx-4 mb-2 p-2 rounded-xl bg-card border-l-2 border-primary flex items-center gap-2">
                  <Reply className="h-3 w-3 text-primary" />
                  <div className="flex-1 min-w-0">
                    <p className="text-xs font-medium">Replying to {replyTo.user?.displayName || "User"}</p>
                    <p className="text-xs text-muted-foreground truncate">{replyTo.content || "📎 media"}</p>
                  </div>
                  <button onClick={() => setReplyTo(null)} className="p-1 rounded-full hover:bg-muted"><X className="h-3 w-3" /></button>
                </motion.div>
              )}
              {editingId && (
                <motion.div initial={{ y: 20, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: 20, opacity: 0 }}
                  className="relative z-10 mx-3 sm:mx-4 mb-2 p-2 rounded-xl bg-card border-l-2 border-yellow-500 flex items-center gap-2">
                  <Edit2 className="h-3 w-3 text-yellow-500" />
                  <div className="flex-1 min-w-0">
                    <p className="text-xs font-medium">Editing message</p>
                    <p className="text-xs text-muted-foreground truncate">{currentTyping}</p>
                  </div>
                  <button onClick={() => { setEditingId(null); setCurrentTyping(""); }} className="p-1 rounded-full hover:bg-muted"><X className="h-3 w-3" /></button>
                </motion.div>
              )}
            </AnimatePresence>

            {/* Undo toast */}
            <AnimatePresence>
              {undoToast && (
                <motion.div initial={{ y: 20, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: 20, opacity: 0 }}
                  className="relative z-10 mx-auto max-w-md mb-2 p-3 rounded-xl bg-card border border-border flex items-center gap-3 shadow-lg">
                  <Check className="h-4 w-4 text-green-500" />
                  <span className="text-sm flex-1">Message sent</span>
                  <button onClick={handleUndo} className="text-sm font-medium text-primary">Undo</button>
                </motion.div>
              )}
            </AnimatePresence>

            {/* Hidden typing area + hint (signature eez UX: no visible input bar) */}
            <textarea
              id="typing-area"
              value={currentTyping}
              onChange={handleTyping}
              onKeyDown={handleKeyDown}
              className="sr-only"
              autoFocus
              data-testid="input-typing"
              aria-label="Message input"
            />

            {/* Floating voice recorder (triggered from InsertMenu) */}
            {showVoiceRecorder && (
              <div className="fixed inset-0 z-[130] flex items-end justify-center p-4 safe-bottom">
                <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setShowVoiceRecorder(false)} />
                <div className="relative w-full max-w-md p-4 rounded-2xl bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-white/20 dark:border-white/10 shadow-2xl flex items-center justify-center">
                  <VoiceRecorder
                    onSend={(data) => { handleVoiceSend(data); setShowVoiceRecorder(false); }}
                    onCancel={() => setShowVoiceRecorder(false)}
                  />
                  <button onClick={() => setShowVoiceRecorder(false)} className="ml-3 p-2 rounded-full hover:bg-muted">
                    <X className="h-4 w-4" />
                  </button>
                </div>
              </div>
            )}

            {/* Hint text */}
            <div className="relative z-10 p-4 text-center safe-bottom">
              <p className="text-sm text-muted-foreground/70">
                {editingId
                  ? "Editing… Press Enter to save, Esc to cancel."
                  : replyTo
                  ? "Replying… Press Enter to send."
                  : "Just start typing… Press Enter to drop."}
              </p>
            </div>

            {/* Drop overlay */}
            {dropActive && (
              <div className="absolute inset-0 z-50 pointer-events-none flex items-center justify-center">
                <div className="border-4 border-dashed border-primary rounded-3xl bg-primary/10 p-12 text-center drop-active">
                  <Paperclip className="h-12 w-12 mx-auto mb-2 text-primary" />
                  <p className="text-lg font-medium text-primary">Drop files to send</p>
                </div>
              </div>
            )}

            {/* Modals & overlays */}
            {lightbox && <Lightbox url={lightbox} onClose={() => setLightbox(null)} />}
            {replayMsg && <TypingReplayModal message={replayMsg} onClose={() => setReplayMsg(null)} />}

            {showRoomSettings && (
              <RoomSettingsModal
                channel={channel}
                user={user}
                onClose={() => setShowRoomSettings(false)}
                onUpdate={updateRoom}
                onExport={exportRoom}
                onLeave={leaveRoom}
                onToggleNotif={toggleRoomNotif}
                notifPref={notifPref}
              />
            )}

            {showQrShare && <QrShareModal roomId={groupId} onClose={() => setShowQrShare(false)} />}

            {showMembersPanel && (
              <ResponsiveModal open onClose={() => setShowMembersPanel(false)} title="Members">
                <MembersPanel channel={channel} user={user} isCreator={channel.createdBy === user.id && !isRoomGeneral(channel.id)} />
              </ResponsiveModal>
            )}

            {forwardMsg && (
              <ForwardModal
                message={forwardMsg}
                onClose={() => { setForwardMsg(null); exitSelection(); }}
                onForward={(targetRoomId) => {
                  const forwardedFrom = { displayName: forwardMsg.user?.displayName || user.displayName, userId: forwardMsg.userId };
                  // Forward as a new message to target room
                  const content = forwardMsg.content || ("📎 " + (forwardMsg.type || "media"));
                  wsClient._publish(ROOM_TOPIC(targetRoomId), {
                    type: "message",
                    message: {
                      id: uuid(),
                      type: "text",
                      content,
                      userId: user.id,
                      channelId: targetRoomId,
                      timestamp: Date.now(),
                      user: { id: user.id, username: user.username, displayName: user.displayName, avatarColor: user.avatarColor },
                      editedAt: null, deletedAt: null, deletedBy: null, reactions: {}, pinned: false,
                      replyTo: null, forwardedFrom, selfDestructAt: null, keystrokes: null, mentions: [],
                    },
                  });
                  // Also store locally if we have that room
                  const targetChannel = loadChannels().find((c) => c.id === targetRoomId);
                  if (targetChannel) {
                    appendMessage(targetRoomId, {
                      id: uuid(), type: "text", content, userId: user.id, channelId: targetRoomId, timestamp: Date.now(),
                      user: { id: user.id, username: user.username, displayName: user.displayName, avatarColor: user.avatarColor },
                      forwardedFrom, reactions: {}, pinned: false,
                    });
                  }
                  setForwardMsg(null);
                  exitSelection();
                  alert("Forwarded to #" + (targetChannel?.name || targetRoomId));
                }}
              />
            )}

            {showProfileOf && (
              <UserProfileModal
                user={showProfileOf}
                currentUserId={user.id}
                onClose={() => setShowProfileOf(null)}
                onMessage={(uid) => {
                  const dmRoomId = buildDmRoomId(user.id, uid);
                  const existing = loadChannels().find((c) => c.id === dmRoomId);
                  if (!existing) {
                    const other = getCachedUser(uid) || showProfileOf;
                    const dm = makeChannel("dm-" + (other?.displayName || "user"), "", {
                      id: dmRoomId, isDM: true, type: "private", dmParticipants: [user.id, uid], createdBy: user.id,
                    });
                    upsertChannel(dm);
                  }
                  setShowProfileOf(null);
                  setLocation("/g/" + dmRoomId);
                }}
                onToggleFriend={(uid) => {
                  const next = toggleInList(STORAGE_KEYS.friends, uid);
                  setShowProfileOf((p) => p ? { ...p, _isFriend: next.includes(uid) } : p);
                }}
                onToggleBlock={(uid) => {
                  const next = toggleInList(STORAGE_KEYS.blocked, uid);
                  setShowProfileOf((p) => p ? { ...p, _isBlocked: next.includes(uid) } : p);
                }}
              />
            )}

            {showCall && callState.active && (
              <CallOverlay
                callState={callState}
                onEnd={endCall}
                onToggleMute={() => callRef.current && callRef.current.toggleMute()}
                onToggleVideo={() => callRef.current && callRef.current.toggleVideo()}
                onToggleScreen={() => callRef.current && callRef.current.toggleScreen()}
              />
            )}
          </div>
        );
      }

      /* ================================================================
         FORWARD MODAL
         ================================================================ */

      function ForwardModal({ message, onClose, onForward }) {
        const [q, setQ] = useState("");
        const channels = loadChannels();
        const filtered = q ? channels.filter((c) => c.name.toLowerCase().includes(q.toLowerCase())) : channels;
        return (
          <ResponsiveModal open onClose={onClose} title="Forward to room">
            <p className="text-xs text-muted-foreground mb-3">Forwarding: {(message?.content || "📎 " + (message?.type || "media")).slice(0, 80)}</p>
            <div className="flex items-center gap-2 p-2 rounded-lg border border-input mb-3">
              <Search className="h-4 w-4 text-muted-foreground" />
              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search rooms..." className="flex-1 bg-transparent outline-none text-sm" />
            </div>
            <div className="space-y-1 max-h-[50vh] overflow-y-auto eez-scroll">
              {filtered.map((c) => (
                <button key={c.id} onClick={() => onForward(c.id)}
                  className="w-full text-left p-3 rounded-xl hover:bg-muted flex items-center gap-2">
                  {c.icon ? <span>{c.icon}</span> : c.type === "private" ? <Lock className="h-3 w-3" /> : null}
                  <span className="text-sm font-medium truncate flex-1">{c.name}</span>
                  <ArrowRight className="h-3 w-3 text-muted-foreground" />
                </button>
              ))}
              {filtered.length === 0 && <p className="text-center text-sm text-muted-foreground py-6">No rooms match.</p>}
            </div>
          </ResponsiveModal>
        );
      }

      /* ================================================================
         USER PROFILE MODAL (other users)
         ================================================================ */

      function UserProfileModal({ user: profileUser, currentUserId, onClose, onMessage, onToggleFriend, onToggleBlock }) {
        const [tab, setTab] = useState("profile");
        if (!profileUser) return null;
        const isFriend = loadList(STORAGE_KEYS.friends).includes(profileUser.id);
        const isBlocked = loadList(STORAGE_KEYS.blocked).includes(profileUser.id);
        const cached = getCachedUser(profileUser.id) || profileUser;
        return (
          <ResponsiveModal open onClose={onClose} title={cached.displayName || "User"}>
            <div className="flex flex-col items-center gap-3 mb-4">
              <UserAvatar
                displayName={cached.displayName}
                avatarColor={cached.avatarColor}
                avatarUrl={cached.avatarUrl}
                size="2xl"
                showStatus
                isOnline
              />
              <div className="text-center">
                <h3 className="text-lg font-semibold">{cached.displayName}</h3>
                <p className="text-xs text-muted-foreground">@{cached.username}</p>
                <p className="text-xs text-muted-foreground mt-1">Last seen {formatLastSeen(cached.lastSeen)}</p>
              </div>
              {cached.bio && <p className="text-sm text-center text-muted-foreground">{cached.bio}</p>}
            </div>
            {currentUserId !== profileUser.id && (
              <div className="grid grid-cols-2 gap-2 mb-4">
                <button onClick={() => onMessage(profileUser.id)} className="h-10 rounded-md bg-primary text-primary-foreground text-sm flex items-center justify-center gap-2">
                  <MessageSquare className="h-4 w-4" /> Message
                </button>
                <button onClick={() => onToggleFriend(profileUser.id)}
                  className={cn("h-10 rounded-md text-sm flex items-center justify-center gap-2 border",
                    isFriend ? "border-primary text-primary bg-primary/5" : "border-border hover:bg-muted")}>
                  <UserPlus className="h-4 w-4" /> {isFriend ? "Friends" : "Add friend"}
                </button>
              </div>
            )}
            {currentUserId !== profileUser.id && (
              <button onClick={() => onToggleBlock(profileUser.id)}
                className={cn("w-full h-10 rounded-md text-sm flex items-center justify-center gap-2 border",
                  isBlocked ? "border-destructive text-destructive bg-destructive/5" : "border-border hover:bg-muted")}>
                <Ban className="h-4 w-4" /> {isBlocked ? "Unblock user" : "Block user"}
              </button>
            )}
            {currentUserId === profileUser.id && (
              <p className="text-center text-sm text-muted-foreground">This is you.</p>
            )}
          </ResponsiveModal>
        );
      }

      /* ================================================================
         STARRED PAGE
         ================================================================ */

      function StarredPage() {
        const [path, setLocation] = useHashRoute();
        const starred = loadList(STORAGE_KEYS.starred);
        return (
          <div className="h-screen w-full flex flex-col bg-background relative overflow-hidden">
            <WaterBackground />
            <div className="relative z-10 flex items-center justify-between p-4 safe-top">
              <button onClick={() => setLocation("/")} className="flex items-center gap-2">
                <ArrowLeft className="h-5 w-5" />
                <span>Back</span>
              </button>
              <h1 className="text-lg font-semibold">Starred messages</h1>
              <div className="w-20" />
            </div>
            <div className="relative z-10 flex-1 overflow-y-auto eez-scroll p-4">
              <div className="max-w-md mx-auto space-y-2">
                {starred.length === 0 && (
                  <div className="text-center py-12 text-muted-foreground">
                    <Star className="h-10 w-10 mx-auto mb-3 opacity-50" />
                    <p>No starred messages yet.</p>
                    <p className="text-xs mt-1">Long-press (or right-click) any message and choose Star to save it here.</p>
                  </div>
                )}
                {starred.map((s) => (
                  <div key={s.id} className="p-3 rounded-xl bg-white/10 dark:bg-white/5 border border-white/10">
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs text-muted-foreground">{s.roomName || s.channelId}</span>
                      <div className="flex items-center gap-1">
                        <button onClick={() => setLocation("/g/" + s.channelId)} className="text-xs text-primary">Open</button>
                        <button onClick={() => {
                          const next = starred.filter((x) => x.id !== s.id);
                          saveList(STORAGE_KEYS.starred, next);
                          window.location.reload();
                        }} className="text-muted-foreground hover:text-destructive ml-2">
                          <Star className="h-3.5 w-3.5 fill-yellow-500 text-yellow-500" />
                        </button>
                      </div>
                    </div>
                    <p className="text-sm whitespace-pre-wrap break-words">{s.content || "📎 " + (s.type || "media")}</p>
                    <p className="text-[10px] text-muted-foreground mt-1">{formatTime(s.timestamp)}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      /* ================================================================
         SETTINGS PAGE (full-page version)
         ================================================================ */

      function SettingsPage() {
        const [path, setLocation] = useHashRoute();
        return (
          <div className="h-screen w-full flex flex-col bg-background relative overflow-hidden">
            <WaterBackground />
            <div className="relative z-10 flex items-center justify-between p-4 safe-top">
              <button onClick={() => setLocation("/")} className="flex items-center gap-2">
                <ArrowLeft className="h-5 w-5" />
                <span>Back</span>
              </button>
              <h1 className="text-lg font-semibold">Settings</h1>
              <div className="w-20" />
            </div>
            <div className="relative z-10 flex-1 overflow-y-auto eez-scroll p-4">
              <div className="max-w-md mx-auto">
                <SettingsModal onClose={() => setLocation("/")} />
              </div>
            </div>
          </div>
        );
      }

      /* ================================================================
         APP (hash router)
         ================================================================ */

      function App() {
        const prefs = usePrefsSnapshot();
        const [path] = useHashRoute();
        const clean = path.startsWith("#") ? path.slice(1) : path;

        let page;
        if (clean === "/" || clean === "") {
          page = <HomePage />;
        } else if (clean === "/starred") {
          page = <StarredPage />;
        } else if (clean === "/settings") {
          page = <SettingsPage />;
        } else {
          const m = clean.match(/^\/g\/([^/]+)$/);
          if (m) {
            page = <ChatPage key={m[1]} groupId={m[1]} />;
          } else {
            const dm = clean.match(/^\/dm\/([^/]+)$/);
            if (dm) {
              const otherUserId = dm[1];
              // Determine DM room id from current user
              const user = loadJson(STORAGE_KEYS.user, null);
              if (user && otherUserId) {
                const dmRoomId = buildDmRoomId(user.id, otherUserId);
                // Auto-create the DM room locally if missing
                const existing = loadChannels().find((c) => c.id === dmRoomId);
                if (!existing) {
                  const other = getCachedUser(otherUserId) || { displayName: "user" };
                  const channel = makeChannel("dm-" + (other.displayName || "user"), "", {
                    id: dmRoomId, isDM: true, type: "private", dmParticipants: [user.id, otherUserId], createdBy: user.id,
                  });
                  upsertChannel(channel);
                }
                // Redirect to the chat
                window.location.hash = "/g/" + dmRoomId;
                page = <FullScreenSpinner />;
              } else {
                page = <HomePage />;
              }
            } else {
              page = (
                <div className="h-screen w-full flex items-center justify-center bg-background">
                  <div className="text-center">
                    <h1 className="text-2xl font-semibold mb-2">404</h1>
                    <p className="text-sm text-muted-foreground">Not found</p>
                    <button onClick={() => window.location.hash = "/"} className="mt-4 px-4 py-2 rounded-full bg-primary text-primary-foreground">Home</button>
                  </div>
                </div>
              );
            }
          }
        }
        return page;
      }

      /* ================================================================
         MOUNT
         ================================================================ */

      const root = createRoot(document.getElementById("root"));
      root.render(<App />);

      requestAnimationFrame(() => {
        const splash = document.getElementById("boot-splash");
        if (splash) {
          splash.style.opacity = "0";
          splash.style.transition = "opacity 0.3s ease";
          setTimeout(() => splash.remove(), 320);
        }
      });
    </script>
  </body>
</html>
