<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F2F2F5;
    --gold:#FFD24D;
    --blue:#6FA8FF;
    --red:#E07A7A;
    --panel:rgba(242,242,245,.05);
    --panel-strong:rgba(242,242,245,.09);
    --panel-explore:rgba(242,242,245,.007);
    --panel-explore-strong:rgba(242,242,245,.014);
    --line:rgba(242,242,245,.14);
    --field:rgba(0,0,0,.38);
    --gold-ink:#7a5b00;
    --cx:50%; --cy:42%;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root{
      --ink:#111114;
      --panel:rgba(17,17,20,.05);
      --panel-strong:rgba(17,17,20,.09);
      --panel-explore:rgba(17,17,20,.009);
      --panel-explore-strong:rgba(17,17,20,.016);
      --line:rgba(17,17,20,.16);
      --field:rgba(255,255,255,.5);
      --gold-ink:#7a5b00;
      color-scheme:light;
    }
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    background:#000; color:var(--ink); margin:0;
    position:fixed; inset:0; width:100%; overflow:hidden; overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
  }
  @media (prefers-color-scheme: light){ body{background:#d9d9d9;} }
  .void{position:fixed; inset:0; overflow:hidden;}
  .void::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      repeating-conic-gradient(from 0deg at var(--cx) var(--cy), rgba(255,255,255,.012) 0deg 1deg, transparent 1deg 2deg),
      repeating-radial-gradient(circle at var(--cx) var(--cy), rgba(255,255,255,.010) 0px 1px, transparent 1px 4px),
      radial-gradient(circle at var(--cx) var(--cy), #161616 0%, #0d0d0d 34%, #050505 62%, #010101 100%);
  }
  .void::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at var(--cx) var(--cy), transparent 0%, transparent 45%, rgba(0,0,0,.55) 82%, rgba(0,0,0,.9) 100%);
  }
  @media (prefers-color-scheme: light){
    .void::before{background:linear-gradient(155deg,#fbfbfb 0%,#e4e4e4 30%,#bcbcbc 62%,#d2d2d2 100%);}
    .void::after{background:radial-gradient(circle at var(--cx) var(--cy), transparent 0%, transparent 55%, rgba(0,0,0,.12) 100%);}
  }
  .layer{position:relative; z-index:1; height:100%; display:flex; flex-direction:column;}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
  a{color:inherit; text-decoration:none;}
  .view{display:flex; flex-direction:column; height:100%; min-height:0;}
  .scroll{flex:1; overflow-y:auto; overscroll-behavior:contain; padding:18px 16px 48px; -webkit-overflow-scrolling:touch;}
  .stats{display:flex; gap:8px; flex-wrap:wrap;}
  .stat{background:var(--panel-strong); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-radius:999px; padding:9px 15px; font-size:.8rem; display:inline-flex; align-items:center; gap:6px; box-shadow:0 8px 20px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.09);}
  .stat b{font-weight:700;}
  .stat.gold{color:var(--gold);}
  .stat.redstat{color:#E5484D;}
  @media (prefers-color-scheme: light){ .stat.gold{color:var(--gold-ink);} }
  .pill{
    background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:999px; padding:8px 16px; font-size:.82rem; display:inline-flex; align-items:center; gap:6px;
    box-shadow:0 6px 16px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .pill.sel{font-weight:700; background:var(--panel-strong); box-shadow:0 8px 20px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.12);}
  .pill.goldsel{background:var(--gold); color:#191408; font-weight:700; box-shadow:0 8px 22px rgba(255,210,77,.28), inset 0 1px 0 rgba(255,255,255,.35);}
  .pill.blue{color:var(--blue);}
  .pill:disabled,.pill.dimmed{opacity:.38; cursor:not-allowed; pointer-events:none;}
  .secttl{font-weight:700; font-size:1rem; margin:26px 0 4px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .secttl .cnt{font-size:.8rem; font-weight:400;}
  .inp{
    width:100%; border-radius:999px; padding:11px 16px; font-size:16px;
    border:none; background:var(--field); color:var(--ink); font:inherit;
    outline:none; box-shadow:inset 0 2px 10px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.05);
  }
  .inp::placeholder{color:var(--ink); opacity:.55;}
  .search{
    width:100%; border-radius:999px; padding:12px 18px; font-size:16px;
    border:none; background:var(--field); color:var(--ink); font:inherit;
    outline:none; box-shadow:inset 0 2px 10px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.05);
  }
  .search::placeholder{color:var(--ink); opacity:.55;}
  .statusline{font-size:.82rem; overflow-wrap:anywhere;}
  .statusline.err{color:var(--red);}
  .row{padding:16px; margin-bottom:12px; background:var(--panel-explore); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); border-radius:18px; box-shadow:0 10px 24px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.05);}
  .row.readonly{background:var(--panel-explore); box-shadow:0 6px 16px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.04);}
  .status-text{display:inline-flex; align-items:center; padding:8px 4px; font-size:.82rem;}
  .status-text.sent{color:var(--gold); font-weight:700;}
  @media (prefers-color-scheme: light){ .status-text.sent{color:var(--gold-ink);} }
  .biz-section{margin-bottom:8px;}
  .sent-area{margin-top:30px; padding-top:6px;}
  .sent-area .secttl{margin-top:0;}
  #exploreView .stat{background:var(--panel-explore-strong); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);}
  .row .nm{font-weight:700; font-size:.95rem; overflow-wrap:anywhere;}
  .row .dt{font-size:.83rem; margin-top:4px; overflow-wrap:anywhere;}
  .row .dt a{color:var(--blue);}
  .acts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .biz-top{display:flex; align-items:flex-start; gap:12px;}
  .biz-top-main{flex:1; min-width:0;}
  .biz-select{flex:none; margin-top:1px;}
  .biz-footer{align-items:center;}
  .biz-spacer{flex:1 1 auto; min-width:6px;}
  .cat{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:16px; margin-bottom:10px; font-size:.92rem;
    background:var(--panel-explore); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    border-radius:16px; box-shadow:0 10px 24px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .cat .nm{flex:1; min-width:0; overflow-wrap:anywhere;}
  .cat .ct{font-size:.78rem; white-space:nowrap;}
  .cat .sn{font-size:.78rem; color:var(--gold); white-space:nowrap;}
  @media (prefers-color-scheme: light){ .cat .sn{color:var(--gold-ink);} }
  .catdrop{position:relative; margin-top:12px; z-index:30;}
  .catdrop-btn{display:inline-flex; align-items:center; gap:8px; max-width:100%; padding:9px 15px; border-radius:999px; font-size:.84rem; background:var(--panel-explore-strong); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); box-shadow:0 6px 16px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.05);}
  .catdrop-btn .catdrop-label{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .catdrop-btn .catdrop-count{font-size:.76rem; opacity:.85; white-space:nowrap;}
  .catdrop-btn .catdrop-chev{flex:none; display:inline-flex; transition:transform .15s ease;}
  .catdrop-btn .catdrop-chev svg{width:14px; height:14px; display:block;}
  .catdrop.open .catdrop-btn .catdrop-chev{transform:rotate(180deg);}
  .catdrop.hasfilter .catdrop-btn{background:var(--gold); color:#191408; box-shadow:0 8px 22px rgba(255,210,77,.28), inset 0 1px 0 rgba(255,255,255,.35);}
  .catdrop-panel{position:absolute; top:calc(100% + 8px); left:0; width:min(420px,100%); max-width:100%; border-radius:18px; padding:10px; background:var(--panel-strong); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:0 18px 40px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.10);}
  .catdrop-search{margin-bottom:6px;}
  .catdrop-list{max-height:320px; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;}
  .catdrop-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:11px 12px; border-radius:12px; font-size:.86rem;}
  .catdrop-item:active{background:var(--panel-strong);}
  .catdrop-item .nm{flex:1; min-width:0; overflow-wrap:anywhere;}
  .catdrop-item .ct{font-size:.76rem; white-space:nowrap; opacity:.85;}
  .catdrop-item.sel{font-weight:700; color:var(--gold);}
  @media (prefers-color-scheme: light){ .catdrop-item.sel{color:var(--gold-ink);} }
  .catdrop-empty{padding:12px; font-size:.84rem;}
  .row .catlabel{display:inline-block; font-size:.7rem; font-weight:700; letter-spacing:.02em; color:var(--gold); margin-bottom:5px;}
  @media (prefers-color-scheme: light){ .row .catlabel{color:var(--gold-ink);} }
  #exploreView .row{background:var(--panel-explore);}
  .explore-controls{margin-top:12px;}
  .explore-selbar{margin-top:10px;}
  button.stat{cursor:pointer; font:inherit;}
  button.stat:active{transform:scale(.97);}
  #sentView .row{background:var(--panel-explore);}
  .sent-compose{margin:4px 0 16px; padding:16px; border-radius:18px; background:var(--panel-strong); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 10px 26px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.10);}
  .sent-compose .nm{font-weight:700; font-size:.95rem; overflow-wrap:anywhere;}
  .sent-compose .sub{font-size:.8rem; margin-top:2px; overflow-wrap:anywhere;}
  .sent-compose .inp{margin-top:12px;}
  .sent-compose .acts{margin-top:10px;}
  .manual-msg{margin-top:10px; padding:9px 12px; border-radius:12px; background:var(--gold); color:#191408; font-size:.82rem; line-height:1.45; overflow-wrap:anywhere; max-width:92%;}
  .manual-msg .bt{display:block; font-size:.66rem; margin-top:3px; opacity:.7;}
  .manual-msg.failed{background:rgba(224,122,122,.25); color:var(--ink);}
  .manual-msg.local{background:var(--panel-strong); color:var(--ink); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
  .attach-note{flex:1 1 100%; font-size:.72rem; opacity:.85; padding:2px 4px 0;}
  .top{padding:18px 16px 10px; display:flex; flex-direction:column; gap:12px;}
  .bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .bar .ttl{flex:1; min-width:0; font-weight:700; font-size:1rem; overflow-wrap:anywhere;}
  .filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .numinp{
    width:110px; border-radius:999px; padding:8px 14px; font-size:16px;
    border:none; background:var(--field); color:var(--ink); font:inherit; outline:none;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.05);
  }
  .selbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    border-radius:999px; padding:8px 8px 8px 16px;
    background:var(--panel-strong); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    font-size:.85rem;
    box-shadow:0 10px 26px rgba(0,0,0,.26), 0 0 18px rgba(255,210,77,.18), inset 0 1px 0 rgba(255,255,255,.10);
  }
  .selbar .grow{flex:1;}
  .more{width:100%; margin-top:16px; padding:13px; justify-content:center;}
  .msg{padding:18px 6px; font-size:.9rem;}
  .hidden{display:none !important;}

  /* Messaging panel */
  .mtop{padding:18px 16px 12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .msgwrap{flex:1; display:flex; min-height:0;}
  .tlist{width:340px; flex:none; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:12px 10px; box-shadow:14px 0 28px -20px rgba(0,0,0,.55);}
  .trow{display:flex; gap:10px; width:100%; text-align:left; padding:14px 16px; margin-bottom:8px; align-items:flex-start; background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-radius:16px; box-shadow:0 8px 20px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.07);}
  .trow.sel{background:var(--panel-strong); box-shadow:0 10px 24px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);}
  .trow .main{flex:1; min-width:0;}
  .trow .nm{font-weight:700; font-size:.92rem; overflow-wrap:anywhere;}
  .trow .pv{font-size:.82rem; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .trow .tm{font-size:.72rem; white-space:nowrap; padding-top:2px;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--gold); flex:none; margin-top:6px; box-shadow:0 0 9px rgba(255,210,77,.6);}
  .dot.red{width:7px; height:7px; background:#E5484D; box-shadow:0 0 9px rgba(229,72,77,.6);}
  .dot.off{visibility:hidden; box-shadow:none;}
  .tpane{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0;}
  .thead{padding:14px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; box-shadow:0 14px 22px -16px rgba(0,0,0,.45);}
  .thead .who{flex:1; min-width:0;}
  .thead .who .nm{font-weight:700; font-size:.98rem; overflow-wrap:anywhere;}
  .thead .who .sub{font-size:.8rem; margin-top:2px; overflow-wrap:anywhere;}
  .msgs{flex:1; overflow-y:auto; overscroll-behavior:contain; padding:18px 16px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch;}
  .bub{max-width:76%; padding:10px 14px; border-radius:16px; font-size:.88rem; line-height:1.5; overflow-wrap:anywhere;}
  .bub.in{align-self:flex-start; background:var(--panel-strong); border-bottom-left-radius:6px; box-shadow:0 6px 16px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.08);}
  .bub.out{align-self:flex-end; background:var(--gold); color:#191408; border-bottom-right-radius:6px;}
  .bub.failed{align-self:flex-end; background:rgba(224,122,122,.25); color:var(--ink); border-bottom-right-radius:6px;}
  .bub.localnote{align-self:flex-end; background:var(--panel-strong); color:var(--ink); border-bottom-right-radius:6px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
  .bub .bt{display:block; font-size:.68rem; margin-top:5px; opacity:.7;}
  .inrow{display:flex; gap:8px; padding:12px 16px; align-items:center; box-shadow:0 -14px 22px -16px rgba(0,0,0,.45);}
  .inrow .inp{flex:1; min-width:0;}
  .attachbtn{flex:none; width:44px; height:44px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:var(--panel-strong); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 6px 16px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.10); color:var(--ink);}
  .attachbtn:active{transform:scale(.96);}
  .attachbtn svg{width:20px; height:20px; display:block;}
  .attach-tray{display:flex; flex-wrap:wrap; gap:8px; padding:10px 16px 2px;}
  .attach-tray:empty{display:none;}
  .achip{display:inline-flex; align-items:center; gap:8px; max-width:100%; background:var(--panel-strong); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-radius:999px; padding:6px 8px 6px 10px; box-shadow:0 6px 16px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.09); font-size:.78rem;}
  .achip .thumb{width:28px; height:28px; border-radius:50%; object-fit:cover; flex:none; box-shadow:0 2px 8px rgba(0,0,0,.25);}
  .achip .ficon{width:22px; height:22px; flex:none; display:inline-flex; align-items:center; justify-content:center; opacity:.9;}
  .achip .ficon svg{width:18px; height:18px;}
  .achip .meta{min-width:0; display:flex; flex-direction:column; line-height:1.25;}
  .achip .fname{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px;}
  .achip .fsize{opacity:.75; font-size:.7rem;}
  .achip .rm{flex:none; width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:rgba(0,0,0,.18); font-size:1rem; line-height:1;}
  @media (prefers-color-scheme: light){ .achip .rm{background:rgba(255,255,255,.55);} }
  .bub.filebub{display:flex; align-items:center; gap:10px; padding:10px 12px; min-width:0;}
  .bub.filebub .fthumb{width:44px; height:44px; border-radius:10px; object-fit:cover; flex:none; box-shadow:0 3px 10px rgba(0,0,0,.22);}
  .bub.filebub .ficon{width:36px; height:36px; flex:none; border-radius:10px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.14);}
  .bub.in.filebub .ficon{background:rgba(255,255,255,.10);}
  @media (prefers-color-scheme: light){ .bub.out.filebub .ficon{background:rgba(0,0,0,.10);} .bub.in.filebub .ficon{background:rgba(0,0,0,.08);} }
  .bub.filebub .ficon svg{width:20px; height:20px;}
  .bub.filebub .fmeta{min-width:0; flex:1;}
  .bub.filebub .fname{display:block; font-weight:700; font-size:.84rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px;}
  .bub.filebub .fsize{font-size:.72rem; opacity:.75; margin-top:1px;}
  .bub.filebub .bt{margin-top:2px;}
  .backpane{display:none;}
  #homeView .scroll{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100%;}
  #loginView .scroll{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100%;}
  .loginpanel{width:100%; max-width:340px; margin:0;}
  .msgfilters{padding:0 16px 12px;}
  .bigpill{position:relative;}
  .badge{
    flex:none; margin-left:2px;
    background:#E5484D; color:#fff; border-radius:999px; padding:3px 10px;
    font-size:.82rem; font-weight:700; box-shadow:0 4px 14px rgba(229,72,77,.5);
  }
  #homeView .stats{justify-content:center; width:100%; max-width:560px; margin-left:auto; margin-right:auto;}
  .homeactions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; width:100%; max-width:560px; margin-left:auto; margin-right:auto; justify-content:center;}
  .bigpill{
    flex:1 1 160px; justify-content:center; text-align:center;
    padding:18px 20px; font-size:1rem; border-radius:999px;
  }
  .bigpill .cnt{font-weight:700;}
  @media (max-width:720px){
    .tlist{width:100%; border-right:none;}
    .tpane{display:none;}
    .msgwrap.showthread .tlist{display:none;}
    .msgwrap.showthread .tpane{display:flex;}
    .backpane{display:inline-flex;}
    .bub{max-width:88%;}
  }
  @media (max-width:640px){
    .scroll{padding:14px 12px 36px;}
    .stats{gap:6px;}
    .stat{padding:6px 11px; font-size:.72rem; gap:4px;}
    .pill{padding:6px 12px; font-size:.74rem;}
    .bigpill{padding:12px 14px; font-size:.88rem; flex-basis:132px;}
    .badge{padding:2px 8px; font-size:.72rem;}
    .homeactions{gap:8px; margin-top:16px;}
    .mtop{padding:12px 12px 8px; gap:8px;}
    .msgfilters{padding:0 12px 8px;}
    #msgFilters{gap:6px;}
    #msgFilters .pill{padding:5px 10px; font-size:.72rem; gap:4px;}
    .filters{gap:6px;}
    .tlist{padding:8px;}
    .trow{padding:10px 12px; margin-bottom:6px; gap:8px; border-radius:13px;}
    .trow .nm{font-size:.84rem;}
    .trow .pv{font-size:.75rem; margin-top:2px;}
    .trow .tm{font-size:.66rem; padding-top:1px;}
    .dot{margin-top:5px;}
    .thead{padding:10px 12px; gap:8px;}
    .thead .who .nm{font-size:.9rem;}
    .thead .who .sub{font-size:.74rem; margin-top:1px;}
    .msgs{padding:12px; gap:8px;}
    .bub{padding:8px 11px; font-size:.82rem; border-radius:13px; line-height:1.45;}
    .bub .bt{font-size:.62rem; margin-top:4px;}
    .bub.filebub{padding:8px 10px; gap:8px;}
    .bub.filebub .fthumb{width:36px; height:36px; border-radius:8px;}
    .bub.filebub .ficon{width:30px; height:30px; border-radius:8px;}
    .bub.filebub .fname{font-size:.78rem;}
    .bub.filebub .fsize{font-size:.66rem;}
    .inrow{padding:8px 10px; gap:6px;}
    .inrow .inp{padding:8px 13px;}
    .inrow .pill{padding:7px 13px; font-size:.76rem;}
    .attachbtn{width:38px; height:38px;}
    .attachbtn svg{width:18px; height:18px;}
    .attach-tray{padding:8px 10px 0; gap:6px;}
    .achip{padding:5px 6px 5px 8px; font-size:.72rem; gap:6px;}

<script>
"use strict";
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmt(n){ return Number(n).toLocaleString("en-US"); }
function fmtSize(bytes){
  var n = Number(bytes) || 0;
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (Math.round(n / 102.4) / 10) + " KB";
  if (n < 1024 * 1024 * 1024) return (Math.round(n / 104857.6) / 10) + " MB";
  return (Math.round(n / 107374182.4) / 10) + " GB";
}
function fmtListWhen(t){
  if (!t) return "";
  var d = new Date(t), now = new Date();
  var time = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return time;
  var yest = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return "Yesterday";
  if ((now - d) < 7 * 86400000) return d.toLocaleDateString("en-US", { weekday: "short" });
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function fmtBubbleWhen(t){
  if (!t) return "Sent";
  var d = new Date(t), now = new Date();
  var time = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return time;
  var yest = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return "Yesterday " + time;
  if ((now - d) < 7 * 86400000) return d.toLocaleDateString("en-US", { weekday: "short" }) + " " + time;
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " " + time;
}
var FILE_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';

function messageFor(n, u){ return "Hi, I came across your business Google profile and noticed you don't have a website. I build websites for local businesses to help customers find you, know your hours, and contact you if needed. It is just $27 monthly, no building fee, it is literally cheaper than two cups of coffee. You can see our sketch minimalistic site we built for you at " + u; }

/* Marks and repo sync, through the same data path SiteDesk uses. Marks live
   in iamnottaiiii/sitedesk-data under texting/: one shard per category plus a
   small index of counts. The local copy stays as a mirror so the page works
   offline, and anything that fails to sync stays pending and retries. */
var DATA = "https://bjvfi.com/sitedesk/data/queue/";
var KEY = "bjvfi_database_sent_v1";
var PKEY = "bjvfi_database_pending_v1";
var sent = {};
try { sent = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { sent = {}; }
function saveSent(){ try { localStorage.setItem(KEY, JSON.stringify(sent)); } catch(e){} }
var GH_API = "https://api.github.com/repos/iamnottaiiii/sitedesk-data";
var INDEX_PATH = "texting/index.json";
var TOKEN = (typeof SITEDESK_DATA_TOKEN !== "undefined" && SITEDESK_DATA_TOKEN) ? SITEDESK_DATA_TOKEN : null;
var pending = {};
try { pending = JSON.parse(localStorage.getItem(PKEY) || "{}") || {}; } catch(e) { pending = {}; }
function savePending(){ try { localStorage.setItem(PKEY, JSON.stringify(pending)); } catch(e){} }
var repoCounts = null;
var loadedShards = {};
var shardLoading = {};
var syncActive = 0, syncChain = Promise.resolve(), queuedOps = {}, opSeq = 0;
/* Row details for every business loaded this session, keyed by slug. */
var bizInfo = {};

function setSyncLabel(){
  var el = document.getElementById("syncStat");
  if (!el) return;
  if (!TOKEN) el.textContent = "Device only";
  else if (syncActive > 0) el.textContent = "Saving";
  else if (Object.keys(pending).length) el.textContent = "Save failed";
  else el.textContent = "Repo sync";
}
function b64encode(bytes){
  var bin = "", b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  for (var i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
  return btoa(bin);
}
function b64decodeToBytes(b64){
  var bin = atob(String(b64).replace(/\s/g, ""));
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function ghHeaders(){
  return { "Accept": "application/vnd.github+json", "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" };
}
async function ghGetJson(path){
  var res = await fetch(GH_API + "/contents/" + path + "?ref=main", { method: "GET", cache: "no-store", headers: ghHeaders() });
  if (res.status === 404) return null;
  if (!res.ok){ var e = new Error("GitHub read failed (" + res.status + ")"); e.status = res.status; throw e; }
  var file = await res.json();
  return { data: JSON.parse(new TextDecoder().decode(b64decodeToBytes(file.content || ""))), sha: file.sha };
}
async function ghPutJson(path, obj, sha){
  var body = { message: "database: update " + path, content: b64encode(new TextEncoder().encode(JSON.stringify(obj, null, 2))) };
  if (sha) body.sha = sha;
  var res = await fetch(GH_API + "/contents/" + path, { method: "PUT", cache: "no-store", headers: ghHeaders(), body: JSON.stringify(body) });
  if (!res.ok){ var e2 = new Error("GitHub save failed (" + res.status + ")"); e2.status = res.status; throw e2; }
  return res.json();
}
/* Fresh read, change one thing, save with that read's sha. On a 409 or 422
   (someone else saved first) start over with a fresh read, up to 5 tries. */
async function ghUpdateJson(path, fallback, mutate){
  var lastErr = null;
  for (var attempt = 0; attempt < 5; attempt++){
    var cur = await ghGetJson(path);
    var data = cur ? cur.data : JSON.parse(JSON.stringify(fallback));
    mutate(data);
    try {
      await ghPutJson(path, data, cur ? cur.sha : null);
      return data;
    } catch(e){
      lastErr = e;
      if ((e.status === 409 || e.status === 422) && attempt < 4) continue;
      throw e;
    }
  }
  throw lastErr;
}
function shardPath(catName){
  return "texting/cats/" + manifest.cats[catName].files[0];
}
async function syncOp(op){
  var shard = await ghUpdateJson(shardPath(op.c), {}, function(data){
    if (op.mark){
      var rec = { t: op.t, n: op.n, p: op.p };
      if (op.a) rec.a = op.a;
      if (typeof op.w === "number") rec.w = op.w;
      data[op.slug] = rec;
    }
    else delete data[op.slug];
  });
  var count = Object.keys(shard).length;
  await ghUpdateJson(INDEX_PATH, { total: 0, cats: {} }, function(idx){
    idx.cats = idx.cats || {};
    if (count) idx.cats[op.c] = count; else delete idx.cats[op.c];
    var total = 0, k;
    for (k in idx.cats) total += idx.cats[k];
    idx.total = total;
    repoCounts = idx.cats;
  });
}
function enqueueSync(op){
  if (!TOKEN) { setSyncLabel(); return Promise.resolve(false); }
  if (queuedOps[op.id]) return Promise.resolve(false);
  queuedOps[op.id] = true;
  syncActive++;
  setSyncLabel();
  syncChain = syncChain.then(async function(){
    try {
      await syncOp(op);
      if (pending[op.slug] && pending[op.slug].id === op.id){ delete pending[op.slug]; savePending(); }
      return true;
    } catch(e){
      return false;
    } finally {
      syncActive--;
      delete queuedOps[op.id];
      setSyncLabel();
      refreshStats();
      if (!document.getElementById("exploreView").classList.contains("hidden")) renderBiz(false);
      if (!document.getElementById("sentView").classList.contains("hidden")) renderSentView();
    }
  });
  return syncChain;
}
function retryPending(){
  if (!TOKEN || !manifest) return;
  Object.keys(pending).forEach(function(slug){ enqueueSync(pending[slug]); });
}
window.addEventListener("online", retryPending);
function mirrorCounts(){
  var mc = {}, k;
  for (k in sent){ var c = sent[k] && sent[k].c; if (c) mc[c] = (mc[c] || 0) + 1; }
  return mc;
}
function allCatCounts(){
  var mc = mirrorCounts(), out = {}, name;
  if (repoCounts) for (name in repoCounts) out[name] = repoCounts[name];
  for (name in mc){
    if (loadedShards[name] || pendingCat(name) || !(name in out)) out[name] = mc[name];
  }
  return out;
}
function pendingCat(name){
  var k;
  for (k in pending){ if (pending[k] && pending[k].c === name) return true; }
  return false;
}
function catSentCount(name){ return allCatCounts()[name] || 0; }
function sentTotal(){
  var counts = allCatCounts(), total = 0, name;
  for (name in counts) total += counts[name];
  return total;
}
function setMarked(slug, mark, w){
  var op;
  if (!mark && sent[slug]){
    var prev = sent[slug];
    delete sent[slug];
    op = { id: ++opSeq + "-" + Date.now(), slug: slug, c: prev.c || "", mark: false, t: prev.t || 0, n: prev.n || "", p: prev.p || "" };
  } else if (mark && !sent[slug]){
    var info = bizInfo[slug] || {};
    var entry = { t: Date.now(), n: info.n || "", p: info.p || "", c: info.c || "" };
    if (info.a) entry.a = info.a;
    if (typeof w === "number") entry.w = w;
    sent[slug] = entry;
    op = { id: ++opSeq + "-" + Date.now(), slug: slug, c: entry.c, mark: true, t: entry.t, n: entry.n, p: entry.p };
    if (entry.a) op.a = entry.a;
    if (typeof entry.w === "number") op.w = entry.w;
  } else return;
  saveSent();
  if (TOKEN){ pending[slug] = op; savePending(); }
  enqueueSync(op);
}
/* Load one category's shard and merge it into the mirror, the same merge
   the category view has always done on open. */
function ensureShard(name){
  if (!TOKEN || !manifest || !manifest.cats[name] || loadedShards[name] || shardLoading[name]) return Promise.resolve(false);
  shardLoading[name] = true;
  return ghGetJson(shardPath(name)).then(function(cur){
    var shard = cur ? cur.data : {};
    loadedShards[name] = true;
    if (!repoCounts) repoCounts = {};
    repoCounts[name] = Object.keys(shard).length;
    var slug;
    for (slug in shard){
      var v = shard[slug] || {};
      var e = { t: v.t || 0, n: v.n || "", p: v.p || "", c: name };
      if (v.a) e.a = v.a;
      if (typeof v.w === "number") e.w = v.w;
      sent[slug] = e;
    }
    for (slug in sent){
      if (sent[slug] && sent[slug].c === name && !(slug in shard) && !pending[slug]) delete sent[slug];
    }
    saveSent(); refreshStats();
    if (!document.getElementById("exploreView").classList.contains("hidden")) renderBiz(false);
    if (!document.getElementById("sentView").classList.contains("hidden")) renderSentView();
    return true;
  }).catch(function(){ return false; }).then(function(r){
    delete shardLoading[name];
    return r;
  });
}

/* Queue data: the manifest paints first from its own counts alone.
   Category files load one at a time, only when that category is opened
   or picked. The All categories pool grows one queue chunk at a time as
   he pages: the first chunk loads up front, then the next chunk loads
   whenever the loaded list runs out, so every business in the queue
   stays reachable without ever loading the whole queue at once. */
var manifest = null;
var sortedCatList = [];
var poolRows = [], chunksLoadedCount = 0, chunkLoading = null, chunkLoadFailed = false;
var catRowsCache = {}, catLoadingMap = {}, catLoadError = {};
function regRows(rows){
  (rows || []).forEach(function(r){
    if (r && r[0]) bizInfo[r[0]] = { n: r[1] || "", c: r[2] || "", p: r[3] || "", a: r[4] || "" };
  });
}
function buildSortedCats(){
  sortedCatList = Object.keys(manifest.cats).map(function(name){
    return { name: name, count: manifest.cats[name].count || 0 };
  }).sort(function(a, b){
    if (b.count !== a.count) return b.count - a.count;
    return a.name < b.name ? -1 : 1;
  });
}
function findCatObj(name){
  for (var i = 0; i < sortedCatList.length; i++) if (sortedCatList[i].name === name) return sortedCatList[i];
  return null;
}
function loadNextChunk(){
  if (!manifest || !manifest.chunks || chunksLoadedCount >= manifest.chunks.length) return Promise.resolve(false);
  if (chunkLoading) return chunkLoading;
  chunkLoadFailed = false;
  var file = manifest.chunks[chunksLoadedCount];
  chunkLoading = fetch(DATA + file).then(function(r){
    if (!r.ok) throw new Error("chunk load failed");
    return r.json();
  }).then(function(rows){
    poolRows = poolRows.concat(rows || []);
    regRows(rows || []);
    chunksLoadedCount++;
    chunkLoading = null;
    return true;
  }).catch(function(){
    chunkLoading = null;
    chunkLoadFailed = true;
    return false;
  });
  return chunkLoading;
}
function loadCat(name){
  if (catRowsCache[name]) return Promise.resolve(catRowsCache[name]);
  if (catLoadingMap[name]) return catLoadingMap[name];
  var file = manifest.cats[name].files[0];
  catLoadingMap[name] = fetch(DATA + file).then(function(r){
    if (!r.ok) throw new Error("category load failed");
    return r.json();
  }).then(function(rows){
    catRowsCache[name] = rows || [];
    delete catLoadError[name];
    regRows(catRowsCache[name]);
    return catRowsCache[name];
  }).catch(function(){
    catLoadError[name] = true;
    delete catLoadingMap[name];
    return null;
  });
  return catLoadingMap[name];
}
function catLoadFailed(){ return !!(activeCategory && catLoadError[activeCategory]); }

/* Texting: sending goes through TextNow from this page. Tapping Send copies the message, opens TextNow, and marks the business Sent. The Worker is only the login gate now. */
var TEXT_API = "https://bjvfi-text.iamnottaiii.workers.dev";
var TKEY_LS = "bjvfi_text_key";
var textConfigured = null;
var repliesState = "idle";
function textKey(){ try { return localStorage.getItem(TKEY_LS) || ""; } catch(e){ return ""; } }
async function checkTexting(){
  try {
    var r = await fetch(TEXT_API + "/health");
    var j = await r.json();
    textConfigured = !!j.configured;
  } catch(e){ textConfigured = null; }
}

/* View switching */
function showView(id){
  ["loginView", "homeView", "exploreView", "sentView"].forEach(function(v){
    document.getElementById(v).classList.toggle("hidden", v !== id);
  });
}
function goHome(){
  refreshStats();
  showView("homeView");
}
document.getElementById("homeSentBtn").addEventListener("click", function(){
  renderSentView();
  showView("sentView");
  if (repoCounts){
    Object.keys(repoCounts).forEach(function(name){
      if (repoCounts[name] > 0) ensureShard(name);
    });
  }
});
document.getElementById("homeExploreBtn").addEventListener("click", function(){
  refreshStats();
  renderExplore();
  showView("exploreView");
  ensureExploreData();
});
document.getElementById("exploreBackBtn").addEventListener("click", function(){ goHome(); });

/* Explore: stats, category dropdown, leads, selection, sending */
function refreshStats(){
  if (manifest){
    document.getElementById("totalCount").textContent = fmt(manifest.total);
    document.getElementById("leftCount").textContent = fmt(manifest.total - sentTotal());
  }
  var inline = document.getElementById("exploreSentInline");
  if (inline) inline.textContent = fmt(sentTotal());
  refreshHomeStats();
}
function repliedCount(){ var n = 0; for (var slug in board){ if (board[slug] && board[slug].r && sent[slug]) n++; } return n; }
function refreshHomeStats(){
  var a = document.getElementById("homeSent"); if (a) a.textContent = fmt(sentTotal());
  var b = document.getElementById("homeSentCount"); if (b) b.textContent = fmt(sentTotal());
  var c = document.getElementById("homeRepliedCt"); if (c) c.textContent = fmt(repliedCount());
}
var activeCategory = null;
var exploreQuery = "";
var selection = {}, sending = false;
var shown = 100;
var PAGE = 100;
function currentSourceRows(){
  if (activeCategory) return catRowsCache[activeCategory] || null;
  return poolRows.length ? poolRows : null;
}
function ensureExploreData(){
  if (activeCategory){
    if (!catRowsCache[activeCategory]){
      loadCat(activeCategory).then(function(){ renderBiz(false); });
    }
    ensureShard(activeCategory);
  } else if (!poolRows.length && !chunkLoading){
    loadNextChunk().then(function(){ renderBiz(false); });
  }
}
function visibleLeads(){
  var src = currentSourceRows();
  if (!src) return null;
  var q = exploreQuery.trim().toLowerCase();
  var out = [];
  src.forEach(function(r){
    var b = { slug: r[0], name: r[1] || "", cat: r[2] || "", phone: r[3] || "", addr: r[4] || "" };
    if (activeCategory && b.cat !== activeCategory) return;
    if (q){
      var hay = (b.name + " " + b.phone + " " + b.addr + " " + b.cat).toLowerCase();
      if (hay.indexOf(q) === -1) return;
    }
    out.push(b);
  });
  return out;
}
/* Category filter: ONE dropdown. Categories live only inside its panel. */
var catDropOpen = false;
var catDropQuery = "";
function renderCatDrop(){
  var wrap = document.getElementById("catDrop");
  var btn = document.getElementById("catDropBtn");
  var panel = document.getElementById("catDropPanel");
  document.getElementById("catDropLabel").textContent = activeCategory ? activeCategory : "All categories";
  var cnt = document.getElementById("catDropCount");
  if (activeCategory){
    var c = findCatObj(activeCategory);
    cnt.textContent = c ? fmt(c.count) : "";
  } else {
    cnt.textContent = "";
  }
  wrap.classList.toggle("hasfilter", !!activeCategory);

function randomPick(n){
  var rows = visibleLeads();
  if (!rows) return;
  var pool = rows.filter(function(b){ return !sent[b.slug]; }).slice();
  for (var i = pool.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  selection = {};
  pool.slice(0, Math.min(n, pool.length)).forEach(function(b){
    if (!sent[b.slug]) selection[b.slug] = true;
  });
  pruneSelection();
  document.getElementById("sendStatus").textContent = "";

var BOARD_KEY = "bjvfi_database_board_v1";

  if (!TOKEN) return Promise.resolve();
  boardChain = boardChain.then(async function(){
    try {
      await ghUpdateJson(BOARD_PATH, {}, function(data){
        Object.keys(data).forEach(function(k){ delete data[k]; });

  });

function setBoard(slug, patch){
  var rec = board[slug] || { r: 0, o: "", d: "" };
  for (var k in patch) rec[k] = patch[k];
  rec.t = Date.now();

/* Login gate. The one password is the bridge key: it is established and
   checked server side by the bjvfi-text bridge through POST /login,
   which stores only its hash in KV. On the very first sign-in, when the
   bridge has no login password yet, that sign-in sets it; after that
   the bridge checks it and returns 401 for a wrong one. Nothing about
   the gate needs anyone to hand the value to this page's code, and the
   password is never a readable string in this page. On success it is
   stored on this device only, in the same local storage slot the old
   page used, and doubles as the login key. No leads or
   marks load before the gate passes. The Twilio values
   themselves are never entered here. */
var authed = false;
function enterApp(){
  authed = true;
  refreshStats();
  showView("homeView");
  bootData();
}
function signOut(silent){
  authed = false;
  try { localStorage.removeItem(TKEY_LS); } catch(e){}
  var inp = document.getElementById("loginPass");
  if (inp) inp.value = "";
  document.getElementById("loginStat").textContent = silent ? "" : "Wrong password";
  showView("loginView");
  gateHealth();
}
async function gateHealth(){
  var btn = document.getElementById("loginBtn");
  var st = document.getElementById("loginStat");
  try {
    var r = await fetch(TEXT_API + "/health");
    var j = await r.json();
    textConfigured = !!j.configured;
    if (!j.configured){ btn.textContent = "Sign in"; return; }
    btn.textContent = j.loginSet ? "Sign in" : "Set password";
  } catch(e){}
}
async function bootGate(){
  var key = textKey();
  if (!key){ showView("loginView"); gateHealth(); return; }
  try {
    var hr = await fetch(TEXT_API + "/health");
    var hj = await hr.json().catch(function(){ return {}; });
    textConfigured = !!hj.configured;
    if (hj.configured && hj.loginSet !== true){
      try { localStorage.removeItem(TKEY_LS); } catch(e){}
      showView("loginView");
      gateHealth();
      return;
    }
    var r = await fetch(TEXT_API + "/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: key }) });
    if (r.status === 401){
      try { localStorage.removeItem(TKEY_LS); } catch(e){}
      showView("loginView");
      document.getElementById("loginStat").textContent = "Wrong password";
      gateHealth();
      return;
    }
    if (r.status === 400){
      showView("loginView");
      document.getElementById("loginStat").textContent = "Sign in failed, try again";
      gateHealth();
      return;
    }
    if (r.ok) repliesState = "ok";
  } catch(e){ /* offline: a remembered device opens with its local data */ }
  enterApp();
}
async function doLogin(){
  var inp = document.getElementById("loginPass");
  var st = document.getElementById("loginStat");
  var btn = document.getElementById("loginBtn");
  var pw = inp.value;
  if (!pw){ st.textContent = "Password required"; return; }
  btn.disabled = true;
  st.textContent = "Checking";
  try {
    var r = await fetch(TEXT_API + "/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw }) });
    if (r.status === 401){ st.textContent = "Wrong password"; btn.disabled = false; gateHealth(); return; }
    if (r.status === 400){ st.textContent = "Sign in failed, try again"; btn.disabled = false; return; }
    if (!r.ok){ st.textContent = "Check failed"; btn.disabled = false; return; }
    try { localStorage.setItem(TKEY_LS, pw); } catch(e){}
    inp.value = "";
    st.textContent = "";
    btn.disabled = false;
    repliesState = "ok";
    enterApp();
  } catch(e){
    st.textContent = "Could not reach texting";
    btn.disabled = false;
  }
}
document.getElementById("loginBtn").addEventListener("click", function(){ doLogin(); });
document.getElementById("loginPass").addEventListener("keydown", function(e){ if (e.key === "Enter") doLogin(); });

function bootData(){
  setSyncLabel();
  fetch(DATA + "manifest.json").then(function(r){ return r.json(); }).then(async function(m){
    manifest = m;
    buildSortedCats();
    if (TOKEN){
      try {
        var idx = await ghGetJson(INDEX_PATH);
        if (idx && idx.data){ repoCounts = idx.data.cats || {}; }
        else repoCounts = {};
      } catch(e){ repoCounts = null; }
    }
    renderCatDrop();
    refreshStats();
    setSyncLabel();
    retryPending();
    loadBoard();
    checkTexting();
  }).catch(function(){
    document.getElementById("bizList").innerHTML = '<div class="msg">Could not load the database. Check your connection and reopen the page.</div>';
  });
}

document.getElementById("lockBtn").addEventListener("click", function(){ signOut(true); });

/* Boot: the gate comes first. */
showView("loginView");
bootGate();

</script>
