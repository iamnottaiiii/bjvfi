<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F2F2F5;
    --gold:#FFD24D;
    --blue:#6FA8FF;
    --red:#E07A7A;
    --panel:rgba(242,242,245,.05);
    --panel-strong:rgba(242,242,245,.09);
    --line:rgba(242,242,245,.14);
    --field:rgba(0,0,0,.38);
    --cx:50%; --cy:42%;
  }
  @media (prefers-color-scheme: light){
    :root{
      --ink:#111114;
      --panel:rgba(17,17,20,.05);
      --panel-strong:rgba(17,17,20,.09);
      --line:rgba(17,17,20,.16);
      --field:rgba(255,255,255,.5);
    }
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    background:#000; color:var(--ink); margin:0;
    position:fixed; inset:0; width:100%; overflow:hidden; overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
  }
  @media (prefers-color-scheme: light){ body{background:#d9d9d9;} }
  .void{position:fixed; inset:0; overflow:hidden;}
  .void::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      repeating-conic-gradient(from 0deg at var(--cx) var(--cy), rgba(255,255,255,.012) 0deg 1deg, transparent 1deg 2deg),
      repeating-radial-gradient(circle at var(--cx) var(--cy), rgba(255,255,255,.010) 0px 1px, transparent 1px 4px),
      radial-gradient(circle at var(--cx) var(--cy), #161616 0%, #0d0d0d 34%, #050505 62%, #010101 100%);
  }
  .void::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at var(--cx) var(--cy), transparent 0%, transparent 45%, rgba(0,0,0,.55) 82%, rgba(0,0,0,.9) 100%);
  }
  @media (prefers-color-scheme: light){
    .void::before{background:linear-gradient(155deg,#fbfbfb 0%,#e4e4e4 30%,#bcbcbc 62%,#d2d2d2 100%);}
    .void::after{background:radial-gradient(circle at var(--cx) var(--cy), transparent 0%, transparent 55%, rgba(0,0,0,.12) 100%);}
  }
  .layer{position:relative; z-index:1; height:100%; display:flex; flex-direction:column;}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
  a{color:inherit; text-decoration:none;}
  .top{padding:18px 16px 10px; display:flex; flex-direction:column; gap:12px;}
  .stats{display:flex; gap:8px; flex-wrap:wrap;}
  .stat{border:1px solid var(--line); background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-radius:999px; padding:8px 14px; font-size:.8rem;}
  .stat b{font-weight:700;}
  .stat.gold{color:var(--gold); border-color:var(--gold);}
  @media (prefers-color-scheme: light){ .stat.gold{color:#7a5b00;} }
  .search{
    width:100%; border-radius:999px; padding:12px 18px; font-size:1rem;
    border:1px solid var(--line); background:var(--field); color:var(--ink); font:inherit;
    outline:none;
  }
  .search::placeholder{color:var(--ink); opacity:.55;}
  .scroll{flex:1; overflow-y:auto; overscroll-behavior:contain; padding:4px 16px 40px; -webkit-overflow-scrolling:touch;}
  .cat{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:14px 6px; border-bottom:1px solid var(--line); font-size:.92rem;
  }
  .cat .nm{flex:1; min-width:0; overflow-wrap:anywhere;}
  .cat .ct{font-size:.78rem; opacity:.85; white-space:nowrap;}
  .cat .sn{font-size:.78rem; color:var(--gold); white-space:nowrap;}
  @media (prefers-color-scheme: light){ .cat .sn{color:#7a5b00;} }
  .row{padding:14px 6px; border-bottom:1px solid var(--line);}
  .row .nm{font-weight:700; font-size:.95rem; overflow-wrap:anywhere;}
  .row .dt{font-size:.83rem; margin-top:4px; overflow-wrap:anywhere;}
  .row .dt a{color:var(--blue);}
  .acts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .pill{
    border:1px solid var(--line); background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:999px; padding:8px 16px; font-size:.82rem; display:inline-flex; align-items:center; gap:6px;
  }
  .pill.sent{background:var(--gold); color:#191408; border-color:var(--gold); font-weight:700;}
  .pill.picked{background:var(--gold); color:#191408; border-color:var(--gold); font-weight:700;}
  .frm{display:flex; flex-direction:column; gap:10px; padding:6px;}
  .lab{font-size:.8rem; margin-top:8px;}
  .bdg{color:var(--gold); font-weight:700;}
  @media (prefers-color-scheme: light){ .bdg{color:#7a5b00;} }
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  .pill.sel{border-color:var(--ink); font-weight:700; background:var(--panel-strong);}
  .bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .bar .ttl{flex:1; min-width:0; font-weight:700; font-size:1rem; overflow-wrap:anywhere;}
  .more{width:100%; margin-top:16px; padding:13px; font-size:.9rem;}
  .msg{padding:22px 6px; font-size:.9rem;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="void"></div>
<div class="layer">

  <div id="homeView" style="display:flex; flex-direction:column; height:100%;">
    <div class="top">
      <div class="stats">
        <span class="stat"><b id="totalCount">...</b> businesses</span>
        <span class="stat gold"><b id="sentCount">0</b> sent</span>
        <span class="stat"><b id="leftCount">...</b> not sent</span>
        <span class="stat" id="syncStat">Device only</span>

        <button class="stat" id="repliesBtn" type="button">Replies <b class="bdg" id="replyCount"></b></button>
        <button class="stat" id="textingBtn" type="button">Set up texting</button>

      <div class="filters">
        <button class="pill sel" id="fAll" type="button">All</button>
        <button class="pill" id="fLeft" type="button">Not sent</button>

        <span class="stat" id="selCount">0 selected</span>
        <button class="pill" id="sendBtn" type="button">Send</button>

  <div id="textingView" class="hidden" style="display:flex; flex-direction:column; height:100%;">
    <div class="top">
      <div class="bar">
        <button class="pill" id="backBtn2" type="button">Back</button>
        <span class="ttl">Texting</span>
      </div>
    </div>
    <div class="scroll" id="textingBody"><div class="msg">Loading...</div></div>
  </div>

  <div id="repliesView" class="hidden" style="display:flex; flex-direction:column; height:100%;">
    <div class="top">
      <div class="bar">
        <button class="pill" id="backBtn3" type="button">Back</button>
        <span class="ttl">Replies</span>
        <button class="pill" id="refreshRepliesBtn" type="button">Refresh</button>
      </div>
    </div>
    <div class="scroll" id="repliesList"><div class="msg">Loading...</div></div>
  </div>

</div>
<script src="https://bjvfi.com/sitedesk/config.js"></script>
<script>
"use strict";
var DATA = "https://bjvfi.com/sitedesk/data/queue/";
var KEY = "bjvfi_database_sent_v1";
var PKEY = "bjvfi_database_pending_v1";
var sent = {};
try { sent = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { sent = {}; }
function saveSent(){ try { localStorage.setItem(KEY, JSON.stringify(sent)); } catch(e){} }

/* Repo sync, through the same data path SiteDesk uses. Marks live in
   iamnottaiiii/sitedesk-data under texting/: one shard per category plus a
   small index of counts. The local copy stays as a mirror so the page works
   offline, and anything that fails to sync stays pending and retries. */
var GH_API = "https://api.github.com/repos/iamnottaiiii/sitedesk-data";
var INDEX_PATH = "texting/index.json";
var TOKEN = (typeof SITEDESK_DATA_TOKEN !== "undefined" && SITEDESK_DATA_TOKEN) ? SITEDESK_DATA_TOKEN : null;
var pending = {};
try { pending = JSON.parse(localStorage.getItem(PKEY) || "{}") || {}; } catch(e) { pending = {}; }
function savePending(){ try { localStorage.setItem(PKEY, JSON.stringify(pending)); } catch(e){} }
var repoCounts = null;
var loadedShards = {};
var syncActive = 0, syncChain = Promise.resolve(), queuedOps = {}, opSeq = 0;

function setSyncLabel(){
  var el = document.getElementById("syncStat");
  if (!el) return;
  if (!TOKEN) el.textContent = "Device only";
  else if (syncActive > 0) el.textContent = "Saving";
  else if (Object.keys(pending).length) el.textContent = "Save failed";
  else el.textContent = "Repo sync";
}
function b64encode(bytes){
  var bin = "", b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  for (var i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
  return btoa(bin);
}
function b64decodeToBytes(b64){
  var bin = atob(String(b64).replace(/\s/g, ""));
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function ghHeaders(){
  return { "Accept": "application/vnd.github+json", "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" };
}
async function ghGetJson(path){
  var res = await fetch(GH_API + "/contents/" + path + "?ref=main", { method: "GET", cache: "no-store", headers: ghHeaders() });
  if (res.status === 404) return null;
  if (!res.ok){ var e = new Error("GitHub read failed (" + res.status + ")"); e.status = res.status; throw e; }
  var file = await res.json();
  return { data: JSON.parse(new TextDecoder().decode(b64decodeToBytes(file.content || ""))), sha: file.sha };
}
async function ghPutJson(path, obj, sha){
  var body = { message: "database: update " + path, content: b64encode(new TextEncoder().encode(JSON.stringify(obj, null, 2))) };
  if (sha) body.sha = sha;
  var res = await fetch(GH_API + "/contents/" + path, { method: "PUT", cache: "no-store", headers: ghHeaders(), body: JSON.stringify(body) });
  if (!res.ok){ var e2 = new Error("GitHub save failed (" + res.status + ")"); e2.status = res.status; throw e2; }
  return res.json();
}
/* Fresh read, change one thing, save with that read's sha. On a 409 or 422
   (someone else saved first) start over with a fresh read, up to 5 tries. */
async function ghUpdateJson(path, fallback, mutate){
  var lastErr = null;
  for (var attempt = 0; attempt < 5; attempt++){
    var cur = await ghGetJson(path);
    var data = cur ? cur.data : JSON.parse(JSON.stringify(fallback));
    mutate(data);
    try {
      await ghPutJson(path, data, cur ? cur.sha : null);
      return data;
    } catch(e){
      lastErr = e;
      if ((e.status === 409 || e.status === 422) && attempt < 4) continue;
      throw e;
    }
  }
  throw lastErr;
}
function shardPath(catName){
  return "texting/cats/" + manifest.cats[catName].files[0];
}
async function syncOp(op){
  var shard = await ghUpdateJson(shardPath(op.c), {}, function(data){
    if (op.mark) data[op.slug] = { t: op.t, n: op.n, p: op.p };
    else delete data[op.slug];
  });
  var count = Object.keys(shard).length;
  await ghUpdateJson(INDEX_PATH, { total: 0, cats: {} }, function(idx){
    idx.cats = idx.cats || {};
    if (count) idx.cats[op.c] = count; else delete idx.cats[op.c];
    var total = 0, k;
    for (k in idx.cats) total += idx.cats[k];
    idx.total = total;
    repoCounts = idx.cats;
  });
}
function enqueueSync(op){
  if (!TOKEN) { setSyncLabel(); return Promise.resolve(false); }
  if (queuedOps[op.id]) return Promise.resolve(false);
  queuedOps[op.id] = true;
  syncActive++;
  setSyncLabel();
  syncChain = syncChain.then(async function(){
    try {
      await syncOp(op);
      if (pending[op.slug] && pending[op.slug].id === op.id){ delete pending[op.slug]; savePending(); }
      return true;
    } catch(e){
      return false;
    } finally {
      syncActive--;
      delete queuedOps[op.id];
      setSyncLabel();
      refreshStats();
      if (manifest && !document.getElementById("homeView").classList.contains("hidden")) renderCats();
    }
  });
  return syncChain;
}
function retryPending(){
  if (!TOKEN || !manifest) return;
  Object.keys(pending).forEach(function(slug){ enqueueSync(pending[slug]); });
}
window.addEventListener("online", retryPending);
function mirrorCounts(){
  var mc = {}, k;
  for (k in sent){ var c = sent[k] && sent[k].c; if (c) mc[c] = (mc[c] || 0) + 1; }
  return mc;
}
function allCatCounts(){
  var mc = mirrorCounts(), out = {}, name;
  if (repoCounts) for (name in repoCounts) out[name] = repoCounts[name];
  for (name in mc){
    if (loadedShards[name] || pendingCat(name) || !(name in out)) out[name] = mc[name];
  }
  return out;
}
function pendingCat(name){
  var k;
  for (k in pending){ if (pending[k] && pending[k].c === name) return true; }
  return false;
}
function catSentCount(name){ return allCatCounts()[name] || 0; }
function sentTotal(){
  var counts = allCatCounts(), total = 0, name;
  for (name in counts) total += counts[name];
  return total;
}

var manifest = null;
var curCat = null, curRows = [], curFilter = "all", curQuery = "", shown = 0;
var PAGE = 100;

var WORDINGS = [
  function(n,u){ return "Hi, this is SiteDesk. We built a website for " + n + " and it is ready to look at: " + u + " No cost to view it. Want a quick walkthrough? Reply STOP to end"; },
  function(n,u){ return n + ", we made you a website. Take a look here: " + u + " If you like it, we can make it fully yours. From SiteDesk. Reply STOP to end"; },
  function(n,u){ return "Hello from SiteDesk. A website for " + n + " is already built: " + u + " Have a look and tell us what you think. Reply STOP to end"; },
  function(n,u){ return "Hi " + n + ", your website preview is live: " + u + " Built by SiteDesk, free to view. Any questions, just reply here. Reply STOP to end"; }
];
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmt(n){ return Number(n).toLocaleString("en-US"); }
/* Texting: the bjvfi-text Worker is the Twilio bridge. The Twilio config
   and the setup password live only on the Worker side. This page keeps
   just the unlock password in local storage and sends it as X-Text-Key.
   No Twilio value is ever in this page. */
var TEXT_API = "https://bjvfi-text.iamnottaiii.workers.dev";
var TKEY_LS = "bjvfi_text_key";
var SKEY_LS = "bjvfi_database_selection_v1";
var textConfigured = null;
var prevView = "home";
function textKey(){ try { return localStorage.getItem(TKEY_LS) || ""; } catch(e){ return ""; } }
function setTextKey(v){ try { if (v) localStorage.setItem(TKEY_LS, v); else localStorage.removeItem(TKEY_LS); } catch(e){} }
var selStore = {};
try { selStore = JSON.parse(localStorage.getItem(SKEY_LS) || "{}") || {}; } catch(e) { selStore = {}; }
var selSet = {};
function selPersist(){ try { localStorage.setItem(SKEY_LS, JSON.stringify(selStore)); } catch(e){} }
function selLoadFor(cat){
  selSet = {};
  var arr = selStore[cat] || [];
  arr.forEach(function(slug){ selSet[slug] = true; });
}
function selSaveFor(cat){
  var arr = Object.keys(selSet);
  if (arr.length) selStore[cat] = arr; else delete selStore[cat];
  selPersist();
}
function updateSelBar(){
  var n = Object.keys(selSet).length;
  document.getElementById("selBar").classList.toggle("hidden", n === 0);
  document.getElementById("selCount").textContent = fmt(n) + " selected";
}
function setMarked(slug, mark){
  var op;
  if (!mark && sent[slug]){
    var prev = sent[slug];
    delete sent[slug];
    op = { id: ++opSeq + "-" + Date.now(), slug: slug, c: curCat, mark: false, t: prev.t || 0, n: prev.n || "", p: prev.p || "" };
  } else if (mark && !sent[slug]){
    var row = null;
    curRows.forEach(function(r){ if (r[0] === slug) row = r; });
    var entry = { t: Date.now(), n: row ? (row[1]||"") : "", p: row ? (row[3]||"") : "", c: curCat };
    sent[slug] = entry;
    op = { id: ++opSeq + "-" + Date.now(), slug: slug, c: curCat, mark: true, t: entry.t, n: entry.n, p: entry.p };
  } else return;
  saveSent();
  if (TOKEN){ pending[slug] = op; savePending(); }
  enqueueSync(op);
}
function updateTextingPill(){
  var el = document.getElementById("textingBtn");
  if (!el) return;
  if (textConfigured === false) el.textContent = "Set up texting";
  else if (textConfigured === true && textKey()) el.textContent = "Texting ready";
  else if (textConfigured === true) el.textContent = "Texting locked";
  else el.textContent = "Set up texting";
}
function showView(name){
  ["homeView","catView","textingView","repliesView"].forEach(function(id){
    document.getElementById(id).classList.toggle("hidden", id !== name + "View");
  });
}
function goBack(){
  if (prevView === "cat" && curCat) showView("cat");
  else { showView("home"); renderCats(); refreshStats(); }
}
async function checkTexting(){
  try {
    var r = await fetch(TEXT_API + "/health");
    var j = await r.json();
    textConfigured = !!j.configured;
  } catch(e){ textConfigured = null; }
  updateTextingPill();
  if (textConfigured && textKey()) loadReplies(true);
}
function setupFormHtml(update){
  if (update){
    return '<div class="frm">'
      + '<div class="lab">New setup password</div><input class="search" id="updPass" type="password" autocomplete="new-password">'
      + '<div class="lab">Account SID</div><input class="search" id="updSid" type="text" autocomplete="off">'
      + '<div class="lab">Auth Token</div><input class="search" id="updToken" type="password" autocomplete="off">'
      + '<div class="lab">From number</div><input class="search" id="updFrom" type="tel" autocomplete="off">'
      + '<div class="acts"><button class="pill" id="updSave" type="button">Save</button></div>'
      + '<div class="msg" id="updStat"></div></div>';
  }
  return '<div class="frm">'
    + '<div class="lab">Setup password</div><input class="search" id="tsPass" type="password" autocomplete="new-password">'
    + '<div class="lab">Account SID</div><input class="search" id="tsSid" type="text" autocomplete="off">'
    + '<div class="lab">Auth Token</div><input class="search" id="tsToken" type="password" autocomplete="off">'
    + '<div class="lab">From number</div><input class="search" id="tsFrom" type="tel" autocomplete="off">'
    + '<div class="acts"><button class="pill" id="tsSave" type="button">Save</button></div>'
    + '<div class="msg" id="tsStat"></div></div>';
}
function wireSetupForm(update){
  var pre = update ? "upd" : "ts";
  document.getElementById(pre + "Save").addEventListener("click", async function(){
    var stat = document.getElementById(pre + "Stat");
    var payload;
    if (update){
      var np = document.getElementById("updPass").value;
      payload = { password: np || textKey(), currentPassword: textKey(),
        sid: document.getElementById("updSid").value, token: document.getElementById("updToken").value, from: document.getElementById("updFrom").value };
    } else {
      payload = { password: document.getElementById("tsPass").value,
        sid: document.getElementById("tsSid").value, token: document.getElementById("tsToken").value, from: document.getElementById("tsFrom").value };
    }
    stat.textContent = "Saving";
    try {
      var r = await fetch(TEXT_API + "/setup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      var j = await r.json().catch(function(){ return {}; });
      if (r.ok && j.ok){
        setTextKey(payload.password);
        textConfigured = true;
        updateTextingPill();
        renderTexting();
      } else stat.textContent = j.error || "Save failed";
    } catch(e){ stat.textContent = "Save failed"; }
  });
}
function unlockHtml(prefix){
  return '<div class="frm"><div class="lab">Setup password</div>'
    + '<input class="search" id="' + prefix + 'Pass" type="password" autocomplete="current-password">'
    + '<div class="acts"><button class="pill" id="' + prefix + 'Unlock" type="button">Unlock</button></div>'
    + '<div class="msg" id="' + prefix + 'Stat"></div></div>';
}
function wireUnlock(prefix, after){
  document.getElementById(prefix + "Unlock").addEventListener("click", async function(){
    var stat = document.getElementById(prefix + "Stat");
    var pw = document.getElementById(prefix + "Pass").value;
    if (!pw){ stat.textContent = "Password required"; return; }
    stat.textContent = "Checking";
    try {
      var r = await fetch(TEXT_API + "/replies", { headers: { "X-Text-Key": pw } });
      if (r.status === 401){ stat.textContent = "Wrong password"; return; }
      if (!r.ok){ stat.textContent = "Unlock failed"; return; }
      setTextKey(pw);
      updateTextingPill();
      after();
    } catch(e){ stat.textContent = "Unlock failed"; }
  });
}
function renderTexting(){
  var body = document.getElementById("textingBody");
  if (textConfigured === false){
    body.innerHTML = setupFormHtml(false);
    wireSetupForm(false);
  } else if (textConfigured === true && !textKey()){
    body.innerHTML = unlockHtml("tu");
    wireUnlock("tu", renderTexting);
  } else if (textConfigured === true){
    body.innerHTML = '<div class="frm"><div class="msg">Texting ready</div></div>' + setupFormHtml(true)
      + '<div class="frm"><div class="acts"><button class="pill" id="lockBtn" type="button">Lock</button></div></div>';
    wireSetupForm(true);
    document.getElementById("lockBtn").addEventListener("click", function(){
      setTextKey(""); updateTextingPill(); renderTexting();
    });
  } else {
    body.innerHTML = '<div class="msg">Loading...</div>';
    checkTexting().then(renderTexting);
  }
}
function openTexting(){
  prevView = document.getElementById("catView").classList.contains("hidden") ? "home" : "cat";
  showView("texting");
  renderTexting();
}
async function loadReplies(countOnly){
  var key = textKey();
  if (!key) return null;
  try {
    var r = await fetch(TEXT_API + "/replies", { headers: { "X-Text-Key": key } });
    if (r.status === 401){ updateTextingPill(); return null; }
    if (!r.ok) return null;
    var j = await r.json();
    var arr = j.replies || [];
    document.getElementById("replyCount").textContent = arr.length ? fmt(arr.length) : "";
    return arr;
  } catch(e){ return null; }
}
function renderRepliesList(arr){
  var el = document.getElementById("repliesList");
  if (!arr || !arr.length){ el.innerHTML = '<div class="msg">No replies yet.</div>'; return; }
  var html = "";
  arr.forEach(function(rep){
    var when = rep.t ? new Date(rep.t).toLocaleString("en-US") : "";
    html += '<div class="row">'
      + '<div class="nm">' + esc(rep.name || rep.from || "") + '</div>'
      + (rep.from ? '<div class="dt">' + esc(rep.from) + '</div>' : '')
      + (rep.body ? '<div class="dt">' + esc(rep.body) + '</div>' : '')
      + (when ? '<div class="dt">' + esc(when) + '</div>' : '')
      + (rep.slug ? '<div class="acts"><a class="pill" href="https://bjvfi.com/' + esc(rep.slug) + '/" target="_blank" rel="noopener">Site</a></div>' : '')
      + '</div>';
  });
  el.innerHTML = html;
}
async function openReplies(){
  prevView = "home";
  showView("replies");
  var el = document.getElementById("repliesList");
  if (textConfigured === true && !textKey()){
    el.innerHTML = unlockHtml("ru");
    wireUnlock("ru", openReplies);
    return;
  }
  el.innerHTML = '<div class="msg">Loading...</div>';
  var arr = await loadReplies(false);
  if (arr === null && !textKey()){
    el.innerHTML = unlockHtml("ru");
    wireUnlock("ru", openReplies);
    return;
  }
  renderRepliesList(arr || []);
}
async function sendSelected(){
  var stat = document.getElementById("sendStat");
  var slugs = curRows.map(function(r){ return r[0]; }).filter(function(slug){ return selSet[slug]; });
  if (!slugs.length) return;
  if (textConfigured === false || !textKey()){
    stat.textContent = "Set up texting";
    openTexting();
    return;
  }
  stat.textContent = "Sending";
  document.getElementById("sendBtn").disabled = true;
  var catFile = manifest.cats[curCat].files[0];
  var okCount = 0, failCount = 0, sawAuthProblem = false;
  try {
    for (var start = 0; start < slugs.length; start += 50){
      var chunk = slugs.slice(start, start + 50);
      var r = await fetch(TEXT_API + "/send", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Text-Key": textKey() },
        body: JSON.stringify({ catFile: catFile, slugs: chunk, catName: curCat })
      });
      var j = await r.json().catch(function(){ return {}; });
      if (r.status === 401 || (j && j.error === "not configured")){
        sawAuthProblem = true;
        break;
      }
      if (!r.ok || !j.results){ failCount += chunk.length; continue; }
      j.results.forEach(function(res){
        if (res.ok){
          okCount++;
          delete selSet[res.slug];
          setMarked(res.slug, true);
        } else failCount++;
      });
    }
  } catch(e){ failCount = slugs.length - okCount; }
  document.getElementById("sendBtn").disabled = false;
  if (sawAuthProblem){
    stat.textContent = "Set up texting";
    selSaveFor(curCat);
    openTexting();
    return;
  }
  selSaveFor(curCat);
  refreshStats();
  document.getElementById("catSent").textContent = fmt(catSentCount(curCat));
  updateSelBar();
  stat.textContent = fmt(okCount) + " sent" + (failCount ? ", " + fmt(failCount) + " failed" : "");
  renderBiz(false);
}



function refreshStats(){
  document.getElementById("sentCount").textContent = fmt(sentTotal());
  if (manifest){
    document.getElementById("totalCount").textContent = fmt(manifest.total);
    document.getElementById("leftCount").textContent = fmt(manifest.total - sentTotal());
  }
}
function renderCats(){
  var q = document.getElementById("catSearch").value.trim().toLowerCase();
  var names = Object.keys(manifest.cats).sort();
  var counts = allCatCounts();
  var html = "";
  names.forEach(function(name){
    if (q && name.toLowerCase().indexOf(q) === -1) return;
    var info = manifest.cats[name];
    var sc = counts[name] || 0;
    html += '<button class="cat" type="button" data-cat="' + esc(name) + '">'
      + '<span class="nm">' + esc(name) + '</span>'
      + (sc ? '<span class="sn">' + fmt(sc) + ' sent</span>' : '')
      + '<span class="ct">' + fmt(info.count) + '</span></button>';
  });
  document.getElementById("catList").innerHTML = html || '<div class="msg">No categories match.</div>';
  Array.prototype.forEach.call(document.querySelectorAll(".cat"), function(el){
    el.addEventListener("click", function(){ openCat(el.getAttribute("data-cat")); });
  });
}

function openCat(name){
  curCat = name; curRows = []; curFilter = "all"; curQuery = ""; shown = 0;
  document.getElementById("bizSearch").value = "";
  setFilter("all");
  document.getElementById("catTitle").textContent = name;
  selLoadFor(name);
  document.getElementById("sendStat").textContent = "";
  document.getElementById("homeView").classList.add("hidden");
  var cv = document.getElementById("catView");
  cv.classList.remove("hidden");
  document.getElementById("bizList").innerHTML = '<div class="msg">Loading...</div>';
  document.getElementById("catSent").textContent = fmt(catSentCount(name));
  if (TOKEN && !loadedShards[name]){
    ghGetJson(shardPath(name)).then(function(cur){
      if (curCat !== name) return;
      var shard = cur ? cur.data : {};
      loadedShards[name] = true;
      if (!repoCounts) repoCounts = {};
      repoCounts[name] = Object.keys(shard).length;
      var slug;
      for (slug in shard){ var v = shard[slug] || {}; sent[slug] = { t: v.t || 0, n: v.n || "", p: v.p || "", c: name }; }
      for (slug in sent){
        if (sent[slug] && sent[slug].c === name && !(slug in shard) && !pending[slug]) delete sent[slug];
      }
      saveSent(); refreshStats();
      document.getElementById("catSent").textContent = fmt(catSentCount(name));
      if (curRows.length) renderBiz(false);
    }).catch(function(){});
  }
  var file = manifest.cats[name].files[0];
  fetch(DATA + file).then(function(r){ return r.json(); }).then(function(rows){
    curRows = rows || [];
    if (manifest.cats[name].files.length > 1){
      var rest = manifest.cats[name].files.slice(1);
      var chain = Promise.resolve();
      rest.forEach(function(f){
        chain = chain.then(function(){ return fetch(DATA + f).then(function(r){ return r.json(); }).then(function(more){ curRows = curRows.concat(more || []); renderBiz(true); }); });
      });
    }
    renderBiz(true);
  }).catch(function(){
    document.getElementById("bizList").innerHTML = '<div class="msg">Could not load this category. Check your connection and try again.</div>';
  });
}

function filteredRows(){
  var q = curQuery.trim().toLowerCase();
  return curRows.filter(function(r){
    var isSent = !!sent[r[0]];
    if (curFilter === "sent" && !isSent) return false;
    if (curFilter === "left" && isSent) return false;
    if (q){
      var hay = ((r[1]||"") + " " + (r[3]||"") + " " + (r[4]||"")).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

function renderBiz(reset){
  if (reset) shown = PAGE;
  var rows = filteredRows();
  var slice = rows.slice(0, shown);
  var html = "";
  slice.forEach(function(r, i){
    var slug = r[0], name = r[1] || "", phone = r[3] || "", addr = r[4] || "";
    var url = "bjvfi.com/" + slug + "/";
    var isSent = !!sent[slug];
    var isSel = !!selSet[slug];
    var digits = phone.replace(/[^0-9+]/g, "");
    var body = WORDINGS[i % WORDINGS.length](name, url);
    html += '<div class="row">'
      + '<div class="nm">' + esc(name) + '</div>'
      + (phone ? '<div class="dt">' + esc(phone) + '</div>' : '')
      + (addr ? '<div class="dt">' + esc(addr) + '</div>' : '')
      + '<div class="acts">'
      + '<a class="pill" href="https://' + esc(url) + '" target="_blank" rel="noopener">Site</a>'
      + (digits ? '<a class="pill" href="sms:' + esc(digits) + '?&body=' + encodeURIComponent(body) + '">Text</a>' : '')
      + '<button class="pill' + (isSent ? ' sent' : '') + '" type="button" data-sent="' + esc(slug) + '">' + (isSent ? 'Sent' : 'Not sent') + '</button>'
      + '<button class="pill' + (isSel ? ' picked' : '') + '" type="button" data-select="' + esc(slug) + '">Select</button>'
      + '</div></div>';
  });
  if (!slice.length) html = '<div class="msg">Nothing here.</div>';
  if (rows.length > shown) html += '<button class="pill more" id="moreBtn" type="button">Show more (' + fmt(rows.length - shown) + ' more)</button>';
  var list = document.getElementById("bizList");
  list.innerHTML = html;
  Array.prototype.forEach.call(list.querySelectorAll("[data-sent]"), function(el){
    el.addEventListener("click", function(){
      var slug = el.getAttribute("data-sent");
      setMarked(slug, !sent[slug]);
      refreshStats();
      document.getElementById("catSent").textContent = fmt(catSentCount(curCat));
      renderBiz(false);
    });
  });
  Array.prototype.forEach.call(list.querySelectorAll("[data-select]"), function(el){
    el.addEventListener("click", function(){
      var slug = el.getAttribute("data-select");
      if (selSet[slug]) delete selSet[slug]; else selSet[slug] = true;
      selSaveFor(curCat);
      renderBiz(false);
    });
  });
  var mb = document.getElementById("moreBtn");
  if (mb) mb.addEventListener("click", function(){ shown += PAGE; renderBiz(false); });
  updateSelBar();
}

function setFilter(f){
  curFilter = f;
  [["fAll","all"],["fLeft","left"],["fSent","sent"]].forEach(function(pair){
    document.getElementById(pair[0]).classList.toggle("sel", pair[1] === f);
  });
}

document.getElementById("catSearch").addEventListener("input", renderCats);
document.getElementById("bizSearch").addEventListener("input", function(){
  curQuery = this.value; renderBiz(true);
});
document.getElementById("backBtn").addEventListener("click", function(){
  document.getElementById("catView").classList.add("hidden");
  document.getElementById("homeView").classList.remove("hidden");
  renderCats(); refreshStats();
});
document.getElementById("fAll").addEventListener("click", function(){ setFilter("all"); renderBiz(true); });
document.getElementById("fLeft").addEventListener("click", function(){ setFilter("left"); renderBiz(true); });
document.getElementById("fSent").addEventListener("click", function(){ setFilter("sent"); renderBiz(true); });
document.getElementById("textingBtn").addEventListener("click", openTexting);
document.getElementById("repliesBtn").addEventListener("click", openReplies);
document.getElementById("backBtn2").addEventListener("click", goBack);
document.getElementById("backBtn3").addEventListener("click", goBack);
document.getElementById("refreshRepliesBtn").addEventListener("click", function(){ openReplies(); });
document.getElementById("sendBtn").addEventListener("click", sendSelected);
document.getElementById("clearSelBtn").addEventListener("click", function(){ selSet = {}; selSaveFor(curCat); renderBiz(false); });
document.getElementById("exportBtn").addEventListener("click", function(){
  var lines = ["slug,name,phone,category,sent_at"];
  Object.keys(sent).forEach(function(slug){
    var v = sent[slug] || {};
    function q(x){ return '"' + String(x == null ? "" : x).replace(/"/g, '""') + '"'; }
    lines.push([q(slug), q(v.n), q(v.p), q(v.c), q(v.t ? new Date(v.t).toISOString() : "")].join(","));
  });
  var blob = new Blob([lines.join("\n")], {type:"text/csv"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sent-list.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
});

if (window.matchMedia && !window.matchMedia("(prefers-color-scheme: light)").matches){
  document.addEventListener("pointermove", function(e){
    if (e.pointerType === "touch") return;
    document.documentElement.style.setProperty("--cx", (e.clientX / window.innerWidth * 100) + "%");
    document.documentElement.style.setProperty("--cy", (e.clientY / window.innerHeight * 100) + "%");
  });
}

setSyncLabel();
fetch(DATA + "manifest.json").then(function(r){ return r.json(); }).then(async function(m){
  manifest = m;
  if (TOKEN){
    try {
      var idx = await ghGetJson(INDEX_PATH);
      if (idx && idx.data){ repoCounts = idx.data.cats || {}; }
      else repoCounts = {};
    } catch(e){ repoCounts = null; }
  }
  refreshStats(); renderCats(); setSyncLabel();
  retryPending();
  checkTexting();
}).catch(function(){
  document.getElementById("catList").innerHTML = '<div class="msg">Could not load the database. Check your connection and reopen the page.</div>';
});
</script>
