<!DOCTYPE html>
<html lang="en">
<head>

<script>
(function () {
  try {
    var host = location.hostname.toLowerCase();
    if (!host.endsWith(".bjvfi.com")) return;
    var sub = host.slice(0, -".bjvfi.com".length);
    if (!sub || sub === "www" || sub === "sitedesk") return;

    // Stay on https://sub.bjvfi.com/ — load that business page in place (no redirect)
    var slug = sub;
    var src = "https://bjvfi.com/" + encodeURIComponent(slug) + "/";

    // Avoid loops if someone already put a path on the subdomain
    var path = location.pathname || "/";
    if (path !== "/" && path !== "") return;

    document.documentElement.innerHTML = "<head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><title>Loading…</title><style>html,body{margin:0;height:100%;background:#000;color:#eee;font:14px system-ui}#bjvfi-boot{display:grid;place-items:center;height:100%}</style></head><body><div id=bjvfi-boot>Loading " + slug.replace(/[<>]/g,"") + "…</div></body>";

    fetch(src, { credentials: "omit", cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (html) {
        // Ensure relative assets resolve against the business folder
        if (!/<base\s/i.test(html)) {
          html = html.replace(
            /<head([^>]*)>/i,
            '<head$1><base href="' + src + '">'
          );
        }
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        // Fallback: embed so the subdomain URL still stays put
        document.documentElement.innerHTML =
          "<head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><title>" +
          slug +
          '</title><style>html,body,iframe{margin:0;border:0;height:100%;width:100%}iframe{display:block}</style></head><body><iframe src="' +
          src +
          '" title="' +
          slug.replace(/"/g, "") +
          '"></iframe></body>';
      });
  } catch (e) {}
})();
</script>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bjvfi</title>

<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png?v=20260911" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg?v=20260911" />
<link rel="shortcut icon" href="/favicon/favicon.ico?v=20260911" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png?v=20260911" />
<meta name="apple-mobile-web-app-title" content="bjvfi" />

<style>
@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap");

*{box-sizing:border-box; margin:0; padding:0;}
html, body { scrollbar-width: none; -ms-overflow-style: none; background:#000; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

body {
  min-height: 100vh;
  background: #000;
  color: #F2F2F5;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-weight: 400;
}

.bjvfi-void{
  --ink:#F2F2F5; --muted:#6B7080;
  min-height:100vh; background:#000; color:var(--ink);
  position:relative; overflow:hidden;
  display:block;
}
.bjvfi-void *{box-sizing:border-box;}

.bjvfi-void::before{
  content:""; position:absolute; inset:0;
  background:
    repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,.012) 0deg 1deg,
      transparent 1deg 2deg),
    repeating-radial-gradient(circle at 50% 50%,
      rgba(255,255,255,.010) 0px 1px,
      transparent 1px 4px),
    radial-gradient(circle at 50% 50%,
      #000 0%,
      #000 6%,
      #010101 11%,
      #050505 18%,
      #0d0d0d 26%,
      #161616 36%,
      #1f1f1f 48%,
      #262626 62%,
      #1f1f1f 78%,
      #0d0d0d 92%,
      #030303 100%);
  background-size: auto, auto, cover;
  pointer-events:none;
}
.bjvfi-void::after{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 50% 50%,
      transparent 0%,
      transparent 40%,
      rgba(0,0,0,.35) 75%,
      rgba(0,0,0,.95) 100%);
  pointer-events:none;
}

.bjvfi-mark{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:2;
  font-family:"JetBrains Mono", ui-monospace, monospace;
  font-weight: 400;
  font-size:clamp(3rem,10vw,5.2rem);
  letter-spacing:-.09em;
  margin:0; line-height:1;
  color:var(--ink);
  text-shadow:0 0 30px rgba(0,0,0,.9), 0 0 60px rgba(0,0,0,.7);
  pointer-events:none;
}

.bjvfi-stage{
  position:absolute;
  top:calc(50% + 90px);
  left:50%;
  transform:translateX(-50%);
  z-index:2;
  width:min(560px, calc(100% - 40px));
  display:flex; flex-direction:column; align-items:center; gap:16px;
}
.bjvfi-search-wrap{width:100%; position:relative;}

.bjvfi-search{
  width:100%;
  background: transparent;
  border: 0;
  outline: none;
  color:var(--ink);
  border-radius: 999px;
  padding: 16px 20px;
  font-size: 1rem;
  font-family: inherit;
  font-weight: 400;
  box-shadow: none;
  transition: none;
  text-align: center;
}
.bjvfi-search::placeholder{ color:#555; }
.bjvfi-search:focus,
.bjvfi-search:focus-visible{
  outline: none;
  border: 0;
  box-shadow: none;
  background: transparent;
}
.bjvfi-search::-webkit-search-decoration,
.bjvfi-search::-webkit-search-cancel-button,
.bjvfi-search::-webkit-search-results-button,
.bjvfi-search::-webkit-search-results-decoration {
  -webkit-appearance: none;
  appearance: none;
}

.bjvfi-results{
  display:none; position:absolute; left:0; right:0; top:calc(100% + 10px);
  background: transparent;
  border: 0;
  outline: none;
  border-radius: 0;
  max-height: min(52vh, 420px);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0;
  box-shadow: none;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.bjvfi-results::-webkit-scrollbar { display: none; width: 0; height: 0; }
.bjvfi-results.open{display:block;}
.bjvfi-results:focus,
.bjvfi-results:focus-visible{ outline:none; }

.bjvfi-hit{
  display:flex; flex-direction:column; gap:2px; text-decoration:none; color:inherit;
  padding:12px 14px; border-radius:12px; transition:background .12s;
  outline: none;
}
.bjvfi-hit:hover,
.bjvfi-hit:focus,
.bjvfi-hit:focus-visible{
  background: rgba(255,255,255,.05);
  outline: none;
}
.bjvfi-hit-title{font-weight:500; line-height:1.3;}
.bjvfi-hit-slug{color:#888; font-size:.82rem;}

.bjvfi-status{
  min-height:1.2em; color:#888; font-size:.82rem; text-align:center;
}
.bjvfi-status.error{color:#c8a0a0;}

@media (max-height: 620px) {
  .bjvfi-stage{ top:calc(50% + 70px); }
}
</style>
</head>
<body>
<div class="bjvfi-void">
  <h1 class="bjvfi-mark">bjvfi</h1>

  <div class="bjvfi-stage">
    <div class="bjvfi-search-wrap">
      <input class="bjvfi-search" id="bjvfi-search" type="search" placeholder="Search the business name" autocomplete="off" spellcheck="false">
      <div class="bjvfi-results" id="bjvfi-results" role="listbox" aria-label="Search results"></div>
    </div>
    <div class="bjvfi-status" id="bjvfi-status" aria-live="polite"></div>
  </div>
</div>

<script>
(function () {
  const GITHUB_USER = "iamnottaiiii";
  const GITHUB_REPO = "bjvfi";

  const IGNORE = new Set([
    ".github", ".git", "assets", "images", "img",
    "css", "js", "scripts", "node_modules", "favicon"
  ]);

  const input = document.getElementById("bjvfi-search");
  const results = document.getElementById("bjvfi-results");
  const statusEl = document.getElementById("bjvfi-status");
  if (!input || !results) return;

  let sites = null;
  let loading = null;

  async function fetchAllSites() {
    const chunkFiles = [
      "/sites-bjvfi1-p0.json", "/sites-bjvfi1-p1.json", "/sites-bjvfi1-p2.json", "/sites-bjvfi1-p3.json",
      "/sites-bjvfi2-p0.json", "/sites-bjvfi2-p1.json", "/sites-bjvfi2-p2.json", "/sites-bjvfi2-p3.json",
      "/sites-bjvfi3-p0.json", "/sites-bjvfi3-p1.json", "/sites-bjvfi3-p2.json", "/sites-bjvfi3-p3.json",
      "/sites-bjvfi4-p0.json", "/sites-bjvfi4-p1.json", "/sites-bjvfi4-p2.json", "/sites-bjvfi4-p3.json", "/sites-bjvfi4-p4.json",
      "/sites-bjvfi5-p0.json", "/sites-bjvfi5-p1.json", "/sites-bjvfi5-p2.json", "/sites-bjvfi5-p3.json"
    ];
    const urls = ["/sites.json"].concat(chunkFiles);
    const results = await Promise.all(urls.map(function(u){
      return fetch(u, { cache: "no-store" }).then(function(r){
        if (!r.ok) throw new Error("Could not load " + u + " (" + r.status + ")");
        return r.json();
      });
    }));
    const data = [];
    results.forEach(function(arr){ (Array.isArray(arr) ? arr : []).forEach(function(i){ data.push(i); }); });
    return data
      .map(item => ({
        title: item.n || item.s,
        slug: item.s,
        link: "/" + encodeURIComponent(item.s) + "/"
      }))
      .sort((a, b) => a.title.localeCompare(b.title));
  }

  function ensureLoaded() {
    if (sites) return Promise.resolve(sites);
    if (loading) return loading;
    statusEl.textContent = "Loading sites...";
    statusEl.classList.remove("error");
    loading = fetchAllSites()
      .then(list => {
        sites = list;
        statusEl.textContent = "";
        return sites;
      })
      .catch(err => {
        loading = null;
        statusEl.textContent = err?.message || "Load failed";
        statusEl.classList.add("error");
        throw err;
      });
    return loading;
  }

  function render(matches) {
    results.innerHTML = "";
    if (!matches.length) {
      results.classList.remove("open");
      statusEl.textContent = input.value.trim() ? "No matches" : "";
      return;
    }
    statusEl.textContent = "";
    matches.slice(0, 60).forEach(s => {
      const a = document.createElement("a");
      a.className = "bjvfi-hit";
      a.href = s.link;
      a.setAttribute("role", "option");

      const t = document.createElement("span");
      t.className = "bjvfi-hit-title";
      t.textContent = s.title;

      const sl = document.createElement("span");
      sl.className = "bjvfi-hit-slug";
      sl.textContent = "/" + s.slug;

      a.append(t, sl);
      results.appendChild(a);
    });
    results.classList.add("open");
  }

  function runSearch() {
    const q = input.value.trim().toLowerCase();
    if (!q) {
      results.classList.remove("open");
      results.innerHTML = "";
      statusEl.textContent = "";
      return;
    }
    ensureLoaded().then(list => {
      const matches = list.filter(s =>
        s.title.toLowerCase().includes(q) || s.slug.toLowerCase().includes(q)
      );
      render(matches);
    }).catch(() => {});
  }

  let timer = null;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(runSearch, 100);
  });
  input.addEventListener("focus", () => {
    ensureLoaded().catch(() => {});
    if (input.value.trim()) runSearch();
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".bjvfi-search-wrap")) results.classList.remove("open");
  });

  ensureLoaded().catch(() => {});
})();
</script>
</body>
</html>
