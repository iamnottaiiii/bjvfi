<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bjvfi</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap");

*{box-sizing:border-box; margin:0; padding:0;}
html, body { scrollbar-width: none; -ms-overflow-style: none; background:#000; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

body {
  min-height: 100vh;
  background: #000;
  color: #F2F2F5;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-weight: 400;
}

.bjvfi-void{
  --ink:#F2F2F5; --muted:#6B7080; --soft:#0A0A0C;
  min-height:100vh; background:#000; color:var(--ink);
  position:relative; overflow:hidden;
  display:block;
}
.bjvfi-void *{box-sizing:border-box;}

.bjvfi-void::before{
  content:""; position:absolute; inset:0;
  background:
    repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,.012) 0deg 1deg,
      transparent 1deg 2deg),
    repeating-radial-gradient(circle at 50% 50%,
      rgba(255,255,255,.010) 0px 1px,
      transparent 1px 4px),
    radial-gradient(circle at 50% 50%,
      #000 0%,
      #000 6%,
      #050506 11%,
      #0a0a0c 18%,
      #141416 26%,
      #1e1e21 36%,
      #26262a 48%,
      #2c2c30 62%,
      #26262a 78%,
      #141416 92%,
      #060607 100%);
  background-size: auto, auto, cover;
  pointer-events:none;
}

.bjvfi-void::after{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 50% 50%,
      transparent 0%,
      transparent 40%,
      rgba(0,0,0,.35) 75%,
      rgba(0,0,0,.9) 100%);
  pointer-events:none;
}

.bjvfi-mark{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:2;

  font-family:"JetBrains Mono", ui-monospace, monospace;
  font-weight: 400;
  font-size:clamp(3rem,10vw,5.2rem);
  letter-spacing:-.09em;      /* ← tightened from -.04em */
  margin:0; line-height:1;
  color:var(--ink);
  text-shadow:0 0 30px rgba(0,0,0,.9), 0 0 60px rgba(0,0,0,.7);
  pointer-events:none;
}

.bjvfi-stage{
  position:absolute;
  top:calc(50% + 110px);
  left:50%;
  transform:translateX(-50%);
  z-index:2;
  width:min(560px, calc(100% - 40px));
  display:flex; flex-direction:column; align-items:center; gap:16px;
}

.bjvfi-sub{
  margin:0; color:var(--muted); font-size:.9rem; letter-spacing:.02em;
  text-align:center;
  font-family:inherit;
}

.bjvfi-search-wrap{width:100%; position:relative;}

.bjvfi-search{
  width:100%;
  background:rgba(2,2,3,.9);
  border:1px solid rgba(255,255,255,.08);
  color:var(--ink);
  border-radius:999px;
  padding:16px 20px; font-size:1rem; outline:none;
  transition:border-color .2s, box-shadow .2s, background .2s;
  font-family:inherit;
  font-weight: 400;
  box-shadow:
    inset 0 2px 12px rgba(0,0,0,.9),
    0 0 30px rgba(0,0,0,.6);
}
.bjvfi-search::placeholder{color:#444853;}
.bjvfi-search:focus{
  border-color:rgba(255,255,255,.18);
  box-shadow:
    inset 0 2px 16px rgba(0,0,0,.95),
    0 0 0 4px rgba(255,255,255,.03);
}

.bjvfi-results{
  display:none; position:absolute; left:0; right:0; top:calc(100% + 10px);
  background:rgba(4,4,5,.98);
  border:1px solid rgba(255,255,255,.07);
  border-radius:18px;
  max-height:min(52vh,420px); overflow:auto; padding:6px;
  box-shadow:0 30px 70px rgba(0,0,0,.95);
}
.bjvfi-results.open{display:block;}

.bjvfi-hit{
  display:flex; flex-direction:column; gap:2px; text-decoration:none; color:inherit;
  padding:12px 14px; border-radius:12px; transition:background .12s;
}
.bjvfi-hit:hover,.bjvfi-hit:focus{
  background:rgba(255,255,255,.05); outline:none;
}
.bjvfi-hit-title{font-weight:500; line-height:1.3;}
.bjvfi-hit-slug{color:var(--muted); font-size:.82rem;}

.bjvfi-status{
  min-height:1.2em; color:var(--muted); font-size:.82rem; text-align:center;
}
.bjvfi-status.error{color:#c8a0a0;}

@media (max-height: 620px) {
  .bjvfi-stage{ top:calc(50% + 80px); }
}
</style>
</head>
<body>
<div class="bjvfi-void">
  <h1 class="bjvfi-mark">bjvfi</h1>

  <div class="bjvfi-stage">
    <p class="bjvfi-sub">Search a site</p>
    <div class="bjvfi-search-wrap">
      <input class="bjvfi-search" id="bjvfi-search" type="search" placeholder="Type a business name..." autocomplete="off" spellcheck="false">
      <div class="bjvfi-results" id="bjvfi-results" role="listbox" aria-label="Search results"></div>
    </div>
    <div class="bjvfi-status" id="bjvfi-status" aria-live="polite"></div>
  </div>
</div>

<script>
/* ==== PASTE YOUR CURRENT WORKING SCRIPT HERE ==== */
</script>
</body>
</html>
