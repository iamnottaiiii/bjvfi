*{box-sizing:border-box; margin:0; padding:0;}
html, body { scrollbar-width: none; -ms-overflow-style: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

body {
  min-height: 100vh;
  background: #050507;
  color: #F2F2F5;
  font-family: "Inter", system-ui, sans-serif;
}

.bjvfi-void{
  --bg:#050507; --ink:#F2F2F5; --muted:#6B7080; --line:#1C1C24; --soft:#121218; --accent:#7CFFB2;
  min-height:100vh; background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 20px 48px; position:relative; overflow:hidden;
}
.bjvfi-void *{box-sizing:border-box;}
.bjvfi-void::before{
  content:""; position:absolute; inset:-20%;
  background:
    radial-gradient(ellipse 50% 35% at 50% 42%, rgba(124,255,178,.07), transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 55%, rgba(167,139,250,.05), transparent 55%);
  pointer-events:none;
}
.bjvfi-stage{position:relative; z-index:1; width:min(560px,100%); display:flex; flex-direction:column; align-items:center; gap:28px;}
.bjvfi-mark{
  font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:clamp(3rem,10vw,5.2rem);
  letter-spacing:-.06em; margin:0; line-height:1; color:var(--ink);
  text-shadow:0 0 80px rgba(124,255,178,.12);
}
.bjvfi-sub{margin:0; color:var(--muted); font-size:.95rem; letter-spacing:.02em;}
.bjvfi-search-wrap{width:100%; position:relative;}
.bjvfi-search{
  width:100%; background:rgba(18,18,24,.9); border:1px solid var(--line); color:var(--ink);
  border-radius:999px; padding:16px 20px; font-size:1.05rem; outline:none;
  transition:border-color .15s, box-shadow .15s; font-family:inherit;
}
.bjvfi-search::placeholder{color:#555A68;}
.bjvfi-search:focus{border-color:rgba(124,255,178,.55); box-shadow:0 0 0 4px rgba(124,255,178,.1);}
.bjvfi-results{
  display:none; position:absolute; left:0; right:0; top:calc(100% + 10px);
  background:var(--soft); border:1px solid var(--line); border-radius:18px;
  max-height:min(52vh,420px); overflow:auto; padding:6px;
  box-shadow:0 24px 60px rgba(0,0,0,.55);
}
.bjvfi-results.open{display:block;}
.bjvfi-hit{
  display:flex; flex-direction:column; gap:2px; text-decoration:none; color:inherit;
  padding:12px 14px; border-radius:12px; transition:background .12s;
}
.bjvfi-hit:hover,.bjvfi-hit:focus{background:rgba(124,255,178,.08); outline:none;}
.bjvfi-hit-title{font-weight:600; line-height:1.3;}
.bjvfi-hit-slug{color:var(--muted); font-size:.85rem;}
.bjvfi-status{min-height:1.2em; color:var(--muted); font-size:.85rem; text-align:center;}
.bjvfi-status.error{color:#ff8f8f;}
</style>
</head>

  const input = document.getElementById("bjvfi-search");

  const statusEl = document.getElementById("bjvfi-status");
  if (!input || !results) return;

  let sites = null;
  let loading = null;
  const claimed = new Set();

  async function loadClaimed() {
    try {
      const res = await fetch(CLAIMS_API_URL, {
        headers: {
          apikey: CLAIMS_API_KEY,
          Authorization: `Bearer ${CLAIMS_API_KEY}`
        }
      });
      if (!res.ok) return;
      const rows = await res.json();
      rows.forEach(r => r?.sitekey && claimed.add(String(r.sitekey)));
    } catch (_) { /* registry down — show everything */ }
  }

  async function fetchAllSites() {
    const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${SITES_FOLDER}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Could not load sites (" + res.status + ")");
    const data = await res.json();

    const discovered = data
      .filter(item => item.type === "dir")
      .map(folder => {
        const title = folder.name
          .replace(/-/g, " ")
          .replace(/\b\w/g, c => c.toUpperCase());
        return {
          title,
          slug: folder.name,
          link: `./${SITES_FOLDER}/${encodeURIComponent(folder.name)}/`
        };
      });

    const orderIndex = new Map(SITE_ORDER.map((p, i) => [p, i]));
    const listed = discovered
      .filter(s => orderIndex.has(s.slug))
      .sort((a, b) => orderIndex.get(a.slug) - orderIndex.get(b.slug));
    const unlisted = discovered
      .filter(s => !orderIndex.has(s.slug))
      .sort((a, b) => a.title.localeCompare(b.title));

    return [...listed, ...unlisted];
  }

  function ensureLoaded() {
    if (sites) return Promise.resolve(sites);
    if (loading) return loading;
    statusEl.textContent = "Loading sites...";
    statusEl.classList.remove("error");
    loading = (async () => {
      await loadClaimed();
      const list = await fetchAllSites();
      sites = list.filter(s => !claimed.has(s.slug));
      statusEl.textContent = "";
      return sites;
    })().catch(err => {
      loading = null;
      statusEl.textContent = err?.message || "Load failed";
      statusEl.classList.add("error");
      throw err;
    });
    return loading;
  }

  function render(matches) {
    results.innerHTML = "";
    if (!matches.length) {
      results.classList.remove("open");
      statusEl.textContent = input.value.trim() ? "No matches" : "";
      return;
    }
    statusEl.textContent = "";
    matches.slice(0, 60).forEach(s => {
      const a = document.createElement("a");
      a.className = "bjvfi-hit";
      a.href = s.link;
      a.setAttribute("role", "option");

      const t = document.createElement("span");
      t.className = "bjvfi-hit-title";
      t.textContent = s.title;

      const sl = document.createElement("span");
      sl.className = "bjvfi-hit-slug";
      sl.textContent = "/" + s.slug;

      a.append(t, sl);
      results.appendChild(a);
    });
    results.classList.add("open");
  }

  function runSearch() {
    const q = input.value.trim().toLowerCase();
    if (!q) {
      results.classList.remove("open");
      results.innerHTML = "";
      statusEl.textContent = "";
      return;
    }
    ensureLoaded().then(list => {
      const matches = list.filter(s =>
        s.title.toLowerCase().includes(q) || s.slug.toLowerCase().includes(q)
      );
      render(matches);
    }).catch(() => {});
  }

  let timer = null;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(runSearch, 100);
  });
  input.addEventListener("focus", () => {
    ensureLoaded().catch(() => {});
    if (input.value.trim()) runSearch();
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".bjvfi-search-wrap")) results.classList.remove("open");
  });

  ensureLoaded().catch(() => {});
})();
