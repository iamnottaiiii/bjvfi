<!DOCTYPE html>
<html lang="en">
<head>

<script>
(function () {
  try {
    var host = location.hostname.toLowerCase();
    if (!host.endsWith(".bjvfi.com")) return;
    var sub = host.slice(0, -".bjvfi.com".length);
    if (!sub || sub === "www" || sub === "sitedesk") return;
    if (sub === "portal" || sub === "business") {
      location.replace("https://bjvfi.com/portal/");
      return;
    }

    // Only the root of a business subdomain is the business site.
    var path = location.pathname || "/";
    if (path !== "/" && path !== "") return;

    /* Load the business page in place on its own subdomain: the address
       stays {slug}.bjvfi.com, the tab takes the site's own title and icon,
       and relative page links are rewritten to the business's bjvfi
       address so moving around never lands on the GitHub name. */
    var seg = sub.toLowerCase();
    document.documentElement.innerHTML = "<head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><title>Loading " + seg + "</title><style>html,body{margin:0;height:100%;background:#000;color:#eee;font:15px system-ui}#bjvfi-boot{display:grid;place-items:center;height:100%}</style></head><body><div id=bjvfi-boot>Loading " + seg.replace(/</g, "") + "</div></body>";

    function isAbs(u) { return /^(?:[a-z][a-z0-9+.-]*:|\/\/|#)/i.test(u); }
    function resolveRel(rel) {
      var bits = rel.split("/");
      var out = [];
      for (var i = 0; i < bits.length; i++) {
        var p = bits[i];
        if (p === "" || p === ".") continue;
        if (p === "..") { out.pop(); continue; }
        out.push(p);
      }
      return out.join("/");
    }
    var folder = null;
    function absAsset(u) {
      if (!u || isAbs(u) || u.charAt(0) === "/") return u;
      return folder + resolveRel(u);
    }
    function canonPage(u) {
      if (!u || isAbs(u)) return u;
      if (u.charAt(0) === "/") return u;
      var r = resolveRel(u);
      if (r === "index.html") r = "";
      else if (r.slice(-11) === "/index.html") r = r.slice(0, -10);
      return "https://bjvfi.com/" + seg + "/" + r;
    }
    function rewriteAttr(tag, attr, fn) {
      var re = new RegExp("(\\b" + attr + "\\s*=\\s*)(\"([^\"]*)\"|'([^']*)')", "i");
      return tag.replace(re, function (m, pre, q, dq, sq) {
        var v = dq !== undefined ? dq : sq;
        var quote = q.charAt(0);
        return pre + quote + fn(v) + quote;
      });
    }
    function rewriteHtml(html) {
      html = html.replace(/<(img|script|source|video|audio|embed|track|input|link)\b[^>]*>/gi, function (tag, name) {
        var out = rewriteAttr(tag, "src", absAsset);
        out = rewriteAttr(out, "poster", absAsset);
        if (name.toLowerCase() === "link") out = rewriteAttr(out, "href", absAsset);
        out = out.replace(/\bsrcset\s*=\s*("([^"]*)"|'([^']*)')/i, function (m, q, dq, sq) {
          var v = dq !== undefined ? dq : sq;
          var fixed = v.split(",").map(function (cand) {
            var bits = cand.trim().split(/\s+/);
            if (bits[0]) bits[0] = absAsset(bits[0]);
            return bits.join(" ");
          }).join(", ");
          return "srcset=" + q.charAt(0) + fixed + q.charAt(0);
        });
        return out;
      });
      html = html.replace(/<(a|form)\b[^>]*>/gi, function (tag, name) {
        return rewriteAttr(tag, name.toLowerCase() === "a" ? "href" : "action", canonPage);
      });
      html = html.replace(/url\(\s*(['"]?)([^)'"]+)\1\s*\)/gi, function (m, q, u) {
        if (!u || isAbs(u) || u.charAt(0) === "/") return m;
        return "url(" + q + absAsset(u) + q + ")";
      });
      return html;
    }
    function extractIcon(html) {
      var tags = html.match(/<link\b[^>]*>/gi) || [];
      var fallback = null;
      for (var i = 0; i < tags.length; i++) {
        var rel = (tags[i].match(/\brel\s*=\s*("([^"]*)"|'([^']*)')/i) || []);
        var relVal = (rel[2] !== undefined ? rel[2] : rel[3] || "").toLowerCase();
        if (relVal.indexOf("icon") === -1) continue;
        var hrefM = tags[i].match(/\bhref\s*=\s*("([^"]*)"|'([^']*)')/i) || [];
        var href = hrefM[2] !== undefined ? hrefM[2] : hrefM[3];
        if (!href) continue;
        if (relVal === "icon" || relVal === "shortcut icon") return absAsset(href);
        if (!fallback) fallback = absAsset(href);
      }
      return fallback;
    }
    function applyIcon(href) {
      if (!href || !document.head) return;
      var old = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"]');
      for (var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
      var link = document.createElement("link");
      link.rel = "icon";
      link.href = href;
      document.head.appendChild(link);
    }

    fetch("/map/" + seg.slice(0, 2) + ".json", { cache: "force-cache" })
      .then(function (r) { if (!r.ok) throw new Error("map"); return r.json(); })
      .then(function (m) {
        var repo = m[seg];
        if (!repo) throw new Error("unknown");
        folder = "https://iamnottaiiii.github.io/" + repo + "/" + seg + "/";
        return fetch(folder, { credentials: "omit" }).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        });
      })
      .then(function (html) {
        var titleM = html.match(/<title[^>]*>([^<]*)<\/title>/i);
        var title = titleM && titleM[1].trim() ? titleM[1].trim() : seg;
        var icon = extractIcon(html);
        document.open();
        document.write(rewriteHtml(html));
        document.close();
        setTimeout(function () {
          try { document.title = title; } catch (e) {}
          applyIcon(icon);
        }, 0);
      })
      .catch(function () {
        var src = folder || ("https://bjvfi.com/" + seg + "/");
        document.documentElement.innerHTML =
          "<head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><title>" +
          seg +
          '</title><style>html,body,iframe{margin:0;border:0;height:100%;width:100%}iframe{display:block}</style></head><body><iframe src="' +
          src +
          '" title="' +
          seg.replace(/"/g, "") +
          '"></iframe></body>';
      });
  } catch (e) {}
})();
</script>

<style>
@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap");

*{box-sizing:border-box; margin:0; padding:0;}
html, body { scrollbar-width: none; -ms-overflow-style: none; background:#000; height:100%; overflow:hidden; overscroll-behavior:none; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

body {
  min-height: 100vh;
  background: #000;
  color: #F2F2F5;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-weight: 400;
}

.bjvfi-void{
  --ink:#F2F2F5; --muted:#6B7080; --cx:50%; --cy:50%;
  background:#000; color:var(--ink);
  position:fixed; inset:0; overflow:hidden;
  display:block;
}
.bjvfi-void *{box-sizing:border-box;}

.bjvfi-void::before{
  content:""; position:absolute; inset:0;
  background:
    repeating-conic-gradient(from 0deg at var(--cx) var(--cy),
      rgba(255,255,255,.012) 0deg 1deg,
      transparent 1deg 2deg),
    repeating-radial-gradient(circle at var(--cx) var(--cy),
      rgba(255,255,255,.010) 0px 1px,
      transparent 1px 4px),
    radial-gradient(circle at var(--cx) var(--cy),
      #000 0%,
      #000 6%,
      #010101 11%,
      #050505 18%,
      #0d0d0d 26%,
      #161616 36%,
      #1f1f1f 48%,
      #262626 62%,
      #1f1f1f 78%,
      #0d0d0d 92%,
      #030303 100%);
  background-size: auto, auto, cover;
  pointer-events:none;
}
.bjvfi-void::after{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at var(--cx) var(--cy),
      transparent 0%,
      transparent 40%,
      rgba(0,0,0,.35) 75%,
      rgba(0,0,0,.95) 100%);
  pointer-events:none;
}

.bjvfi-mark{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:2;
  font-family:"JetBrains Mono", ui-monospace, monospace;
  font-weight: 400;
  font-size:clamp(3rem,10vw,5.2rem);
  letter-spacing:-.09em;
  padding-left:.09em;
  margin:0; line-height:1;
  color:var(--ink);
  text-shadow:0 0 30px rgba(0,0,0,.9), 0 0 60px rgba(0,0,0,.7);
  pointer-events:none;
}

.bjvfi-stage{
  position:absolute;
  top:calc(50% + 90px);
  left:50%;
  transform:translateX(-50%);
  z-index:2;
  width:min(560px, calc(100% - 40px));
  display:flex; flex-direction:column; align-items:center; gap:16px;
}
.bjvfi-search-wrap{width:100%; position:relative;}

.bjvfi-search{
  display:block; width:100%; margin:0 auto;
  background: transparent;
  border: 0;
  outline: none;
  color:var(--ink);
  border-radius: 999px;
  padding: 16px 20px;
  font-size: 1rem;
  font-family: inherit;
  font-weight: 400;
  box-shadow: none;
  transition: none;
  text-align: center;
}
.bjvfi-search::placeholder{ color:#555; }
.bjvfi-search:focus,
.bjvfi-search:focus-visible{
  outline: none;
  border: 0;
  box-shadow: none;
  background: transparent;
}
.bjvfi-search::-webkit-search-decoration,
.bjvfi-search::-webkit-search-cancel-button,
.bjvfi-search::-webkit-search-results-button,
.bjvfi-search::-webkit-search-results-decoration {
  -webkit-appearance: none;
  appearance: none;
}

.bjvfi-results{
  display:none; position:absolute; left:0; right:0; top:calc(100% + 10px);
  background: transparent;
  border: 0;
  outline: none;
  border-radius: 0;
  max-height: min(52vh, 420px);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 0;
  box-shadow: none;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.bjvfi-results::-webkit-scrollbar { display: none; width: 0; height: 0; }
.bjvfi-results.open{display:block;}
.bjvfi-results:focus,
.bjvfi-results:focus-visible{ outline:none; }

.bjvfi-hit{
  display:flex; flex-direction:column; gap:2px; text-decoration:none; color:inherit;
  padding:12px 14px; border-radius:12px; transition:background .12s;
  outline: none;
}
.bjvfi-hit:hover,
.bjvfi-hit:focus,
.bjvfi-hit:focus-visible{
  background: rgba(255,255,255,.05);
  outline: none;
}
.bjvfi-hit-title{font-weight:500; line-height:1.3;}
.bjvfi-hit-slug{color:#888; font-size:.82rem;}

.bjvfi-status{
  min-height:1.2em; color:#888; font-size:.82rem; text-align:center;
}
.bjvfi-status.error{color:#c8a0a0;}

@media (max-height: 620px) {
  .bjvfi-stage{ top:calc(50% + 70px); }
  .bjvfi-results{ max-height:min(38vh, 300px); }
}

@media (prefers-color-scheme: light){
  html, body{ background:#fff; }
  body{ background:#fff; color:#111114; }
  .bjvfi-void{ --ink:#111114; --muted:#8a8a90; background:#fff; color:var(--ink); }
  .bjvfi-void::before{
    background:
      repeating-conic-gradient(from 0deg at var(--cx) var(--cy),
        rgba(0,0,0,.035) 0deg 1deg,
        transparent 1deg 2deg),
      repeating-radial-gradient(circle at var(--cx) var(--cy),
        rgba(0,0,0,.03) 0px 1px,
        transparent 1px 4px),
      radial-gradient(circle at var(--cx) var(--cy),
        #ffffff 0%, #ffffff 6%, #fbfbfb 11%, #f2f2f2 18%, #e4e4e4 26%,
        #d2d2d2 36%, #bcbcbc 48%, #aaaaaa 62%, #bcbcbc 78%,
        #e4e4e4 92%, #f2f2f2 100%);
  }
  .bjvfi-void::after{
    background:
      radial-gradient(circle at var(--cx) var(--cy),
        transparent 0%, transparent 45%,
        rgba(255,255,255,.35) 78%, rgba(255,255,255,.85) 100%);
  }
  .bjvfi-mark{ text-shadow:0 0 30px rgba(255,255,255,.9), 0 0 60px rgba(255,255,255,.7); }
  .bjvfi-search::placeholder{ color:#9a9aa0; }
  .bjvfi-hit:hover,
  .bjvfi-hit:focus,
  .bjvfi-hit:focus-visible{ background:rgba(0,0,0,.05); }
  .bjvfi-hit-slug{ color:#8a8a90; }
  .bjvfi-status{ color:#8a8a90; }
  .bjvfi-status.error{ color:#a06060; }
}
</style>
</head>
<body>
<div class="bjvfi-void">
  <h1 class="bjvfi-mark">bjvfi</h1>

  <div class="bjvfi-stage">
    <div class="bjvfi-search-wrap">
      <input class="bjvfi-search" id="bjvfi-search" type="search" placeholder="Search the business name" autocomplete="off" spellcheck="false">
      <div class="bjvfi-results" id="bjvfi-results" role="listbox" aria-label="Search results"></div>
    </div>
    <div class="bjvfi-status" id="bjvfi-status" aria-live="polite"></div>
  </div>
</div>

<script>
(function () {
  const input = document.getElementById("bjvfi-search");
  const results = document.getElementById("bjvfi-results");
  const statusEl = document.getElementById("bjvfi-status");
  if (!input || !results) return;

  /* Name data lives in one shard per first letter/number
     (/site-names/p.json etc.). Shards download in the background from
     page load (see preload below) and are cached, so searches filter a
     ready local list and answer instantly. */
  const shardCache = {};

  function prettySlug(s) {
    return s.split("-").map(function(w){
      return w ? w.charAt(0).toUpperCase() + w.slice(1) : w;
    }).join(" ");
  }

  function shardFor(q) {
    const m = q.toLowerCase().match(/[0-9a-z]/);
    return m ? m[0] : null;
  }

  const shardPromise = {};
  async function getShard(ch) {
    if (shardCache[ch]) return shardCache[ch];
    if (shardPromise[ch]) return shardPromise[ch];
    const p = (async () => {
      const r = await fetch("/site-names/" + ch + ".json", { cache: "force-cache" });
      if (!r.ok) throw new Error("Search is unavailable right now.");
      const obj = await r.json();
      const keys = Object.keys(obj);
      const list = new Array(keys.length);
      for (let i = 0; i < keys.length; i++) {
        const slug = keys[i];
        const title = obj[slug] || prettySlug(slug);
        /* lowercase once here, so the per-keystroke filter does no string allocs */
        list[i] = { title: title, slug: slug, _t: title.toLowerCase(), _s: slug.toLowerCase() };
      }
      shardCache[ch] = list;
      return list;
    })();
    shardPromise[ch] = p;
    try { return await p; } finally { delete shardPromise[ch]; }
  }

  /* Background preload: the moment the page opens, start downloading the
     name shards (most common first letters first, a few at a time) and
     hold them parsed and ready. Nothing is shown while this runs; the
     data just sits ready, so a search answers instantly instead of
     waiting on a multi megabyte download. A search typed before its
     letter has landed joins the same in-flight download. */
  (function preload() {
    const order = "seacmrtbpdhlfgwnojikuvqxyz0123456789";
    const letters = order.split("");
    let i = 0;
    function next() {
      if (i >= letters.length) return;
      const ch = letters[i++];
      getShard(ch).catch(() => {}).then(() => setTimeout(next, 30));
    }
    function start() {
      let n = 3;
      while (n-- > 0) next();
    }
    if ("requestIdleCallback" in window) requestIdleCallback(start, { timeout: 1200 });
    else setTimeout(start, 400);
  })();

  function render(matches) {
    results.innerHTML = "";
    if (!matches.length) {
      results.classList.remove("open");
      statusEl.textContent = input.value.trim() ? "No matches" : "";
      return;
    }
    statusEl.textContent = "";
    matches.slice(0, 60).forEach(s => {
      const a = document.createElement("a");
      a.className = "bjvfi-hit";
      a.href = "https://" + encodeURIComponent(s.slug) + ".bjvfi.com/";
      a.setAttribute("role", "option");

      const t = document.createElement("span");
      t.className = "bjvfi-hit-title";
      t.textContent = s.title;

      const sl = document.createElement("span");
      sl.className = "bjvfi-hit-slug";
      sl.textContent = s.slug + ".bjvfi.com";

      a.append(t, sl);
      results.appendChild(a);
    });
    results.classList.add("open");
  }

  /* Prefetch: start downloading the letter's shard the instant it is
     typed, so it is ready by the time the debounced search runs. */
  input.addEventListener("input", () => {
    const ch0 = shardFor(input.value.trim().toLowerCase());
    if (ch0) getShard(ch0).catch(() => {});
  });

  let timer = null;
  let searchId = 0;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const q = input.value.trim().toLowerCase();
      if (!q) {
        results.classList.remove("open");
        results.innerHTML = "";
        statusEl.textContent = "";
        return;
      }
      const ch = shardFor(q);
      if (!ch) {
        results.classList.remove("open");
        results.innerHTML = "";
        statusEl.textContent = "Type a letter or number to search.";
        return;
      }
      const myId = ++searchId;
      statusEl.textContent = "Searching...";
      statusEl.classList.remove("error");
      try {
        const list = await getShard(ch);
        if (myId !== searchId) return;
        const matches = [];
        for (let i = 0; i < list.length; i++) {
          const s = list[i];
          if (s._t.indexOf(q) !== -1 || s._s.indexOf(q) !== -1) matches.push(s);
        }
        render(matches);
      } catch (err) {
        if (myId !== searchId) return;
        results.classList.remove("open");
        results.innerHTML = "";
        statusEl.textContent = "Search is unavailable right now.";
        statusEl.classList.add("error");
      }
    }, 150);
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".bjvfi-search-wrap")) results.classList.remove("open");
  });
})();
</script>
<script>
(function(){
  var v = document.querySelector('.bjvfi-void');
  if(!v) return;
  var tx=50, ty=50, cx=50, cy=50;
  function point(x, y){
    var r = v.getBoundingClientRect();
    tx = ((x - r.left) / r.width) * 100;
    ty = ((y - r.top) / r.height) * 100;
  }
  document.addEventListener('mousemove', function(e){ point(e.clientX, e.clientY); }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(e.touches && e.touches[0]) point(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  document.addEventListener('mouseleave', function(){ tx=50; ty=50; });
  (function tick(){
    cx += (tx - cx) * 0.055;
    cy += (ty - cy) * 0.055;
    v.style.setProperty('--cx', cx + '%');
    v.style.setProperty('--cy', cy + '%');
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
