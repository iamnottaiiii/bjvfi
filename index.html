<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bjvfi</title>
<link rel="icon" type="image/png" href="/bjvfi/favicon.png">
<style>
@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap");

*{box-sizing:border-box; margin:0; padding:0;}
html, body { scrollbar-width: none; -ms-overflow-style: none; background:#000; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

body {
  min-height: 100vh;
  background: #000;
  color: #F2F2F5;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-weight: 400;
}

.bjvfi-void{
  --ink:#F2F2F5; --muted:#6B7080;
  min-height:100vh; background:#000; color:var(--ink);
  position:relative; overflow:hidden;
  display:block;
}
.bjvfi-void *{box-sizing:border-box;}

.bjvfi-void::before{
  content:""; position:absolute; inset:0;
  background:
    repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,.012) 0deg 1deg,
      transparent 1deg 2deg),
    repeating-radial-gradient(circle at 50% 50%,
      rgba(255,255,255,.010) 0px 1px,
      transparent 1px 4px),
    radial-gradient(circle at 50% 50%,
      #000 0%,
      #000 6%,
      #050506 11%,
      #0a0a0c 18%,
      #141416 26%,
      #1e1e21 36%,
      #26262a 48%,
      #2c2c30 62%,
      #26262a 78%,
      #141416 92%,
      #060607 100%);
  background-size: auto, auto, cover;
  pointer-events:none;
}
.bjvfi-void::after{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 50% 50%,
      transparent 0%,
      transparent 40%,
      rgba(0,0,0,.35) 75%,
      rgba(0,0,0,.9) 100%);
  pointer-events:none;
}

.bjvfi-mark{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:2;
  font-family:"JetBrains Mono", ui-monospace, monospace;
  font-weight: 400;
  font-size:clamp(3rem,10vw,5.2rem);
  letter-spacing:-.09em;
  margin:0; line-height:1;
  color:var(--ink);
  text-shadow:0 0 30px rgba(0,0,0,.9), 0 0 60px rgba(0,0,0,.7);
  pointer-events:none;
}

.bjvfi-stage{
  position:absolute;
  top:calc(50% + 110px);
  left:50%;
  transform:translateX(-50%);
  z-index:2;
  width:min(560px, calc(100% - 40px));
  display:flex; flex-direction:column; align-items:center; gap:16px;
}
.bjvfi-sub{
  margin:0; color:var(--muted); font-size:.9rem; letter-spacing:.02em;
  text-align:center;
}
.bjvfi-search-wrap{width:100%; position:relative;}

.bjvfi-search{
  width:100%;
  background: transparent;
  border: 0;
  outline: none;
  color:var(--ink);
  border-radius: 999px;
  padding: 16px 20px;
  font-size: 1rem;
  font-family: inherit;
  font-weight: 400;
  box-shadow: none;
  transition: none;
}
.bjvfi-search::placeholder{ color:#444853; }
.bjvfi-search:focus,
.bjvfi-search:focus-visible{
  outline: none;
  border: 0;
  box-shadow: none;
  background: transparent;
}
.bjvfi-search::-webkit-search-decoration,
.bjvfi-search::-webkit-search-cancel-button,
.bjvfi-search::-webkit-search-results-button,
.bjvfi-search::-webkit-search-results-decoration {
  -webkit-appearance: none;
  appearance: none;
}

.bjvfi-results{
  display:none; position:absolute; left:0; right:0; top:calc(100% + 10px);
  background: transparent;
  border: 0;
  outline: none;
  border-radius: 0;
  max-height: min(52vh, 420px);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0;
  box-shadow: none;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.bjvfi-results::-webkit-scrollbar { display: none; width: 0; height: 0; }
.bjvfi-results.open{display:block;}
.bjvfi-results:focus,
.bjvfi-results:focus-visible{ outline:none; }

.bjvfi-hit{
  display:flex; flex-direction:column; gap:2px; text-decoration:none; color:inherit;
  padding:12px 14px; border-radius:12px; transition:background .12s;
  outline: none;
}
.bjvfi-hit:hover,
.bjvfi-hit:focus,
.bjvfi-hit:focus-visible{
  background: rgba(255,255,255,.05);
  outline: none;
}
.bjvfi-hit-title{font-weight:500; line-height:1.3;}
.bjvfi-hit-slug{color:var(--muted); font-size:.82rem;}

.bjvfi-status{
  min-height:1.2em; color:var(--muted); font-size:.82rem; text-align:center;
}
.bjvfi-status.error{color:#c8a0a0;}

@media (max-height: 620px) {
  .bjvfi-stage{ top:calc(50% + 80px); }
}
</style>
</head>
<body>
<div class="bjvfi-void">
  <h1 class="bjvfi-mark">bjvfi</h1>

  <div class="bjvfi-stage">
    <p class="bjvfi-sub">Search a site</p>
    <div class="bjvfi-search-wrap">
      <input class="bjvfi-search" id="bjvfi-search" type="search" placeholder="Type a business name..." autocomplete="off" spellcheck="false">
      <div class="bjvfi-results" id="bjvfi-results" role="listbox" aria-label="Search results"></div>
    </div>
    <div class="bjvfi-status" id="bjvfi-status" aria-live="polite"></div>
  </div>
</div>

<script>
(function () {
  const GITHUB_USER = "iamnottaiiii";
  const GITHUB_REPO = "bjvfi";

  const IGNORE = new Set([
    ".github", ".git", "assets", "images", "img",
    "css", "js", "scripts", "node_modules"
  ]);

  const input = document.getElementById("bjvfi-search");
  const results = document.getElementById("bjvfi-results");
  const statusEl = document.getElementById("bjvfi-status");
  if (!input || !results) return;

  let sites = null;
  let loading = null;

  async function fetchAllSites() {
    const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Could not load sites (" + res.status + ")");
    const data = await res.json();

    return data
      .filter(item => item.type === "dir")
      .filter(item => !item.name.startsWith("."))
      .filter(item => !IGNORE.has(item.name))
      .map(folder => {
        const title = folder.name
          .replace(/-/g, " ")
          .replace(/\b\w/g, c => c.toUpperCase());
        return {
          title,
          slug: folder.name,
          link: `/${GITHUB_REPO}/${encodeURIComponent(folder.name)}/`
        };
      })
      .sort((a, b) => a.title.localeCompare(b.title));
  }

  function ensureLoaded() {
    if (sites) return Promise.resolve(sites);
    if (loading) return loading;
    statusEl.textContent = "Loading sites...";
    statusEl.classList.remove("error");
    loading = fetchAllSites()
      .then(list => {
        sites = list;
        statusEl.textContent = "";
        return sites;
      })
      .catch(err => {
        loading = null;
        statusEl.textContent = err?.message || "Load failed";
        statusEl.classList.add("error");
        throw err;
      });
    return loading;
  }

  function render(matches) {
    results.innerHTML = "";
    if (!matches.length) {
      results.classList.remove("open");
      statusEl.textContent = input.value.trim() ? "No matches" : "";
      return;
    }
    statusEl.textContent = "";
    matches.slice(0, 60).forEach(s => {
      const a = document.createElement("a");
      a.className = "bjvfi-hit";
      a.href = s.link;
      a.setAttribute("role", "option");

      const t = document.createElement("span");
      t.className = "bjvfi-hit-title";
      t.textContent = s.title;

      const sl = document.createElement("span");
      sl.className = "bjvfi-hit-slug";
      sl.textContent = "/" + s.slug;

      a.append(t, sl);
      results.appendChild(a);
    });
    results.classList.add("open");
  }

  function runSearch() {
    const q = input.value.trim().toLowerCase();
    if (!q) {
      results.classList.remove("open");
      results.innerHTML = "";
      statusEl.textContent = "";
      return;
    }
    ensureLoaded().then(list => {
      const matches = list.filter(s =>
        s.title.toLowerCase().includes(q) || s.slug.toLowerCase().includes(q)
      );
      render(matches);
    }).catch(() => {});
  }

  let timer = null;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(runSearch, 100);
  });
  input.addEventListener("focus", () => {
    ensureLoaded().catch(() => {});
    if (input.value.trim()) runSearch();
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".bjvfi-search-wrap")) results.classList.remove("open");
  });

  ensureLoaded().catch(() => {});
})();
</script>
</body>
</html>
