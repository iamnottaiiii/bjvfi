<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bjvfi · catalog</title>
<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png?v=20260911" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg?v=20260911" />
<link rel="shortcut icon" href="/favicon/favicon.ico?v=20260911" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png?v=20260911" />
<meta name="apple-mobile-web-app-title" content="bjvfi" />
<meta name="robots" content="noindex,nofollow" />
<meta name="description" content="Browse every business site on bjvfi." />
<style>
@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap");
*{box-sizing:border-box;margin:0;padding:0}
html,body{scrollbar-width:thin;scrollbar-color:#222 transparent;background:#000}
body{min-height:100vh;background:#000;color:#F2F2F5;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:400}
.bjvfi-void{--ink:#F2F2F5;--muted:#6B7080;--line:rgba(255,255,255,.08);min-height:100vh;background:#000;color:var(--ink);position:relative}
.bjvfi-void::before{content:"";position:fixed;inset:0;background:
  repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.012) 0deg 1deg,transparent 1deg 2deg),
  repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.010) 0px 1px,transparent 1px 4px),
  radial-gradient(circle at 50% 30%,#000 0%,#050505 18%,#0d0d0d 36%,#161616 55%,#0d0d0d 80%,#030303 100%);
  pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:min(1200px,calc(100% - 40px));margin:0 auto;padding:48px 0 80px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.brand a{color:inherit;text-decoration:none}
.brand h1{font-size:clamp(1.4rem,3.5vw,1.9rem);letter-spacing:-.07em;font-weight:400;line-height:1}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.nav input{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-size:.85rem;outline:none;width:220px;transition:border-color .15s,background .15s}
.nav input::placeholder{color:#666}
.nav input:focus{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.05)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.cat{appearance:none;background:rgba(255,255,255,.03);border:1px solid var(--line);color:#bbb;border-radius:999px;padding:7px 12px;font:inherit;font-size:.78rem;cursor:pointer}
.cat:hover{color:#fff}
.cat.active{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;min-height:148px;transition:background .12s,border-color .12s,transform .12s}
.card:hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.card .name{font-weight:500;font-size:1rem;line-height:1.35;letter-spacing:-.02em}
.card .slug{color:#777;font-size:.78rem}
.card .meta{margin-top:auto;display:flex;flex-direction:column;gap:4px;color:#9a9aa3;font-size:.78rem}
.card .pill{display:inline-block;align-self:flex-start;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:#cfcfd6;font-size:.72rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{color:var(--muted);font-size:.85rem;margin:18px 0;text-align:center}
.more{display:block;margin:28px auto 0;appearance:none;background:transparent;border:1px solid var(--line);color:#ddd;border-radius:999px;padding:12px 22px;font:inherit;cursor:pointer}
.more:hover{border-color:rgba(255,255,255,.28);color:#fff}
@media (max-width:560px){.wrap{width:calc(100% - 28px);padding-top:32px}.nav input{width:100%}}

/* password gate */
.bjvfi-void.app-locked{overflow:hidden}
.bjvfi-void.app-locked .wrap{display:none}
.bjvfi-void.app-locked .bjvfi-mark{display:block}
.bjvfi-void.app-locked .bjvfi-stage{display:flex}
.bjvfi-mark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:400;font-size:clamp(3rem,10vw,5.2rem);letter-spacing:-.09em;margin:0;line-height:1;color:var(--ink);text-shadow:0 0 30px rgba(0,0,0,.9),0 0 60px rgba(0,0,0,.7);pointer-events:none;display:none}
.bjvfi-stage{position:absolute;top:calc(50% + 90px);left:50%;transform:translateX(-50%);z-index:2;width:min(560px,calc(100% - 40px));display:none;flex-direction:column;align-items:center;gap:16px}
.bjvfi-search-wrap{width:100%;position:relative}
.bjvfi-search{width:100%;background:transparent;border:0;outline:none;color:var(--ink);border-radius:999px;padding:16px 20px;font-size:1rem;font-family:inherit;font-weight:400;box-shadow:none;text-align:center}
.bjvfi-search::placeholder{color:#555}
.bjvfi-search:focus,.bjvfi-search:focus-visible{outline:none;border:0;box-shadow:none;background:transparent}
.bjvfi-status{min-height:1.2em;color:#888;font-size:.82rem;text-align:center}
.bjvfi-status.error{color:#c8a0a0}
@media (max-height:620px){.bjvfi-stage{top:calc(50% + 70px)}}
</style>
</head>
<body>
<div class="bjvfi-void app-locked">
  <h1 class="bjvfi-mark">bjvfi</h1>
  <div class="bjvfi-stage">
    <div class="bjvfi-search-wrap">
      <form id="gate-form" autocomplete="off">
        <input class="bjvfi-search" id="gate-pass" type="password" name="password" placeholder="password" autofocus spellcheck="false" />
      </form>
    </div>
    <div class="bjvfi-status" id="gate-err" aria-live="polite"></div>
  </div>

  <div class="wrap">
    <div class="top">
      <div class="brand">
        <a href="/"><h1>bjvfi</h1></a>
      </div>
      <div class="nav">
        <input type="text" id="page-search" placeholder="search this page…" autocomplete="off" spellcheck="false" />
      </div>
    </div>

    <div class="cats" id="cats" aria-label="Total"></div>
    <div class="status" id="status">Loading catalog…</div>
    <div class="grid" id="grid"></div>
    <button class="more" id="more" hidden>Load more</button>
  </div>
</div>

<script>
(function(){
  const PAGE = 96;
  let all = [];
  let filtered = [];
  let query = '';
  let shown = 0;
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const more = document.getElementById('more');
  const catsEl = document.getElementById('cats');
  const searchEl = document.getElementById('page-search');

  function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  function renderTotal(){
    catsEl.innerHTML = `<button type="button" class="cat active" data-cat="All">${all.length}</button>`;
  }

  function applyFilter(){
    const q = query.trim().toLowerCase();
    filtered = all.filter(s=>{
      if (!q) return true;
      const name = String(s.n||s.s||'').toLowerCase();
      const slug = String(s.s||'').toLowerCase();
      return name.includes(q) || slug.includes(q);
    });
    shown = 0;
    grid.innerHTML = '';
    renderTotal();
    paintMore();
  }

  function paintMore(){
    const slice = filtered.slice(shown, shown+PAGE);
    const frag = document.createDocumentFragment();
    slice.forEach(s=>{
      const a = document.createElement('a');
      a.className = 'card';
      a.href = '/' + encodeURIComponent(s.s) + '/';
      const pill = s.c ? `<span class="pill">${esc(s.c)}</span>` : '';
      const phone = s.p ? `<span>${esc(s.p)}</span>` : '';
      const addr = s.a ? `<span>${esc(s.a)}</span>` : '';
      a.innerHTML = `${pill}<div class="name">${esc(s.n||s.s)}</div><div class="slug">/${esc(s.s)}</div><div class="meta">${phone}${addr}</div>`;
      frag.appendChild(a);
    });
    grid.appendChild(frag);
    shown += slice.length;
    more.hidden = shown >= filtered.length;
    if (filtered.length) status.textContent = `Showing ${shown.toLocaleString()} of ${filtered.length.toLocaleString()}`;
    else status.textContent = all.length ? 'No sites match' : 'No sites loaded';
  }

  searchEl.addEventListener('input', e=>{
    query = e.target.value;
    applyFilter();
  });

  more.addEventListener('click', paintMore);

  Promise.all([
    '/sites.json',
    '/sites-bjvfi1-p0.json', '/sites-bjvfi1-p1.json', '/sites-bjvfi1-p2.json', '/sites-bjvfi1-p3.json',
    '/sites-bjvfi2-p0.json', '/sites-bjvfi2-p1.json', '/sites-bjvfi2-p2.json', '/sites-bjvfi2-p3.json',
    '/sites-bjvfi3-p0.json', '/sites-bjvfi3-p1.json', '/sites-bjvfi3-p2.json', '/sites-bjvfi3-p3.json',
    '/sites-bjvfi4-p0.json', '/sites-bjvfi4-p1.json', '/sites-bjvfi4-p2.json', '/sites-bjvfi4-p3.json', '/sites-bjvfi4-p4.json',
    '/sites-bjvfi5-p0.json', '/sites-bjvfi5-p1.json', '/sites-bjvfi5-p2.json', '/sites-bjvfi5-p3.json'
  ].map(u=>fetch(u, {cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error('Could not load '+u+' ('+r.status+')'); return r.json(); })))
    .then(parts=>{
      all = [];
      parts.forEach(arr=>{ (Array.isArray(arr) ? arr : []).forEach(i=>all.push(i)); });
      all.sort((a,b)=>String(a.n||a.s).localeCompare(String(b.n||b.s)));
      applyFilter();
    })
    .catch(err=>{
      status.textContent = err.message || 'Load failed';
      status.style.color = '#c8a0a0';
    });
})();
</script>

<script>
(function(){
  const PASS = "bjvfi.com/bjvfi";
  const KEY = "bjvfi_catalog_ok";
  const root = document.querySelector(".bjvfi-void");
  const form = document.getElementById("gate-form");
  const input = document.getElementById("gate-pass");
  const err = document.getElementById("gate-err");

  let ok = false;
  try { ok = sessionStorage.getItem(KEY) === "1"; } catch(e) {}
  if (ok) { if (root) root.classList.remove("app-locked"); return; }
  if (!form || !input) return;

  form.addEventListener("submit", function(e){
    e.preventDefault();
    if ((input.value || "").trim() === PASS) {
      try { sessionStorage.setItem(KEY, "1"); } catch(e) {}
      if (err) { err.textContent = ""; err.classList.remove("error"); }
      if (root) root.classList.remove("app-locked");
    } else {
      if (err) { err.textContent = "Wrong password"; err.classList.add("error"); }
      input.select();
    }
  });
})();
</script>
</body>
</html>
