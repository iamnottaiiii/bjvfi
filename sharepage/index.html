<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>share</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; color: #F2F2F5; }
  body {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .word { font-size: 2rem; letter-spacing: -.05em; margin-bottom: 28px; }
  .box { width: min(560px, 100%); }
  .drop {
    border: 1px dashed rgba(255,255,255,.35); border-radius: 14px;
    padding: 44px 20px; text-align: center; cursor: pointer; color: #c9ccd4;
  }
  .drop:hover, .drop.over { border-color: #fff; color: #fff; }
  .files { margin-top: 20px; display: grid; gap: 8px; }
  .file {
    display: flex; justify-content: space-between; gap: 12px;
    border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 10px 14px;
    font-size: .85rem;
  }
  .file .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .s { color: #8a8f9c; flex: none; }
  .linkbox { margin-top: 22px; display: none; }
  .linkbox.show { display: block; }
  .linkrow { display: flex; gap: 8px; }
  .linkrow input {
    flex: 1; background: #0a0a0c; border: 1px solid rgba(255,255,255,.18);
    color: #F2F2F5; border-radius: 10px; padding: 11px 12px; font: inherit; font-size: .8rem;
    min-width: 0;
  }
  .btn {
    background: #F2F2F5; color: #000; border: 0; border-radius: 10px;
    padding: 11px 18px; font: inherit; font-size: .85rem; cursor: pointer; flex: none;
  }
  .btn.ghost { background: transparent; color: #F2F2F5; border: 1px solid rgba(255,255,255,.3); }
  .status { margin-top: 18px; color: #8a8f9c; font-size: .85rem; min-height: 1.2em; text-align: center; }
  .bar { height: 4px; background: rgba(255,255,255,.12); border-radius: 99px; margin-top: 14px; overflow: hidden; display: none; }
  .bar.show { display: block; }
  .bar i { display: block; height: 100%; width: 0%; background: #7ee2a0; }
  .save { color: #7ee2a0; text-decoration: none; flex: none; }
  input[type=file] { display: none; }
</style>
</head>
<body>
  <div class="word">share</div>
  <div class="box">
    <div class="drop" id="drop">drop files, or click to choose</div>
    <input type="file" id="picker" multiple>
    <div class="files" id="files"></div>
    <div class="linkbox" id="linkbox">
      <div class="linkrow">
        <input id="link" readonly value="">
        <button class="btn" id="copy">copy</button>
      </div>
    </div>
    <div class="bar" id="bar"><i id="barfill"></i></div>
    <div class="status" id="status"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  var CHUNK = 12 * 1024;
  var drop = document.getElementById('drop');
  var picker = document.getElementById('picker');
  var filesEl = document.getElementById('files');
  var linkbox = document.getElementById('linkbox');
  var linkInput = document.getElementById('link');
  var copyBtn = document.getElementById('copy');
  var statusEl = document.getElementById('status');
  var bar = document.getElementById('bar');
  var barfill = document.getElementById('barfill');

  function setStatus(t) { statusEl.textContent = t; }
  function human(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
    return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }
  function progress(done, total) {
    if (total > 0) { bar.classList.add('show'); barfill.style.width = Math.round(done / total * 100) + '%'; }
  }

  var code = (location.hash || '').replace('#', '').trim();
  if (code) receiverMode(code); else senderMode();

  /* ---------------- sender ---------------- */
  function senderMode() {
    var myFiles = [];
    var conn = null;
    var connGen = 0;
    var sending = false;
    var pumpingIdx = -1;
    var acked = {};
    var awaiting = {};
    var metaId = 0;
    var pendingMeta = false;
    var peer = null;
    var idRetries = 0;

    var alphabet = 'abcdefghjkmnpqrstuvwxyz23456789';
    function newCode() {
      var c = '';
      for (var i = 0; i < 6; i++) c += alphabet[Math.floor(Math.random() * alphabet.length)];
      return c;
    }
    var myCode = null;
    try { myCode = sessionStorage.getItem('shareCode'); } catch (e) { }
    if (!myCode) {
      myCode = newCode();
      try { sessionStorage.setItem('shareCode', myCode); } catch (e) { }
    }

    function allAcked() {
      if (!myFiles.length) return false;
      for (var i = 0; i < myFiles.length; i++) if (!acked[i]) return false;
      return true;
    }

    function register() {
      peer = new Peer('shr-' + myCode);
      peer.on('open', function () {
        idRetries = 0;
        linkInput.value = location.origin + location.pathname + '#' + myCode;
        linkbox.classList.add('show');
        if (!conn) setStatus('waiting for the other side');
      });
      peer.on('error', function (err) {
        if (err && err.type === 'unavailable-id' && idRetries < 10) {
          idRetries++;
          try { peer.destroy(); } catch (e) { }
          setTimeout(register, 2000);
          return;
        }
        if (err && err.type === 'unavailable-id') {
          myCode = newCode();
          try { sessionStorage.setItem('shareCode', myCode); } catch (e) { }
          idRetries = 0;
          try { peer.destroy(); } catch (e) { }
          setTimeout(register, 500);
          return;
        }
        setStatus('connection problem, refresh to try again');
      });
      peer.on('connection', function (c) {
        conn = c;
        connGen++;
        sending = false;
        pumpingIdx = -1;
        acked = {};
        awaiting = {};
        var gen = connGen;
        conn.on('open', function () { if (gen === connGen) setStatus('connected'); });
        conn.on('data', function (msg) {
          if (gen !== connGen) return;
          if (!msg || typeof msg !== 'object') return;
          if (msg.t === 'hello') { acked = {}; awaiting = {}; sendMeta(); }
          if (msg.t === 'have') { acked[msg.idx] = true; awaiting[msg.idx] = false; }
          if (msg.t === 'ready') trySend();
          if (msg.t === 'ack') {
            acked[msg.idx] = true;
            awaiting[msg.idx] = false;
            if (allAcked()) setStatus('sent');
          }
          if (msg.t === 'redo') {
            acked[msg.idx] = false;
            awaiting[msg.idx] = false;
            if (pumpingIdx !== msg.idx) trySend();
          }
        });
        conn.on('close', function () { if (gen === connGen) { sending = false; pumpingIdx = -1; awaiting = {}; setStatus('the other side left'); } });
      });
    }
    register();

    function fileList() {
      return myFiles.map(function (f) { return { name: f.name, size: f.size, type: f.type }; });
    }

    function sendMeta() {
      if (!conn || !conn.open) { pendingMeta = true; return; }
      metaId++;
      conn.send({ t: 'meta', mid: metaId, files: fileList() });
    }

    function trySend() {
      if (sending || !conn || !conn.open) return;
      if (pendingMeta) { pendingMeta = false; sendMeta(); return; }
      var idx = -1;
      for (var i = 0; i < myFiles.length; i++) if (!acked[i] && !awaiting[i]) { idx = i; break; }
      if (idx === -1) { if (myFiles.length && allAcked()) setStatus('sent'); return; }
      sending = true;
      pumpingIdx = idx;
      setStatus('sending');
      var gen = connGen;
      sendFile(idx, gen, function () {
        sending = false;
        pumpingIdx = -1;
        if (gen === connGen && !acked[idx]) {
          awaiting[idx] = true;
          setTimeout(function () {
            if (gen === connGen && !acked[idx]) { awaiting[idx] = false; trySend(); }
          }, 8000);
        }
        trySend();
      });
    }

    function sendFile(idx, gen, done) {
      var file = myFiles[idx];
      var offset = 0;
      conn.send({ t: 'start', mid: metaId, idx: idx, name: file.name, size: file.size, type: file.type });
      function finish() { done(); }
      function pump() {
        if (gen !== connGen || !conn || !conn.open) { finish(); return; }
        if (offset >= file.size) { conn.send({ t: 'end', idx: idx }); finish(); return; }
        var dc = conn.dataChannel;
        if (dc && dc.bufferedAmount > 4 * 1024 * 1024) { setTimeout(pump, 60); return; }
        var slice = file.slice(offset, Math.min(offset + CHUNK, file.size));
        var reader = new FileReader();
        reader.onload = function () {
          if (gen !== connGen || !conn || !conn.open) { finish(); return; }
          conn.send(reader.result);
          offset += slice.size;
          pump();
        };
        reader.onerror = function () { finish(); };
        reader.readAsArrayBuffer(slice);
      }
      if (file.size === 0) { conn.send({ t: 'end', idx: idx }); finish(); return; }
      pump();
    }

    drop.addEventListener('click', function () { picker.click(); });
    picker.addEventListener('change', function () { addFiles(picker.files); });
    ['dragover', 'dragenter'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) { addFiles(e.dataTransfer.files); });

    function addFiles(list) {
      for (var i = 0; i < list.length; i++) {
        myFiles.push(list[i]);
        var row = document.createElement('div');
        row.className = 'file';
        var n = document.createElement('span'); n.className = 'n'; n.textContent = list[i].name;
        var s = document.createElement('span'); s.className = 's'; s.textContent = human(list[i].size);
        row.appendChild(n); row.appendChild(s);
        filesEl.appendChild(row);
      }
      if (conn && conn.open) {
        if (sending) pendingMeta = true; else sendMeta();
      }
    }

    copyBtn.addEventListener('click', function () {
      linkInput.select();
      if (navigator.clipboard) navigator.clipboard.writeText(linkInput.value);
      copyBtn.textContent = 'copied';
      setTimeout(function () { copyBtn.textContent = 'copy'; }, 1200);
    });
  }

  /* ---------------- receiver ---------------- */
  function receiverMode(theCode) {
    drop.style.display = 'none';
    setStatus('connecting');
    var peer = null;
    var conn = null;
    var attempts = 0;
    var metaFiles = [];
    var metaMid = -1;
    var completed = {};
    var totalBytes = 0, gotBytes = 0;
    var cur = null;
    var chunkChain = Promise.resolve();
    var finishedAll = false;

    function isChunk(msg) {
      if (msg instanceof ArrayBuffer) return true;
      if (typeof ArrayBuffer !== 'undefined' && ArrayBuffer.isView && ArrayBuffer.isView(msg)) return true;
      if (typeof Blob !== 'undefined' && msg instanceof Blob) return true;
      return false;
    }

    function takeChunk(target, msg) {
      chunkChain = chunkChain.then(function () {
        if (msg instanceof Blob) return msg.arrayBuffer();
        return msg;
      }).then(function (data) {
        if (!target) return;
        target.parts.push(data);
        var len = (data && data.byteLength !== undefined) ? data.byteLength : 0;
        target.got += len; gotBytes += len; progress(gotBytes, totalBytes);
      });
      return chunkChain;
    }

    function allDone() {
      if (!metaFiles.length) return false;
      for (var i = 0; i < metaFiles.length; i++) if (!completed[i]) return false;
      return true;
    }

    function makePeer() {
      if (finishedAll) return;
      peer = new Peer();
      peer.on('open', function () { startConn(); });
      peer.on('error', function (err) {
        if (finishedAll) return;
        if (err && err.type === 'peer-unavailable') { retry(); return; }
        retry();
      });
    }

    var retryScheduled = false;
    function retry() {
      if (finishedAll || retryScheduled) return;
      retryScheduled = true;
      attempts++;
      if (attempts > 30) { setStatus('that link is dead, the sender closed it'); return; }
      setStatus('connecting');
      setTimeout(function () {
        retryScheduled = false;
        try { if (peer) peer.destroy(); } catch (e) { }
        makePeer();
      }, 4000);
    }

    function startConn() {
      conn = peer.connect('shr-' + theCode, { reliable: true });
      conn.on('open', function () {
        attempts = 0;
        setStatus('connected');
        conn.send({ t: 'hello' });
      });
      conn.on('data', onData);
      conn.on('close', function () { if (!finishedAll) retry(); });
    }

    function onData(msg) {
      if (isChunk(msg)) {
        if (cur) takeChunk(cur, msg);
        return;
      }
      if (!msg || typeof msg !== 'object') return;
      if (msg.t === 'meta') {
        if (!msg.files.length) { setStatus('waiting for files'); return; }
        finishedAll = false;
        metaMid = msg.mid;
        metaFiles = msg.files;
        totalBytes = metaFiles.reduce(function (a, f) { return a + f.size; }, 0);
        gotBytes = 0;
        for (var i = 0; i < metaFiles.length; i++) {
          if (completed[i]) { conn.send({ t: 'have', idx: i }); gotBytes += metaFiles[i].size; }
        }
        setStatus('receiving');
        conn.send({ t: 'ready' });
      }
      if (msg.t === 'start') {
        cur = { idx: msg.idx, name: msg.name, size: msg.size, type: msg.type, parts: [], got: 0 };
      }
      if (msg.t === 'end' && cur && cur.idx === msg.idx) {
        var finished = cur;
        cur = null;
        chunkChain.then(function () {
          if (finished.got === finished.size) {
            var blob = new Blob(finished.parts, { type: finished.type || 'application/octet-stream' });
            var url = URL.createObjectURL(blob);
            var row = document.createElement('div');
            row.className = 'file';
            var n = document.createElement('span'); n.className = 'n'; n.textContent = finished.name;
            var a = document.createElement('a');
            a.className = 'save'; a.href = url; a.download = finished.name; a.textContent = 'save · ' + human(finished.size);
            row.appendChild(n); row.appendChild(a);
            filesEl.appendChild(row);
            a.click();
            completed[finished.idx] = true;
            if (conn && conn.open) conn.send({ t: 'ack', idx: finished.idx });
            if (allDone()) { finishedAll = true; setStatus('done'); }
          } else {
            gotBytes -= finished.got;
            if (conn && conn.open) conn.send({ t: 'redo', idx: finished.idx });
            setStatus('receiving');
          }
        });
      }
    }

    makePeer();
  }
})();

</script>
</body>
</html>
