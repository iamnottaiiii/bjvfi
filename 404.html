<!DOCTYPE html>
<html lang="en">
<head>

<script>
(function () {
  try {
    var host = location.hostname.toLowerCase();
    if (!host.endsWith(".bjvfi.com")) return;
    var sub = host.slice(0, -".bjvfi.com".length);
    if (!sub || sub === "www" || sub === "sitedesk") return;
    // already on a path for this business
    var path = location.pathname || "/";
    if (path === "/" || path === "") {
      location.replace("https://bjvfi.com/" + encodeURIComponent(sub) + "/");
    }
  } catch (e) {}
})();
</script>

<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; URL='https://bjvfi.com/'">
<title>Redirecting...</title>
</head>
<body>
</body>
</html>
